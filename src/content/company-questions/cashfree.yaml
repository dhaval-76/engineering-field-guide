company: Cashfree
updated: 2026-11-09
overview:
  - 'Reports describe a **first coding round of about an hour on HackerRank**, then low-level design, then a hiring manager round, with each one eliminating candidates.'
  - 'Coding rounds are mostly one or two easy to medium problems, and one 2026 report names 2D DP and binary search.'
  - 'Design rounds **dig into concurrency**: be ready to write the locking for seat booking, not only describe it.'
  - 'Some reports add a **code review** task to the coding round, or a separate machine coding round.'
questions:
  - id: roman-to-int
    section: dsa
    title: 'Roman to Integer'
    difficulty: easy
    leetcode: roman-to-integer
    topic: dsa/arrays-and-hashing
    problem: 'Convert a Roman numeral to an integer. The symbols are I = 1, V = 5, X = 10, L = 50, C = 100, D = 500 and M = 1000. A smaller symbol before a larger one is subtracted, as in IV = 4 and CM = 900.'
    examples:
      - input: 's = "XLIV"'
        output: '44'
      - input: 's = "MMXXVI"'
        output: '2026'
    constraints:
      - '1 ≤ s.length ≤ 15'
      - 's is a valid numeral between 1 and 3999'
    solution: 'Add each symbol''s value, but subtract it when the next symbol is larger. One pass, no special cases for each pair.'
    complexity: 'O(n) time, O(1) space'
    code: cq-roman-to-int
    reports:
      - year: 2024
        source: https://leetcode.com/discuss/post/4942593/cashfree-payments-sde-2-4-yoe-reject-by-3ncw0/
      - year: 2025
        source: https://leetcode.com/discuss/post/7144760/cashfree-interview-experience-sde2-3-yoe-4gff/
  - id: capacity-ship
    section: dsa
    title: 'Capacity To Ship Packages Within D Days'
    difficulty: medium
    leetcode: capacity-to-ship-packages-within-d-days
    topic: dsa/binary-search
    problem: 'Packages on a conveyor belt must ship in the given order within `days` days. `weights[i]` is the weight of package `i`. Each day you load packages in order until the next one would exceed the ship''s capacity. Return the smallest capacity that ships everything in time.'
    examples:
      - input: 'weights = [3, 2, 2, 4, 1, 4], days = 3'
        output: '6'
        explanation: 'Days: [3,2] [2,4] [1,4].'
      - input: 'weights = [5, 1, 1, 1, 5], days = 2'
        output: '7'
        explanation: 'Days: [5,1,1] [1,5].'
    constraints:
      - '1 ≤ days ≤ weights.length ≤ 5 × 10⁴'
      - '1 ≤ weights[i] ≤ 500'
    solution: 'Binary search on the capacity between the heaviest package and the total weight. For each candidate, simulate the days greedily; if it fits, try smaller.'
    complexity: 'O(n log sum) time, O(1) space'
    code: dsa-ship-capacity
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/6830186/cashfree-payments-interview-experience-s-xb1c/
  - id: best-time-stock
    section: dsa
    title: 'Best Time to Buy and Sell Stock'
    difficulty: easy
    leetcode: best-time-to-buy-and-sell-stock
    topic: dsa/arrays-and-hashing
    problem: '`prices[i]` is a stock''s price on day `i`. Choose one day to buy and a later day to sell. Return the largest profit, or 0 if no profit is possible.'
    examples:
      - input: 'prices = [9, 2, 6, 1, 4]'
        output: '4'
        explanation: 'Buy at 2, sell at 6.'
      - input: 'prices = [8, 5, 3]'
        output: '0'
    constraints:
      - '1 ≤ prices.length ≤ 10⁵'
    solution: 'Track the cheapest price so far and the best profit from selling today. One pass. The candidate who answered with O(n²) was rejected, so lead with this.'
    complexity: 'O(n) time, O(1) space'
    code: cq-best-time-stock
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/6830186/cashfree-payments-interview-experience-s-xb1c/
  - id: common-slots
    section: dsa
    title: 'Common Free Time for Everyone'
    difficulty: medium
    leetcode: interval-list-intersections
    topic: dsa/intervals
    problem: 'Several celebrities each give a list of time slots `[start, end)` when they are available, sorted and not overlapping. Return every interval when all of them are available at the same time.'
    examples:
      - input: 'slots = [[[1,5], [8,12]], [[3,9]], [[4,10]]]'
        output: '[[4,5], [8,9]]'
    constraints:
      - '1 ≤ number of people ≤ 100'
      - 'Up to 10⁴ slots in total'
    solution: 'Intersect the lists two at a time. With two pointers, the overlap of two slots is `[max(starts), min(ends))`; then advance whichever slot ends first, because it cannot overlap anything later. If slots might overlap or be unsorted, sort and merge each list first.'
    complexity: 'O(total slots x people) time'
    code: cq-common-slots
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/7316892/cashfree-payments-sde-2-rejected-by-piyu-2ver/
  - id: free-slots
    section: dsa
    title: 'Free Slots in a Working Day'
    difficulty: medium
    leetcode: merge-intervals
    topic: dsa/intervals
    problem: 'A working day runs from `dayStart` to `dayEnd`. Given the day''s meetings, which may overlap and are unsorted, return the free slots. If meetings overlap, the employee attends both.'
    examples:
      - input: 'dayStart = 8, dayEnd = 17, meetings = [[10,11], [9,10], [10,12], [16,18]]'
        output: '[[8,9], [12,16]]'
    constraints:
      - '0 ≤ meetings.length ≤ 10⁴'
    solution: 'This is merge intervals in disguise, as the report noted. Sort by start and sweep a cursor from the start of the day: a meeting that starts after the cursor leaves a gap, and every meeting pushes the cursor to its end. Clip to the end of the day.'
    complexity: 'O(n log n) time'
    code: cq-free-slots
    reports:
      - year: 2021
        source: https://leetcode.com/discuss/post/1532098/cashfree-sde-2-interview-by-anonymous_us-6v80/
  - id: pair-divisible
    section: dsa
    title: 'Pair of Songs Divisible by 120'
    difficulty: medium
    leetcode: pairs-of-songs-with-total-durations-divisible-by-60
    topic: dsa/arrays-and-hashing
    problem: 'Given song durations in seconds, return the indices of any two songs whose total duration is divisible by 120, or an empty array if there are none.'
    examples:
      - input: 'durations = [50, 70, 10]'
        output: '[0, 1]'
        explanation: '50 + 70 = 120.'
      - input: 'durations = [1, 2]'
        output: '[]'
    constraints:
      - '2 ≤ durations.length ≤ 6 × 10⁴'
      - '1 ≤ durations[i] ≤ 500'
    solution: 'Only the remainder mod 120 matters. For a duration with remainder `r`, look for an earlier one with remainder `(120 - r) % 120`; the extra `% 120` pairs 0 with 0. A map from remainder to index makes it one pass. To count all pairs instead, store counts.'
    complexity: 'O(n) time, O(120) space'
    code: cq-pair-divisible
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/7157080/cashfree-payments-sde-2-by-anonymous_use-gcvv/
  - id: delayed-flights
    section: dsa
    title: 'Flights Affected by Delays'
    topic: dsa/graphs-bfs-dfs
    problem: 'Some flights can only leave after another flight arrives, given as pairs `[a, b]` meaning `b` waits for `a`. Given the flights already delayed, return every other flight that will be delayed as a result.'
    examples:
      - input: 'dependencies = [["A","B"], ["B","C"], ["D","E"], ["C","A"]], delayed = ["A"]'
        output: '["B", "C"]'
        explanation: 'D and E are unaffected; the cycle back to A adds nothing new.'
    constraints:
      - 'Up to 10⁴ flights'
      - 'Dependencies can form cycles'
    solution: 'Multi-source BFS from the delayed flights along the dependency edges, with a visited set so cycles end. Everything reached, other than the starting flights, is affected.'
    complexity: 'O(V + E) time and space'
    code: cq-delayed-flights
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/7157080/cashfree-payments-sde-2-by-anonymous_use-gcvv/
  - id: k-closest
    section: dsa
    title: 'Find K Closest Elements'
    difficulty: medium
    leetcode: find-k-closest-elements
    topic: dsa/binary-search
    problem: 'Given a sorted array `arr`, return the `k` values closest to `x`, sorted ascending. If two values are equally close, prefer the smaller one.'
    examples:
      - input: 'arr = [1, 3, 7, 8, 10], k = 2, x = 6'
        output: '[7, 8]'
      - input: 'arr = [23, 45, 67, 98], k = 2, x = 75'
        output: '[67, 98]'
    constraints:
      - '1 ≤ k ≤ arr.length ≤ 10⁴'
      - 'arr is sorted ascending'
    solution: 'The answer is a window of `k` consecutive elements. Binary search its left edge `lo` in `[0, n - k]`: if `x - arr[mid]` is greater than `arr[mid + k] - x`, the window should move right.'
    complexity: 'O(log(n - k) + k) time'
    code: cq-k-closest-elements
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/6858233/cashfree-interview-experience-by-codedom-7p01/
  - id: trains-between
    section: dsa
    title: 'Trains Between Two Stations'
    topic: dsa/arrays-and-hashing
    problem: 'You are given the stops of every train: `{train, station, arrival, departure}`, with times as HHMM. Given two stations, return the trains that go from the first to the second, ordered by journey time from shortest to longest.'
    examples:
      - input: 'stops for T1 to T4 as in the report, from = S1, to = S3'
        output: '[T4, T1]'
        explanation: 'T4 takes 2 h 55 m and T1 takes 2 h 58 m. T2 never stops at S3, and T3 never stops at S1.'
    constraints:
      - 'Up to 10⁴ stops'
      - 'A train visits a station at most once'
    solution: 'For each train, record its departure from the first station and its arrival at the second. Keep trains that have both, with the departure first, and sort by the difference in minutes (convert HHMM first). The report''s own sample listed T1 before T4, so confirm the ordering with your interviewer.'
    complexity: 'O(n log n) time, O(n) space'
    code: cq-trains-between
    reports:
      - year: 2024
        source: https://leetcode.com/discuss/post/4795525/cashfree-sde2-by-anonymous_user-wyou/
  - id: four-sum
    section: dsa
    title: '4Sum'
    difficulty: medium
    leetcode: 4sum
    topic: dsa/two-pointers
    problem: 'Return every unique set of four numbers from `nums` that adds up to `target`. The answer must not contain duplicate sets.'
    examples:
      - input: 'nums = [2, -1, 0, 1, -2, 0], target = 0'
        output: '[[-2,-1,1,2], [-2,0,0,2], [-1,0,0,1]]'
      - input: 'nums = [3, 3, 3, 3, 3], target = 12'
        output: '[[3,3,3,3]]'
    constraints:
      - '1 ≤ nums.length ≤ 200'
      - '-10⁹ ≤ nums[i], target ≤ 10⁹'
    solution: 'Sort, fix two numbers with nested loops, and find the other two with two pointers. Skip equal values at every level to avoid duplicate sets. Add as `long`, because four values near 10⁹ overflow an `int`. The report called out both points.'
    complexity: 'O(n cubed) time, O(1) extra space'
    code: cq-four-sum
    reports:
      - year: 2021
        source: https://leetcode.com/discuss/post/1532098/cashfree-sde-2-interview-by-anonymous_us-6v80/
  - id: next-palindrome
    section: dsa
    title: 'Next Palindrome'
    topic: dsa/two-pointers
    problem: 'Given a positive number as a string, return the smallest palindrome strictly greater than it.'
    examples:
      - input: 'n = "12301"'
        output: '"12321"'
      - input: 'n = "12321"'
        output: '"12421"'
      - input: 'n = "999"'
        output: '"1001"'
    constraints:
      - '1 ≤ n.length ≤ 18'
      - 'n has no leading zeros'
    solution: 'Mirror the left half (including the middle digit) onto the right. If that is bigger than `n`, it is the answer. Otherwise add one to the left half and mirror again. If the left half was all nines, the answer has one more digit: `10…01`.'
    complexity: 'O(digits) time'
    code: cq-next-palindrome
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2748580/cashfree-sde-3-bangalore-india-aug-2022-g0f8b/
  - id: base-convert
    section: dsa
    title: 'Convert a Number Between Bases'
    topic: dsa/bit-manipulation
    problem: |-
      Convert a number written in base `from` to base `to`. Bases are between 2 and 36, and digits above 9 are letters.

      This round was in Java only.
    examples:
      - input: 'number = "ff", from = 16, to = 2'
        output: '"11111111"'
      - input: 'number = "255", from = 10, to = 16'
        output: '"ff"'
    constraints:
      - 'The value fits in a 64-bit integer'
    solution: 'Parse to a value with `value = value × from + digit`. Then repeatedly take `value % to` as the next digit from the right and divide by `to`, and reverse at the end. Handle zero separately. In Java, `Long.parseLong` and `Long.toString(value, radix)` do both steps, but write it by hand first.'
    complexity: 'O(digits) time'
    code: cq-base-convert
    reports:
      - year: 2023
        source: https://leetcode.com/discuss/post/3892914/ps-interview-2-cashfree-experience-by-an-25di/
  - id: timezone
    section: dsa
    title: 'Convert a Time Between Time Zones'
    topic: dsa/approaching-problems
    problem: 'Convert a time from one time zone to another. The report gives no more detail, so expect to set the input format yourself.'
    solution: 'Ask: is a date included, and does daylight saving matter? With a library: parse to `ZonedDateTime` and call `withZoneSameInstant(targetZone)`. By hand with fixed offsets: convert to minutes since midnight, add the offset difference, wrap with `((m % 1440) + 1440) % 1440`, and report a day change.'
    reports:
      - year: 2023
        source: https://leetcode.com/discuss/post/3892914/ps-interview-2-cashfree-experience-by-an-25di/
  - id: priority-queue
    section: dsa
    title: 'Implement a Priority Queue'
    topic: dsa/heaps-and-top-k
    problem: 'Implement a priority queue that works: `push`, `pop` (smallest first), `peek` and `size`. This was a coding and code review round that also looks at error handling, thread safety and readable code.'
    solution: 'An array-backed binary heap. `push` adds at the end and sifts up; `pop` moves the last element to the root and sifts down. Grow the array when full, and throw on popping an empty queue. For thread safety, discuss a lock around each operation or `PriorityBlockingQueue`.'
    complexity: 'O(log n) push and pop, O(1) peek'
    code: dsa-heap-impl
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/1695288/cashfree-sde3-coding-and-code-review-imp-h3mc/
  - id: palindromic-substrings
    section: dsa
    title: 'Palindromic Substrings'
    difficulty: medium
    leetcode: palindromic-substrings
    topic: dsa/dynamic-programming
    problem: 'Return the number of substrings of `s` that are palindromes. Substrings at different positions count separately.'
    examples:
      - input: 's = "abba"'
        output: '6'
        explanation: 'a, b, b, a, bb, abba.'
      - input: 's = "xyz"'
        output: '3'
    constraints:
      - '1 ≤ s.length ≤ 1000'
    solution: 'Expand around each of the `2n - 1` centres (each character, and each gap between two characters), counting one palindrome per successful step outward. O(n²) time and O(1) space.'
    complexity: 'O(n squared) time, O(1) space'
    code: cq-count-palindromes
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2514357/cashfree-sdet-role-by-anonymous_user-2u67/
  - id: rotated-search
    section: dsa
    title: 'Search in Rotated Sorted Array'
    difficulty: medium
    leetcode: search-in-rotated-sorted-array
    topic: dsa/binary-search
    problem: |-
      You are given an array of distinct integers that was sorted in ascending order and then rotated at some unknown index, so `[1,2,3,4,5]` might become `[4,5,1,2,3]`. Given a `target`, return its index, or `-1` if it is not present.

      Your solution must run in O(log n) time.
    examples:
      - input: 'nums = [15, 18, 22, 3, 6, 9], target = 6'
        output: '4'
      - input: 'nums = [15, 18, 22, 3, 6, 9], target = 20'
        output: '-1'
      - input: 'nums = [8], target = 8'
        output: '0'
    constraints:
      - '1 ≤ nums.length ≤ 5000'
      - 'All values are distinct'
      - 'nums is sorted ascending, then possibly rotated'
    solution: 'At every step at least one half of the range `[lo, hi]` is still sorted: compare `nums[lo]` with `nums[mid]` to see which. If the target lies inside the sorted half''s range, search there; otherwise search the other half.'
    complexity: 'O(log n) time, O(1) space'
    code: dsa-rotated-search
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2514357/cashfree-sdet-role-by-anonymous_user-2u67/
  - id: cheapest-flights
    section: dsa
    title: 'Cheapest Flights Within K Stops'
    difficulty: medium
    leetcode: cheapest-flights-within-k-stops
    topic: dsa/shortest-paths
    problem: 'There are `n` cities and a list of flights `[from, to, price]`. Find the cheapest price from `src` to `dst` using at most `k` stops in between, or `-1` if there is no such route.'
    examples:
      - input: 'n = 4, flights = [[0,1,50], [1,2,50], [2,0,50], [1,3,500], [2,3,150]], src = 0, dst = 3, k = 1'
        output: '550'
        explanation: '0 → 1 → 3. The cheaper route 0 → 1 → 2 → 3 needs two stops.'
    constraints:
      - '1 ≤ n ≤ 100'
      - '0 ≤ k < n'
      - 'No duplicate flights'
    solution: 'Bellman-Ford limited to `k + 1` rounds. Each round relaxes every flight using a copy of the previous round''s prices, so a single round can never chain two flights. Dijkstra on (city, stops) also works.'
    complexity: 'O(k x E) time, O(V) space'
    code: dsa-cheapest-flights
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2514357/cashfree-sdet-role-by-anonymous_user-2u67/
  - id: edit-distance
    section: dsa
    title: 'Edit Distance'
    difficulty: medium
    leetcode: edit-distance
    topic: dsa/dynamic-programming
    problem: 'Return the fewest operations that turn `word1` into `word2`, where an operation inserts, deletes or replaces one character.'
    examples:
      - input: 'word1 = "kitten", word2 = "sitting"'
        output: '3'
      - input: 'word1 = "abc", word2 = "yabd"'
        output: '2'
        explanation: 'Insert y, then replace c with d.'
    constraints:
      - '0 ≤ word1.length, word2.length ≤ 500'
    solution: '`dp[i][j]` is the cost for the first `i` and `j` characters. If the characters match, copy `dp[i-1][j-1]`; otherwise take one plus the smallest of delete `dp[i-1][j]`, insert `dp[i][j-1]` and replace `dp[i-1][j-1]`.'
    complexity: 'O(n x m) time and space'
    code: dsa-edit-distance
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2514357/cashfree-sdet-role-by-anonymous_user-2u67/
  - id: complementary-pairs
    section: dsa
    title: 'Complementary Pairs'
    topic: dsa/bit-manipulation
    problem: 'Two strings form a complementary pair if some rearrangement of their concatenation is a palindrome. Given a list of lowercase strings, count the pairs `(i, j)` with `i < j` that are complementary. The interviewer wanted about O(n).'
    examples:
      - input: 'words = ["aba", "abc", "d", "aa"]'
        output: '2'
        explanation: '"aba" + "aa" and "d" + "aa".'
    constraints:
      - '1 ≤ words.length ≤ 10⁵'
    solution: 'A rearrangement is a palindrome when at most one letter has an odd count. Reduce each word to a 26-bit mask of odd counts. A pair works if the masks are equal or differ in exactly one bit, so for each word look up its mask and the 26 one-bit variants in a map of earlier masks.'
    complexity: 'O(26 x n) time, O(n) space'
    code: cq-complementary-pairs
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2867998/cashfree-interview-experience-by-anonymo-tdx5/
  - id: longest-task
    section: dsa
    title: 'Employee with the Longest Task'
    difficulty: easy
    leetcode: the-employee-that-worked-on-the-longest-task
    topic: dsa/arrays-and-hashing
    problem: 'Tasks run back to back starting at time 0. `logs[i] = [employee, leaveTime]` says the employee finished task `i` at `leaveTime`. Return the employee who worked the single longest task; if there is a tie, the smallest employee id.'
    examples:
      - input: 'logs = [[3,4], [1,6], [2,10]]'
        output: '2'
        explanation: 'Employees 3 and 2 both worked 4 units; 2 is the smaller id.'
    constraints:
      - '2 ≤ logs.length ≤ 500'
      - 'leaveTime values are strictly increasing'
    solution: 'Keep the previous finish time. Each task''s length is its finish time minus that. Track the best length and break ties by id.'
    complexity: 'O(n) time, O(1) space'
    code: cq-longest-task
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/6857716/cashfree-frontend-intern-online-assessme-satn/
  - id: distinct-ones-flip
    section: dsa
    title: 'Distinct One Counts After One Flip'
    topic: dsa/greedy
    problem: 'You are given a binary array. You must flip exactly one subarray, which may be empty, turning 0s into 1s and 1s into 0s. Return how many different totals of 1s are possible after the flip.'
    examples:
      - input: 'arr = [1, 0, 1]'
        output: '3'
        explanation: 'The total can be 1, 2 or 3.'
    constraints:
      - '1 ≤ arr.length ≤ 2 × 10⁵'
    solution: 'Flipping a subarray changes the count by (zeros − ones) inside it. Score each 0 as +1 and each 1 as −1. The empty flip gives 0, and subarray sums cover every integer between the smallest and largest, so the answer is `maxSum − minSum + 1`. Kadane''s algorithm finds both.'
    complexity: 'O(n) time, O(1) space'
    code: cq-distinct-ones-flip
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/6857716/cashfree-frontend-intern-online-assessme-satn/
