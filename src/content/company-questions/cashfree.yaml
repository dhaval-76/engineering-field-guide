  - id: lld-tic-tac-toe
    section: lld
    title: 'Tic-Tac-Toe (Machine Coding)'
    topic: low-level-design/lld-method
    problem: 'Write the game logic, then discuss improvements.'
    solution: 'Keep row, column and diagonal counters so each move checks a win in O(1), and separate Board, Player and Game.'
