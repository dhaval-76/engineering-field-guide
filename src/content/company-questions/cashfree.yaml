  - id: lld-calendar
    section: lld
    title: 'Google Calendar'
    topic: low-level-design/meeting-room
    problem: |-
      Design Google Calendar's classes and helper functions.

      **Requirements**
      1. Schedule a meeting for a list of users with a start and end time.
      2. Schedule recurring meetings with a frequency.
      3. Set reminders for users.
