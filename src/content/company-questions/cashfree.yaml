  - id: hld-notification
    section: hld
    title: 'Notification Service'
    topic: system-design/notification-system
    problem: 'Design a notification service.'
    solution: 'Queue per channel, per-user preferences and rate limits, retries with a dead-letter queue, and idempotent sends.'
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/6724223/cashfree-payments-sde-3-interview-experi-3b3s/
