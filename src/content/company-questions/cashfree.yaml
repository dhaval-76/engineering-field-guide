    problem: 'Classes, database design and booking flow. Reports push hard on concurrent bookings, and one asked for code handling them with multithreading.'
    solution: 'Practise writing the locking, not just describing it: a per-show seat map with a held state and expiry, or a conditional database update. One report extended it into a library other apps can call.'
