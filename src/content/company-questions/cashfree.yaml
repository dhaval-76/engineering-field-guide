  - id: hld-hotel
    section: hld
    title: 'Hotel Booking'
    topic: system-design/ticket-booking
    problem: 'Design hotel booking, asked in a techno-managerial round.'
    solution: 'Inventory per room type per date, with a reservation hold and a conditional update. Search reads from a separate store.'
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2748580/cashfree-sde-3-bangalore-india-aug-2022-g0f8b/
  - id: frontend-debounce
    section: frontend
    title: 'Debounce and Throttle in JavaScript'
    topic: concurrency/event-loop-and-async
    problem: 'Write debounce and throttle, explain `apply`, and write a wrapper that errors when a function exceeds a timeout.'
    solution: 'Debounce resets a timer on each call; throttle ignores calls until the interval has passed. Use `Promise.race` against a timer for the timeout.'
    reports:
      - year: 2025
        source: https://leetcode.com/discuss/post/6296015/cashfree-payments-frontend-interview-exp-a505/
  - id: fund-websocket
    section: fundamentals
    title: 'HTTP vs WebSocket'
    topic: backend/realtime-communication
    problem: 'Why use HTTP? How does a WebSocket differ?'
    solution: 'HTTP is client-initiated request and response. A WebSocket upgrades one connection into a two-way channel for server push.'
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2514357/cashfree-sdet-role-by-anonymous_user-2u67/
  - id: fund-paging
    section: fundamentals
    title: 'Paging Algorithms'
    topic: cs-foundations/operating-systems
    problem: 'Describe the page replacement algorithms.'
    solution: 'FIFO, LRU, Clock and the theoretical Optimal. LRU approximates Optimal but is costly to track exactly, so real systems use Clock.'
    reports:
      - year: 2022
        source: https://leetcode.com/discuss/post/2514357/cashfree-sdet-role-by-anonymous_user-2u67/
