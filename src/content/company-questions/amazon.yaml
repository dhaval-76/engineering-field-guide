    problem: 'There are piles of bananas and `h` hours. Each hour Koko picks one pile and eats up to `speed` bananas from it; if the pile has fewer, she finishes it and waits for the next hour. Return the smallest whole-number speed that lets her finish every pile within `h` hours.'
