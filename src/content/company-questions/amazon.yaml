  - id: lld-ecommerce
    section: lld
    title: 'E-commerce Platform'
    topic: low-level-design/shopping-cart
    problem: |-
      "Design the classes of an e-commerce platform, then walk me through some scenarios."

      **Requirements**
      - Products and stock, a cart, checkout, orders and payment.
      - Scenarios to walk through: add to cart, check out, payment fails, cancel an order.

      **Expect follow-ups on:** two buyers ordering the last unit at the same moment, and partial failures during checkout.
    solution: |-
      **Clarify first**
      - Single seller or a marketplace? Coupons, taxes, shipping? (Single seller; mention the rest as extensions.)
      - When is stock taken: when added to the cart, or at checkout? (At checkout. Adding to a cart reserves nothing.)

      **Core classes**
      - `Product` (sku, name, price in the smallest currency unit: paise, so no floating-point money).
      - `Inventory`: available units per sku, with an **atomic** `reserve(sku, qty)` and `release`.
      - `Cart`: items and quantities; computes the total.
      - `Order`: items, amount and a status with legal transitions (CREATED, PAID, SHIPPED, CANCELLED).
      - `PaymentGateway` interface: the real provider stays behind it, and tests use a fake.
      - `CheckoutService`: the workflow.

      **The scenarios**
      - **Checkout is all or nothing.** Reserve every line; if any line is out of stock, release what was reserved and fail. Then charge; if payment fails, release everything and cancel the order.
      - **Last unit, two buyers.** `reserve` is a compare-and-set loop (in a database, `UPDATE … SET qty = qty - 1 WHERE sku = ? AND qty >= 1`), so exactly one succeeds. The test runs eight buyers at once.
      - **Cancel** only from PAID: release stock and refund.

      **Follow-ups**
      - **Payment timeouts:** the charge may have succeeded. Use an idempotency key so a retry can't charge twice, and reconcile with the provider.
      - **Reservation expiry** when payment never completes: see the inventory question.
      - **Extensibility:** pricing rules (coupons, sales) as a chain of strategies applied to the cart.

      **What a strong answer shows:** clear class responsibilities, money as integers, atomic stock handling and a rollback path for every failure.
    code: cq-lld-ecommerce
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8074897/amazon-sde-2-interview-exp-blr-by-anonym-wddt/
  - id: lld-pizza
    section: lld
    title: 'Pizza Ordering System'
    topic: oop-patterns/decorator-adapter-facade-proxy
    problem: |-
      "Design a pizza ordering system. A pizza has a base and any combination of toppings; its price and description depend on what is on it."

      **Requirements**
      - Several bases with their own prices.
      - Any number of toppings, including the same one twice.
      - Price and description computed from the choices.
      - New toppings easy to add.

      The report says the round was built around a **decorator-style** approach.

      **Expect follow-ups on:** why a decorator here, and what you would do differently for a real menu.
    solution: |-
      **Clarify first**
      - Sizes, combos, discounts? (Mention them; start with base plus toppings.)
      - Can a topping appear twice? (Yes: double cheese.)

      **Decorator design**
      - `Pizza` interface: `description()` and `price()`.
      - `Base` implements it directly.
      - `Topping` is an abstract class that **is a** `Pizza` and **wraps** a `Pizza`. Each topping adds its own price and words to the wrapped pizza's.
      - Toppings stack in any order and any number: `new Cheese(new Olives(new Cheese(base)))`.
      - A small `PizzaBuilder` keeps the wrapping out of calling code.

      **Trade-off worth saying**
      - The decorator shows the pattern and lets a topping change behaviour as well as price (a "gluten-free" wrapper could change the base).
      - For a real menu where toppings only add a price, **data beats classes**: a `Pizza` with a base and a list of `Topping(name, price)` loaded from a database needs no code change for a new topping. Offer both; interviewers like hearing when not to use a pattern.

      **Follow-ups**
      - **Sizes:** price per size on the base and each topping, or a size multiplier.
      - **Discounts:** a separate pricing strategy applied to the finished pizza or the order.
      - **Order:** a list of pizzas plus drinks, each priced by the same interface.

      **What a strong answer shows:** a correct decorator, and judgment about when a list of data is simpler.
