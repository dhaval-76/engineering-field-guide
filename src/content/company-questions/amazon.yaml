  - id: lld-inventory
    section: lld
    title: 'Inventory Management'
    topic: low-level-design/inventory-management
    problem: |-
      "Design inventory management for an online store." The interviewer went deep on concurrency: **one unit of a product is left, and two users place an order at the same moment. How do you make sure only one succeeds?**

      **Requirements**
      - Track stock per product.
      - Reserve stock when an order is placed; confirm it when payment succeeds; give it back if payment fails or never completes.
      - Never sell more than exists.

      Taken from a public compilation of recent questions.

      **Expect follow-ups on:** race conditions, locking versus atomic updates, transactions, and preventing overselling across several servers.
    solution: |-
      **Clarify first**
      - One warehouse or several? Backorders allowed? (One; no backorders.)
      - How long may a reservation be held while the customer pays? (A few minutes.)
      - One application server or many? (Many: in-memory locks aren't enough on their own.)

      **Model**
      - Per sku: **available** units, plus a set of **reservations** (id, sku, quantity, expiry).
      - `reserve` takes units from available and creates a reservation; `confirm` turns it into a sale; `release` or expiry returns the units.

      **Preventing overselling**
      - The check and the decrement must be **one atomic step**. In code: a lock or compare-and-set (the test runs 100 buyers for 10 units and exactly 10 succeed). In a database, one statement: `UPDATE stock SET available = available - ? WHERE sku = ? AND available >= ?`. One row updated means you got it; zero means sold out. This works across many servers because the database does the check.
      - Alternatives: `SELECT … FOR UPDATE` in a transaction (pessimistic, simple, holds a lock), or a version column with retry (optimistic, better when conflicts are rare).

      **Reservations that never complete**
      - Each has an expiry; a sweeper (or a check on every operation, as in the code) returns expired units.
      - Confirming an expired reservation fails, so a very late payment must be refunded or re-reserved.

      **Follow-ups**
      - **Hot products** (a flash sale): split one sku's stock into several counters, or queue orders for that sku and process them in sequence.
      - **Several warehouses:** reserve in the nearest one that has stock, inside the same atomic step.
      - **Audit:** every change recorded as an event, so stock can be reconciled.

      **What a strong answer shows:** naming the race exactly, an atomic fix that also works across servers, and handling of abandoned reservations.
    code: cq-lld-inventory
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8519174/questions-asked-by-amazon-in-past-6-mont-zxfk/
  - id: lld-rate-limiter
    section: lld
    title: 'Rate Limiter'
    topic: low-level-design/rate-limiter
    problem: |-
      "Design a rate limiter that allows each client N requests per time window."

      **Requirements**
      - Per-client limits, checked on every request: allow or reject.
      - Discuss fixed window, sliding window and token bucket, and choose.
      - Then make it work when the service runs on several instances.

      Taken from a public compilation of recent questions.

      **Expect follow-ups on:** Redis, locking, and consistency trade-offs in the distributed version.
    solution: |-
      **Clarify first**
      - Limit by user, API key or IP? Same limit for every endpoint? (Per API key; per-endpoint limits as config.)
      - Are short bursts acceptable? (Usually yes, which favours a token bucket.)
      - What happens when rejected: 429 with `Retry-After`.

      **Algorithms**
      - **Fixed window:** count per minute. Simple, but allows twice the limit across a window boundary.
      - **Sliding window log:** store each request's time and count the last minute. Exact, but memory grows with the limit.
      - **Sliding window counter:** weight the previous window's count. A good, cheap approximation.
      - **Token bucket:** a bucket of up to *capacity* tokens refilled at a steady rate; each request takes one. Allows bursts up to capacity and a steady average. A common default.

      **Design**
      - `RateLimiter` interface with `tryAcquire(clientId)`, so algorithms are interchangeable (Strategy).
      - State per client in a concurrent map. Refill lazily: compute the tokens earned since the last call instead of running a timer per client.
      - Lock per client, not globally, so clients don't block each other.
      - Inject the clock, so tests can move time forward exactly, as in the code.

      **Distributed**
      - Keep each client's bucket in **Redis**, and do refill-and-take in **one Lua script**, which Redis runs atomically, so two instances can't both take the last token.
      - Trade-offs: a Redis call per request (latency), and what to do when Redis is down: fail open (allow) for availability or fail closed for protection. Local pre-limits per instance reduce load.

      **What a strong answer shows:** the algorithms compared honestly, a testable design with an injected clock, and an atomic distributed version with a stated failure mode.
    code: cq-lld-rate-limiter
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8519174/questions-asked-by-amazon-in-past-6-mont-zxfk/
  - id: lld-package-delivery
    section: lld
    title: 'Package Delivery System'
    topic: low-level-design/lld-method
    problem: |-
      "Design a package delivery system for an e-commerce company like Amazon. The system gets orders, packages are created for shipment, delivery agents deliver packages to customers, and the system tracks delivery status. Support assigning packages to agents, updating delivery status, and handling unsuccessful delivery attempts."

      That is the wording the candidate reported, from a 60-minute whiteboard round.

      **Expect follow-ups on:** priority for **Prime** orders, and assigning the **highest-rated agent** to Prime customers.
    solution: |-
      No single page covers this design; the [LLD method](../../low-level-design/lld-method/) gives the approach.

      **Clarify first**
      - One hub or many? Does an agent carry one package or a route of many? (One hub; one package at a time to keep it simple, mention routes as an extension.)
      - How many attempts before returning to the seller? (Three.)
      - Who updates status: the agent's app.

      **Core classes**
      - `Shipment`: id, Prime flag, status, assigned agent, failed attempts and a **history** of status changes (tracking).
      - `Status` with an explicit **state machine**: CREATED → ASSIGNED → OUT_FOR_DELIVERY → DELIVERED, or → ATTEMPT_FAILED → back to ASSIGNED, or → RETURNED after the last attempt. Every update is checked against the allowed transitions, so an app bug can't mark an unassigned package delivered.
      - `Agent`: id and rating.
      - `AssignmentStrategy` interface: chooses an agent for a shipment.
      - `DeliveryService`: a waiting queue, free agents, `assignAll()` and `move(shipment, status)`.

      **The follow-ups, without rewriting**
      - **Prime first:** the waiting queue is a priority queue ordered by Prime, then by age, so Prime packages are assigned first and normal ones still progress.
      - **Best agent for Prime:** a new `AssignmentStrategy` (`PrimeGetsBestRated`) picks the highest-rated free agent for Prime and the lowest-rated for the rest. Nothing else changes: this is why the strategy is an interface from the start.
      - **Failed attempts:** the agent is freed, the package is queued again, and after three failures it is returned.

      **More follow-ups**
      - **Concurrency:** two dispatchers must not assign one agent twice; assignment runs in one place, or uses an atomic "claim agent" step.
      - **Notifications** on every status change: observers on `move`.

      **What a strong answer shows:** a validated status machine, assignment as a swappable strategy, and handling of failed attempts.
    code: cq-lld-package-delivery
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8575909/amazon-sde-2-india-oct-2026-dsa-lld-roun-vk9s/
  - id: lld-return-dropoff
    section: lld
    title: 'Return Drop-off Booking (a Reverse Amazon Locker)'
    topic: system-design/proximity-service
    problem: |-
      "Customers return packages by dropping them at a store. A customer books a time slot at a nearby drop-off store, goes there, and hands the package over."

      **Requirements**
      - Find drop-off stores near the customer.
      - Each store accepts a limited number of drop-offs per time slot.
      - Book, cancel, and complete a drop-off at the store with a code.

      In the report, the interviewer interrupted the coding to ask **"How will you find the nearest drop store from the customer's location?"** and hinted "think about how Uber does it".
    solution: |-
      **Clarify first**
      - How is a slot defined: an hour window per store, with a capacity? (Yes.)
      - Package size limits per store? (Mention it; skip at first.)
      - What proves the drop-off: a booking code shown at the store.

      **Core classes**
      - `Store` (id, location, slots per window), `Booking` (code, customer, store, window).
      - `DropOffService`: `book`, `cancel`, `dropOff`.
      - `StoreLocator`: nearest stores to a location.

      **Booking without overbooking**
      - Count bookings per (store, window) with an atomic counter: increment, and if it goes over capacity, decrement and refuse. Two customers can never both get the last slot (the test runs six at once for two slots). In a database this is the same conditional update as seat booking.
      - `dropOff` checks the code belongs to this store and removes it atomically, so a code can't be used twice.

      **The follow-up: finding the nearest store**
      - Scanning every store and computing distances is fine for a few hundred; it is too slow for tens of thousands per query.
      - Bucket stores into a **grid** of cells by latitude and longitude (the same idea as geohashes, which Uber-style systems use). Look in the customer's cell and its neighbours, widen the ring until enough stores are found, then sort those few by distance. That is what `StoreLocator` does.
      - At larger scale: geohash prefixes in a database index, a quadtree, or a database's geospatial index. Distance on a map isn't travel time; a routing service can re-rank the top few.

      **Time management**
      - The candidate spent 35 minutes coding and ran out of time. State the design and the race first, then code the booking path, then the locator.

      **What a strong answer shows:** an atomic booking step, single-use codes and a spatial index for "nearest".
    code: cq-lld-return-dropoff
