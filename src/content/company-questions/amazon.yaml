  - id: lld-file-search
    section: lld
    title: 'File Search Utility (Unix find)'
    topic: low-level-design/file-system
    problem: |-
      "Design the search part of a command-line tool like Unix `find`. Users search a directory tree for files by attributes and combine conditions."

      **Requirements**
      - Filter by name, size, extension and type (file or directory), with room for more attributes later.
      - Combine conditions with **AND** and **OR**, for example "larger than 5 MB and extension `.xml`, or any `.log`".
      - Return matching paths.
      - Adding a new filter must not change existing classes.

      The report says the focus was clean, extensible object-oriented design. Expect to write the core classes in about 45 minutes.

      **Expect follow-ups on:** NOT, very deep or very large trees, symbolic links, and how you would test it.
    solution: |-
      **Clarify first**
      - Which attributes, and how is the query given: built in code, or parsed from a string like `-size +5M -o -name '*.log'`? (Assume built in code; parsing comes later.)
      - Files only, or directories too? Follow symbolic links? (Assume no.)
      - How big are the trees? (Large enough that recursion depth and memory matter.)

      **Core design: Specification + Composite**
      - `FileFilter` has one method, `matches(file)`. Each condition (`extension`, `largerThan`, `nameContains`) is one small filter.
      - `and`, `or` and `negate` build **new filters from filters**, so any query is a tree of filters. That is the Composite pattern applied to the Specification pattern, and it is exactly what the report asked for.
      - `FileSearcher` only walks the tree and asks the filter. Walking and matching are separate, so a new filter (modified date, owner) is one new class, and the walker never changes (open/closed principle).

      **Walking the tree**
      - Use an explicit stack rather than recursion: a deep tree can't overflow the call stack.
      - In real code, `Files.walk` streams entries lazily, so a million files don't sit in memory at once.
      - Symbolic links: don't follow by default, or track visited real paths to avoid cycles.

      **Follow-ups**
      - **Parsing a query string:** a small parser builds the same filter tree; the searcher is unchanged.
      - **Speed:** evaluate cheap checks first (name before reading size), and stop early when only the first N results are needed.
      - **Testing:** filters are pure functions, so each is unit tested alone; the searcher is tested on an in-memory tree, as in the code.

      **What a strong answer shows:** the composite of filters, separation of walking from matching, and an answer for deep trees.
