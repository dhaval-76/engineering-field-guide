overview:
  - 'Reported loops usually have **four rounds**: two on DSA, plus low-level and system design. A DSA round is one or two problems in about an hour.'
  - '**Leadership Principle questions come with almost every round**, so plan for less coding time than the hour suggests.'
  - 'Many reports describe an **online assessment** first, with a DSA problem and a code repository task where an AI assistant is available.'
  - 'Candidates report being judged on explanation as well as the answer, so say your approach before you code.'
questions:
  - id: rotated-search
    section: dsa
    title: 'Search in Rotated Sorted Array'
    difficulty: medium
    leetcode: search-in-rotated-sorted-array
    listWindow: '30 days'
    topic: dsa/binary-search
    problem: |-
      You are given an array of distinct integers that was sorted in ascending order and then rotated at some unknown index, so `[1,2,3,4,5]` might become `[4,5,1,2,3]`. Given a `target`, return its index, or `-1` if it is not present.

      Your solution must run in O(log n) time.
    examples:
      - input: 'nums = [15, 18, 22, 3, 6, 9], target = 6'
        output: '4'
      - input: 'nums = [15, 18, 22, 3, 6, 9], target = 20'
        output: '-1'
      - input: 'nums = [8], target = 8'
        output: '0'
    constraints:
      - '1 ≤ nums.length ≤ 5000'
      - 'All values are distinct'
      - 'nums is sorted ascending, then possibly rotated'
    solution: 'At every step at least one half of the range `[lo, hi]` is still sorted: compare `nums[lo]` with `nums[mid]` to see which. If the target lies inside the sorted half''s range, search there; otherwise search the other half.'
    complexity: 'O(log n) time, O(1) space'
    code: dsa-rotated-search
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/7878487/amazon-sde2-selected-by-anonymous_user-c0zq/
      - year: 2026
        source: https://leetcode.com/discuss/post/8014509/amazon-sde-1-interview-experience-by-pra-azvd/
