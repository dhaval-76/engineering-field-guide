  - id: rotated-search
    section: dsa
    title: 'Search in Rotated Sorted Array'
    difficulty: medium
    leetcode: search-in-rotated-sorted-array
    topic: dsa/binary-search
    problem: 'A sorted array of distinct values was rotated at an unknown point. Return the index of a target, or -1, in O(log n).'
    solution: 'At every step one half of the range is still sorted. Check whether the target falls inside that sorted half; if so search there, otherwise search the other half.'
    complexity: 'O(log n) time, O(1) space'
    code: dsa-rotated-search
