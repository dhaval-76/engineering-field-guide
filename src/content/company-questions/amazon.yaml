company: Amazon
updated: 2026-11-09
overview:
  - 'Reported loops usually have **four rounds**: two on DSA, plus low-level and system design. A DSA round is one or two problems in about an hour.'
  - '**Leadership Principle questions come with almost every round**, so plan for less coding time than the hour suggests.'
  - 'Many reports describe an **online assessment** first, with a DSA problem and a code repository task where an AI assistant is available.'
  - 'Candidates report being judged on explanation as well as the answer, so say your approach before you code.'
