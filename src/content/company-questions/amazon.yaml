  - id: lld-delivery-estimate
    section: lld
    title: 'Delivery Estimation Service'
    topic: low-level-design/lld-method
    problem: |-
      "Design Amazon's delivery estimation service: the "arrives by Thursday" promise shown on a product page and at checkout."

      In the report, the interviewer first asked the candidate to identify the **functional and non-functional requirements**, and the round was decided largely on that part.

      **Expect follow-ups on:** which inputs change the estimate, how to keep it fast on every product page, and what happens when the promise is missed.
    solution: |-
      No single page covers this design; the [LLD method](../../low-level-design/lld-method/) gives the approach. Start with requirements, out loud.

      **Functional requirements**
      - Given a product, a destination (pincode) and a shipping speed, return an estimated delivery date or range.
      - Account for which warehouses have the item, transit time from each to the destination, the order cut-off time, and days without deliveries (Sundays, holidays).
      - Say when an item can't be delivered to that pincode.

      **Non-functional requirements**
      - **Fast:** shown on every product page, so tens of milliseconds, under very high read traffic.
      - **Accurate and conservative:** a missed promise costs more than a slightly later one; show a range.
      - **Fresh enough:** stock changes constantly, transit tables rarely.

      **Design**
      - Each input behind an interface: `WarehouseLocator` (who has stock), `TransitTimes` (warehouse, pincode, speed → days), `Calendar` (delivery days). They change independently and are cached differently.
      - `DeliveryEstimator`: work out the ship date (today if before the cut-off, else tomorrow), then for each warehouse with stock add its transit days, counting only delivery days, and keep the earliest. Return a range: earliest plus one day of buffer.
      - The tests cover the cut-off, a holiday, a Sunday and "no warehouse can reach this pincode".

      **Making it fast**
      - Precompute transit days per (warehouse, pincode region, speed) offline; it changes rarely.
      - Cache estimates per (product's warehouses, pincode, speed) for minutes; recompute on stock changes.

      **Follow-ups**
      - **Missed promises:** compare promised with actual dates, feed the error back into the buffer per lane, and alert on lanes that slip.
      - **Checkout versus product page:** checkout recomputes with live stock and reserves; the product page may use a cached value.

      **What a strong answer shows:** clear functional and non-functional requirements first, then inputs separated behind interfaces and a conservative, cacheable estimate.
    code: cq-lld-delivery-estimate
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8554896/amazon-sde-2-banaglore-alexa-devices-28-x49pi/
  - id: lld-playlist
    section: lld
    title: 'Playlist Mixing Two Song Sources'
    topic: low-level-design/lld-method
    problem: |-
      "Design a playlist that mixes songs from two services: a DJ service and a recommendation service."

      **Requirements** (the report had about ten, printed on paper)
      - Mix the two sources in a custom proportion, such as 2 DJ songs then 1 recommended, or equally.
      - Apply filters based on the user's preferences.
      - Write production-ready classes, on paper, with correct syntax.

      **Expect follow-ups on:** a source running out, duplicates across sources, and adding a third source or a new filter.
    solution: |-
      No single page covers this design; the [LLD method](../../low-level-design/lld-method/) gives the approach.

      **Clarify first**
      - Are the sources finite lists or endless streams? (Treat both as "give me the next song, if any".)
      - Does a filtered-out song use up its slot? (No: the next song from the same source takes the slot.)
      - Duplicates across sources? (Skip songs already played.)
      - When one source runs dry? (Continue with the other.)

      **Core classes**
      - `Song` (id, title, genre, explicit) and `SongSource` with `Optional<Song> next()`. The DJ service and the recommender are adapters behind this interface.
      - Filters are `Predicate<Song>` (no explicit songs, excluded genres), combined into one with `and`. New preferences are new predicates.
      - `Mixer implements Iterator<Song>`: it decides which source owns the next slot from the ratio (`position % (a + b) < a`), skips songs that fail the filter or were already played, and switches to the other source when one is exhausted.

      **Why an iterator**
      - The caller just loops; songs are pulled one at a time, so endless sources work and nothing is fetched early.
      - The ratio, filters and sources are independent: a new mixing rule (time of day, mood) is a new strategy for choosing the source, without touching sources or filters.

      **Production details the round asked for**
      - Validate the ratio (`a + b > 0`).
      - `next()` throws `NoSuchElementException` when there is nothing left, as `Iterator` requires.
      - Never loop forever when both sources keep returning filtered songs: track exhaustion per source.

      **What a strong answer shows:** clean interfaces for sources and filters, correct iterator behaviour, and the edge cases stated before coding.
    code: cq-lld-playlist
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8443351/amazon-sde-2-interview-experience-onsite-k126/
  - id: lld-agentic-chatbot
    section: lld
    title: 'Agentic Chatbot'
    topic: ai-engineering/agents-and-tool-calling
    problem: |-
      "Design a chatbot that accepts user queries and generates responses. It can call tools, such as looking up an order or the weather, when it needs information."

      The candidate reported finishing the basic flow and running out of time for more, so plan the core loop first.

      **Expect follow-ups on:** adding a tool, conversation memory, a tool that fails, and stopping a loop that never ends.
    solution: |-
      **Clarify first**
      - Which model, and does it support tool calling? (Assume a client that returns either an answer or a tool call.)
      - Which tools, and are any dangerous (refunds, deletes)? (Read-only tools first; confirmations for actions.)
      - How long a conversation must it remember?

      **Core classes**
      - `ModelClient` interface: send the conversation and the available tools, get back a `ModelReply` that is either an answer or a `ToolCall`. Real providers are adapters; tests use a scripted fake, as in the code.
      - `Tool` interface: `name()` and `run(argument)`. Tools live in a registry, so a new tool is one class plus registration.
      - `Agent`: holds the model, the tools and the conversation memory.

      **The loop**
      - Add the user message to memory. Ask the model. If it answers, return the answer. If it asks for a tool, run it, add the result to memory as a tool message, and ask again.
      - **A hard step limit** stops a model that keeps calling tools forever, with a polite fallback answer.
      - **Tool errors become tool results** ("error: timeout"), so the model can retry or explain, instead of the whole request failing. An unknown tool name is handled the same way.

      **Memory**
      - Keep the last N messages, or summarise older turns, to stay within the model's context window and cost.

      **Follow-ups**
      - **Safety:** validate tool arguments, allow-list tools per user, confirm before actions with side effects, and treat tool output as untrusted (prompt injection). See [guardrails](../../ai-engineering/guardrails-prompt-injection/).
      - **Cost and latency:** limit tokens and steps per request, stream the answer, cache tool results.
      - **Observability:** log every step with a trace id so a bad answer can be replayed.

      **What a strong answer shows:** a bounded agent loop, tools behind one interface, failures fed back to the model and memory kept within limits.
    code: cq-lld-agent
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8585902/amazon-sde2-interview-experience-by-anon-o9t8/
