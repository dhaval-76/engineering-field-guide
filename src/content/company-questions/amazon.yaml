  - id: lld-logging
    section: lld
    title: 'Logging Framework (log4j)'
    topic: low-level-design/logging-framework
    problem: |-
      "Design a logging library like log4j." One report says it came with **no explicit requirements**, so gathering them was part of the test.

      **Requirements you should arrive at**
      - Levels DEBUG, INFO, WARN and ERROR, with a minimum level per logger, changeable at runtime.
      - Several destinations (appenders): console, file, a remote collector.
      - A configurable message format.
      - Safe to call from many threads, and cheap when a message is filtered out.

      **Expect follow-ups on:** logging without slowing the caller, what happens when a destination is slow or down, and adding a new destination.
    solution: |-
      **Clarify first** (the report's interviewer expected this)
      - Who uses it: application code across many threads.
      - Must logging ever block or crash the application? (No: losing a log line beats a stuck request.)
      - Which destinations, which formats, configured how? (Code or a config file.)

      **Core classes**
      - `Level` enum, compared by order.
      - `LogEvent`: level, logger name, message, time, thread. Immutable.
      - `Logger`: has a name, a threshold and a list of `Appender`s. `log(level, Supplier<String>)` returns at once when the level is below the threshold, so building the message costs nothing then.
      - `Appender` interface (console, file, network) and `Formatter` interface: each concern can vary independently (Strategy).
      - `LoggerFactory`: a registry that returns the same `Logger` per name. That registry is the only singleton.

      **Not slowing the caller**
      - `AsyncAppender` is a Decorator around any appender: callers put the event on a **bounded queue** and return; one background thread writes.
      - When the queue is full, **drop and count** (or drop only DEBUG) instead of blocking requests. Expose the dropped count as a metric.
      - Flush on shutdown so the last lines aren't lost.

      **Follow-ups**
      - **New destination:** implement `Appender`, register it; nothing else changes.
      - **Hierarchy:** `com.shop.orders` inherits its level and appenders from `com.shop` unless set; look up the parent chain.
      - **Thread safety:** appenders kept in a copy-on-write list, the threshold `volatile`, file writes from a single thread.

      **What a strong answer shows:** requirement gathering before classes, interfaces for appenders and formatters, lazy messages, and a non-blocking path with a clear overflow policy.
    code: cq-lld-logging
