    section: dsa
    title: 'Course Schedule II / Package Dependencies'
    difficulty: medium
    leetcode: course-schedule-ii
    topic: dsa/topological-sort
    problem: 'Given items and "a needs b" pairs, return a valid build order, or nothing if there is a cycle. Amazon has also asked this with software packages.'
