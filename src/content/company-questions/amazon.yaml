    title: 'Minimum Starting Power Across a Grid'
    difficulty: hard
    leetcode: dungeon-game
    topic: dsa/dynamic-programming
    problem: 'Moving right or down through cells that add or subtract power, find the least starting power that never drops below 1. This is LeetCode''s Dungeon Game.'
