  - id: lru-cache
    section: dsa
    title: 'LRU Cache'
    difficulty: medium
    leetcode: lru-cache
    listWindow: '30 days'
    topic: low-level-design/lru-cache
    problem: 'Design a cache with a fixed capacity. `get(key)` returns the value or nothing, and `put(key, value)` inserts or updates. When the cache is full, adding a new key removes the least recently used one. Both operations must be O(1).'
    examples:
      - input: 'capacity 2: put(1, a), put(2, b), get(1), put(3, c), get(2), get(3)'
        output: 'a, nothing, c'
        explanation: 'Reading 1 made 2 the least recently used, so adding 3 evicted 2.'
    constraints:
      - 'Up to 10⁵ operations'
      - 'Both operations in O(1)'
    solution: 'A hash map from key to node, plus a doubly linked list in recency order. `get` moves the node to the front; `put` adds at the front and, when over capacity, removes the node at the back and its map entry. In Java, `LinkedHashMap` in access order does this for you, but interviews usually want it by hand.'
    complexity: 'O(1) per operation, O(capacity) space'
    code: lru-from-scratch
  - id: median-two-arrays
    section: dsa
    title: 'Median of Two Sorted Arrays'
    difficulty: hard
    leetcode: median-of-two-sorted-arrays
    listWindow: '30 days'
    topic: dsa/binary-search
    problem: 'Given two sorted arrays, return the median of all their elements combined, in O(log(m + n)) time.'
    examples:
      - input: 'a = [1, 4, 9], b = [2, 3]'
        output: '3.0'
        explanation: 'Combined: 1 2 3 4 9.'
      - input: 'a = [2, 6], b = [1, 8]'
        output: '4.0'
        explanation: 'Combined: 1 2 6 8, so (2 + 6) / 2.'
    constraints:
      - '0 ≤ m, n ≤ 1000'
      - 'm + n ≥ 1'
    solution: 'Binary search a cut in the shorter array; the cut in the other array follows from the total size. The cut is right when everything on the left of both cuts is no bigger than everything on the right. The median comes from the four values around the cuts.'
    complexity: 'O(log min(m, n)) time, O(1) space'
    code: dsa-median-two-arrays
