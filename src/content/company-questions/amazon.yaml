    solution: 'This is a graph with weighted edges. For a few queries, BFS from A, multiplying rates along the path. For many, use weighted union-find: store each currency''s value relative to its parent, multiply along the path while compressing it, and answer a query by dividing the two values relative to their shared root. This was taken from a public compilation of recent questions.'
    complexity: 'Near O(1) per query after setup'
