    section: dsa
    title: 'Reorganize String'
    difficulty: medium
    leetcode: reorganize-string
    topic: dsa/heaps-and-top-k
    problem: 'Rearrange a string so no two neighbours match, or return an empty string.'
    solution: 'It is impossible only if one letter fills more than half (rounded up). Place the most frequent letter on even slots, then fill the rest, moving to odd slots once even ones run out. A max-heap also works.'
    complexity: 'O(n) time, O(1) extra space'
    code: cq-reorganize-string
