  - id: course-order
    section: dsa
    title: 'Course Schedule II (Package Dependencies)'
    difficulty: medium
    leetcode: course-schedule-ii
    listWindow: '30 days'
    topic: dsa/topological-sort
    problem: |-
      There are `n` courses labelled `0` to `n - 1`. Each pair `[a, b]` in `prerequisites` means you must finish course `b` before course `a`. Return any order in which you can finish every course. If it is impossible, return an empty array.

      Amazon has also asked this as installing software packages, where a package must be installed after everything it depends on. Be ready to detect and report the cycle.
    examples:
      - input: 'n = 3, prerequisites = [[2,0], [2,1], [1,0]]'
        output: '[0, 1, 2]'
        explanation: 'Course 1 needs 0, and course 2 needs both.'
      - input: 'n = 3, prerequisites = [[0,1], [1,2], [2,1]]'
        output: '[]'
        explanation: 'Courses 1 and 2 need each other, so there is a cycle.'
    constraints:
      - '1 ≤ n ≤ 2000'
      - '0 ≤ prerequisites.length ≤ n × (n − 1)'
      - 'All pairs are distinct'
    solution: 'This is a topological sort. With Kahn''s algorithm, count each course''s incoming edges, start a queue with the courses that have none, and remove courses one at a time, decreasing their dependants'' counts. If fewer than `n` courses come out, the rest are in a cycle.'
    complexity: 'O(V + E) time and space'
    code: dsa-course-schedule
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8286346/amazon-sde-2-l5-bangalore-interview-expe-24nl/
      - year: 2026
        source: https://leetcode.com/discuss/post/8370355/amazon-package-dependencies-interview-qu-keic/
      - year: 2026
        source: https://leetcode.com/discuss/post/8581249/amazon-sde-ii-interview-by-anonymous_use-r2qd/
      - year: 2026
        source: https://leetcode.com/discuss/post/8501304/amazon-interview-experience-by-ronak_aga-tjfx/
  - id: merge-intervals
    section: dsa
    title: 'Merge Intervals'
    difficulty: medium
    leetcode: merge-intervals
    listWindow: '30 days'
    topic: dsa/intervals
    problem: 'Given a list of intervals `[start, end]`, merge every group of overlapping intervals and return the result. Intervals that touch, such as `[1,4]` and `[4,6]`, count as overlapping.'
    examples:
      - input: 'intervals = [[5,7], [1,2], [2,4], [6,9]]'
        output: '[[1,4], [5,9]]'
      - input: 'intervals = [[1,4], [4,6]]'
        output: '[[1,6]]'
        explanation: 'Touching intervals merge.'
    constraints:
      - '1 ≤ intervals.length ≤ 10⁴'
      - '0 ≤ start ≤ end ≤ 10⁴'
    solution: 'Sort by start. Walk the list keeping the last merged interval: if the next one starts at or before its end, extend the end; otherwise start a new interval.'
    complexity: 'O(n log n) time, O(n) space'
    code: dsa-merge-intervals
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8286346/amazon-sde-2-l5-bangalore-interview-expe-24nl/
      - year: 2026
        source: https://leetcode.com/discuss/post/8520348/amazon-sde-1-newgrad-sde-interview-exper-picx/
      - year: 2026
        source: https://leetcode.com/discuss/post/8564500/amazon-l5-sde-2-phone-interview-by-anony-v0o8/
  - id: house-robber
    section: dsa
    title: 'House Robber'
    difficulty: medium
    leetcode: house-robber
    listWindow: '30 days'
    topic: dsa/dynamic-programming
    problem: |-
      Houses stand in a row, and `nums[i]` is the money in house `i`. You cannot take from two adjacent houses. Return the most money you can collect.

      Follow-up from one report: the houses stand in a circle, so the first and last are neighbours.
    examples:
      - input: 'nums = [3, 10, 3, 1, 2]'
        output: '12'
        explanation: 'Take 10 and 2.'
      - input: 'nums = [2, 1, 1, 2]'
        output: '4'
        explanation: 'Take the first and last.'
    constraints:
      - '1 ≤ nums.length ≤ 100'
      - '0 ≤ nums[i] ≤ 400'
    solution: 'For each house keep two numbers: the best total if you skip it and if you take it. Taking it adds its money to the previous "skip". For the circle, solve the line twice, once without the first house and once without the last, and take the larger.'
    complexity: 'O(n) time, O(1) space'
    code: cq-house-robber
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8029194/amazon-interview-sde-1-selected-by-anony-qatd/
      - year: 2026
        source: https://leetcode.com/discuss/post/8098488/amazon-interview-sde-1-intern-dsa-round-srof2/
      - year: 2026
        source: https://leetcode.com/discuss/post/8312943/amazon-sde-2-india-interview-experience-a2s2q/
  - id: rotting-oranges
    section: dsa
    title: 'Rotting Oranges'
    difficulty: medium
    leetcode: rotting-oranges
    listWindow: '30 days'
    topic: dsa/graphs-bfs-dfs
    problem: |-
      A grid holds `0` (empty), `1` (fresh orange) or `2` (rotten orange). Every minute, each fresh orange next to a rotten one (up, down, left or right) becomes rotten. Return the number of minutes until no fresh orange is left, or `-1` if that never happens.

      Reports describe a variation of this, so listen for a changed story with the same mechanics.
    examples:
      - input: 'grid = [[2,1,1], [0,0,1], [1,1,1]]'
        output: '6'
        explanation: 'The rot travels down the right side and back along the bottom row.'
      - input: 'grid = [[2,1,0], [0,1,1], [1,0,1]]'
        output: '-1'
        explanation: 'The orange at the bottom left can never be reached.'
    constraints:
      - '1 ≤ rows, columns ≤ 10'
      - 'grid[i][j] is 0, 1 or 2'
    solution: 'Multi-source BFS. Put every rotten orange in the queue at the start, then process the queue level by level; each level is one minute. Count fresh oranges first, and if any remain at the end, return -1.'
    complexity: 'O(rows x columns) time and space'
    code: dsa-rotting-oranges
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8471051/amazon-sde-1-interview-experience-offer-6msy0/
      - year: 2026
        source: https://leetcode.com/discuss/post/8585902/amazon-sde2-interview-experience-by-anon-o9t8/
      - year: 2026
        source: https://leetcode.com/discuss/post/8533435/amazon-by-anonymous_user-r7vc/
  - id: first-unique
    section: dsa
    title: 'First Unique Element in a Stream'
    difficulty: medium
    leetcode: first-unique-number
    listWindow: '30 days'
    topic: dsa/design-data-structures
    problem: |-
      Design a class that receives integers one at a time. At any moment it must return the first value that has been seen exactly once so far, or `-1` if there is none.

      - `add(value)` records a value.
      - `first()` returns the first unique value.

      One report started with the simpler version, the first non-repeating character in a string, before turning it into a stream.
    examples:
      - input: 'add(2), add(3), add(5), first(), add(2), first(), add(3), add(5), first()'
        output: '2, 3, -1'
        explanation: 'After the second 2, the first unique value is 3. After 3 and 5 repeat, there is none.'
    constraints:
      - 'Up to 10⁵ calls in total'
      - 'Each call should be O(1)'
    solution: 'Keep the values seen once in insertion order, and a set of values seen more than once. In Java, `LinkedHashSet` is a hash map with a doubly linked list through it, which is exactly the structure one interviewer wanted named: O(1) add, remove and "first".'
    complexity: 'O(1) per operation, O(n) space'
    code: cq-first-unique-stream
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8584003/amazon-sde-ii-interview-experience-by-an-1617/
      - year: 2026
        source: https://leetcode.com/discuss/post/7670163/amazon-sde-2-selected-by-anonymous_user-7rq8/
      - year: 2026
        source: https://leetcode.com/discuss/post/8591208/amazon-sde2-interview-onsite-experience-n8bnl/
  - id: lca
    section: dsa
    title: 'Lowest Common Ancestor of a Binary Tree'
    difficulty: medium
    leetcode: lowest-common-ancestor-of-a-binary-tree
    listWindow: '30 days'
    topic: dsa/trees-and-bst
    problem: |-
      Given the root of a binary tree and two nodes `p` and `q` that are both in the tree, return their lowest common ancestor: the deepest node that has both of them as descendants. A node counts as a descendant of itself.

      Follow-ups from the reports: one of the nodes might not be in the tree, and a version phrased as finding the common manager of two employees in an org chart.
    examples:
      - input: 'root = [5,3,8,1,4,7,9], p = 1, q = 4'
        output: '3'
      - input: 'root = [5,3,8,1,4,7,9], p = 3, q = 4'
        output: '3'
        explanation: 'A node can be its own ancestor.'
    constraints:
      - '2 ≤ number of nodes ≤ 10⁵'
      - 'All values are unique'
    solution: 'Recurse. A node returns itself if it is `p` or `q`; otherwise it returns whatever its children found. The first node that receives a result from both sides is the answer. If a node might be missing, count how many targets you actually found before trusting the result.'
    complexity: 'O(n) time, O(h) space'
    code: dsa-lca
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8014509/amazon-sde-1-interview-experience-by-pra-azvd/
      - year: 2026
        source: https://leetcode.com/discuss/post/7646418/amazon-sde-2-blr-interview-experience-re-c2kl/
      - year: 2026
        source: https://leetcode.com/discuss/post/7701734/amazon-sde-2-interview-experience-by-ano-x6lv/
  - id: reorganize-string
    section: dsa
    title: 'Reorganize String'
    difficulty: medium
    leetcode: reorganize-string
    listWindow: '30 days'
    topic: dsa/heaps-and-top-k
    problem: 'Rearrange the letters of `s` so that no two neighbouring characters are the same. Return any valid arrangement, or an empty string if none exists.'
    examples:
      - input: 's = "aabbc"'
        output: '"abacb"'
        explanation: 'Any arrangement with no equal neighbours is accepted.'
      - input: 's = "aaab"'
        output: '""'
    constraints:
      - '1 ≤ s.length ≤ 500'
      - 's contains lowercase English letters'
    solution: 'It is impossible exactly when one letter appears more than `(n + 1) / 2` times. Otherwise place the most frequent letter on the even positions 0, 2, 4…, then fill the remaining letters into the rest of the even positions and then the odd ones. A max-heap that always takes the two most frequent letters also works, in O(n log 26).'
    complexity: 'O(n) time, O(1) extra space'
    code: cq-reorganize-string
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8286346/amazon-sde-2-l5-bangalore-interview-expe-24nl/
      - year: 2026
        source: https://leetcode.com/discuss/post/8513742/amazon-sde-2-l5-spain-by-anonymous_user-vs2p/
  - id: word-break
    section: dsa
    title: 'Word Break'
    difficulty: medium
    leetcode: word-break
    listWindow: '30 days'
    topic: dsa/dynamic-programming
    problem: |-
      Given a string `s` and a list of words `dictionary`, return `true` if `s` can be split into a sequence of one or more dictionary words. A word may be used more than once.

      Follow-up: return every possible sentence.
    examples:
      - input: 's = "sunflowerpot", dictionary = ["sun", "flower", "sunflower", "pot"]'
        output: 'true'
        explanation: '"sun flower pot" or "sunflower pot".'
      - input: 's = "sunflowers", dictionary = ["sun", "flower", "sunflower", "pot"]'
        output: 'false'
    constraints:
      - '1 ≤ s.length ≤ 300'
      - '1 ≤ dictionary.length ≤ 1000'
    solution: '`ok[i]` is true when the first `i` characters can be split. It is true if some `ok[j]` is true and `s[j..i)` is a word. For every sentence, use backtracking with memoisation on the start index.'
    complexity: 'O(n squared) lookups, O(n) space'
    code: dsa-word-break
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/7643535/amazon-fullstack-2-interview-experience-yepps/
  - id: islands
    section: dsa
    title: 'Number of Islands'
    difficulty: medium
    leetcode: number-of-islands
    listWindow: '30 days'
    topic: dsa/graphs-bfs-dfs
    problem: 'A grid contains `''1''` for land and `''0''` for water. An island is a group of land cells connected up, down, left or right. Return the number of islands.'
    examples:
      - input: 'grid = ["1100", "0010", "1011"]'
        output: '3'
    constraints:
      - '1 ≤ rows, columns ≤ 300'
    solution: 'Scan every cell. Each unvisited land cell starts a new island: count it and flood fill its whole island (DFS or BFS) so it is not counted again.'
    complexity: 'O(rows x columns) time and space'
    code: dsa-number-of-islands
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8014509/amazon-sde-1-interview-experience-by-pra-azvd/
      - year: 2026
        source: https://leetcode.com/discuss/post/8029194/amazon-interview-sde-1-selected-by-anony-qatd/
  - id: trapping-rain
    section: dsa
    title: 'Trapping Rain Water'
    difficulty: hard
    leetcode: trapping-rain-water
    listWindow: '30 days'
    topic: dsa/two-pointers
    problem: '`height[i]` is the height of a bar of width 1. After it rains, how much water is trapped between the bars?'
    examples:
      - input: 'height = [3, 0, 2, 0, 4]'
        output: '7'
        explanation: 'Water stands 3 high over positions 1 to 3: 3 + 1 + 3.'
      - input: 'height = [4, 2, 3]'
        output: '1'
    constraints:
      - '1 ≤ height.length ≤ 2 × 10⁴'
      - '0 ≤ height[i] ≤ 10⁵'
    solution: 'Water above a bar is `min(highest on the left, highest on the right) - height`. With two pointers from the ends, the side with the lower maximum so far is already decided by that maximum, so add its water and move that pointer inward.'
    complexity: 'O(n) time, O(1) space'
    code: dsa-trapping-rain-water
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8512004/amazon-sde2-interview-experience-oa-phon-jhvj/
      - year: 2026
        source: https://leetcode.com/discuss/post/8533435/amazon-by-anonymous_user-r7vc/
  - id: top-k-frequent
    section: dsa
    title: 'Top K Frequent Elements'
    difficulty: medium
    leetcode: top-k-frequent-elements
    listWindow: '30 days'
    topic: dsa/arrays-and-hashing
    problem: |-
      Return the `k` most frequent values in `nums`, in any order. The answer is guaranteed to be unique.

      One interviewer then asked for the heap to be built in place, bottom-up, without a library priority queue.
    examples:
      - input: 'nums = [4, 4, 4, 6, 6, 9], k = 2'
        output: '[4, 6]'
    constraints:
      - '1 ≤ nums.length ≤ 10⁵'
      - '1 ≤ k ≤ number of distinct values'
    solution: 'Count frequencies with a hash map. Then keep a min-heap of size `k` ordered by count, or put values into buckets indexed by count and read from the highest bucket for O(n). For the in-place heap, heapify the array of (value, count) pairs from the last parent down to index 0.'
    complexity: 'O(n log k) time, O(n) space'
    code: dsa-top-k-frequent
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8575075/amazon-sde-2-sept-2026-rejected-by-anony-uy75/
      - year: 2026
        source: https://leetcode.com/discuss/post/8481152/amazon-sde-2-screening-round-spain-by-an-xgot/
  - id: obstacle-path
    section: dsa
    title: 'Shortest Path with Obstacle Removal'
    difficulty: hard
    leetcode: shortest-path-in-a-grid-with-obstacles-elimination
    listWindow: 'all time'
    topic: dsa/graphs-bfs-dfs
    problem: |-
      You are in the top-left cell of a grid where `0` is open and `1` is an obstacle. Each step moves up, down, left or right. Return the fewest steps to reach the bottom-right cell if you may remove at most `k` obstacles, or `-1` if it cannot be done.

      One report built up to this in stages: first the shortest path with no removals, then with obstacles you can remove.
    examples:
      - input: 'grid = [[0,1,0,0], [0,1,1,0], [0,0,1,0]], k = 0'
        output: '-1'
      - input: 'grid = [[0,1,0,0], [0,1,1,0], [0,0,1,0]], k = 1'
        output: '5'
        explanation: 'Remove the obstacle at row 2, column 2.'
    constraints:
      - '1 ≤ rows, columns ≤ 40'
      - '0 ≤ k ≤ rows × columns'
      - 'The start and end cells are 0'
    solution: 'BFS, but a state is `(row, column, removals left)`, because reaching a cell with more removals left is genuinely better. Keep the best "removals left" seen at each cell and only revisit it with more.'
    complexity: 'O(rows x columns x k) time at worst'
    code: cq-shortest-path-obstacles
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/7878487/amazon-sde2-selected-by-anonymous_user-c0zq/
      - year: 2026
        source: https://leetcode.com/discuss/post/8584198/amazon-l5-interview-experience-offer-by-thbff/
  - id: aggressive-cows
    section: dsa
    title: 'Aggressive Cows'
    topic: dsa/binary-search
    problem: 'Stalls stand along a line at the given positions. Place `cows` cows in different stalls so that the smallest distance between any two cows is as large as possible. Return that distance.'
    examples:
      - input: 'stalls = [1, 2, 8, 4, 9], cows = 3'
        output: '3'
        explanation: 'Use stalls 1, 4 and 8 (or 9).'
    constraints:
      - '2 ≤ cows ≤ stalls.length ≤ 10⁵'
      - '0 ≤ stalls[i] ≤ 10⁹'
    solution: 'Binary search on the answer. For a candidate distance, sort the stalls and place cows greedily from the left whenever the gap allows; if all fit, try a larger distance. Fitting is monotonic, which is what makes the search valid.'
    complexity: 'O(n log n + n log range) time'
    code: cq-aggressive-cows
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8315111/amazon-l5-sde-2-interview-experience-off-yi2x/
      - year: 2026
        source: https://leetcode.com/discuss/post/8581249/amazon-sde-ii-interview-by-anonymous_use-r2qd/
  - id: capacity-ship
    section: dsa
    title: 'Capacity To Ship Packages Within D Days'
    difficulty: medium
    leetcode: capacity-to-ship-packages-within-d-days
    listWindow: '30 days'
    topic: dsa/binary-search
    problem: 'Packages on a conveyor belt must ship in the given order within `days` days. `weights[i]` is the weight of package `i`. Each day you load packages in order until the next one would exceed the ship''s capacity. Return the smallest capacity that ships everything in time.'
    examples:
      - input: 'weights = [3, 2, 2, 4, 1, 4], days = 3'
        output: '6'
        explanation: 'Days: [3,2] [2,4] [1,4].'
      - input: 'weights = [5, 1, 1, 1, 5], days = 2'
        output: '7'
        explanation: 'Days: [5,1,1] [1,5].'
    constraints:
      - '1 ≤ days ≤ weights.length ≤ 5 × 10⁴'
      - '1 ≤ weights[i] ≤ 500'
    solution: 'Binary search on the capacity between the heaviest package and the total weight. For each candidate, simulate the days greedily; if it fits, try smaller.'
    complexity: 'O(n log sum) time, O(1) space'
    code: dsa-ship-capacity
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8512004/amazon-sde2-interview-experience-oa-phon-jhvj/
  - id: container-water
    section: dsa
    title: 'Container With Most Water'
    difficulty: medium
    leetcode: container-with-most-water
    listWindow: '30 days'
    topic: dsa/two-pointers
    problem: '`height[i]` is the height of a vertical line at position `i`. Pick two lines that, with the x-axis, form a container holding the most water. Return that amount.'
    examples:
      - input: 'height = [2, 7, 3, 1, 6, 4]'
        output: '18'
        explanation: 'Lines at positions 1 and 4: width 3, height 6.'
    constraints:
      - '2 ≤ height.length ≤ 10⁵'
      - '0 ≤ height[i] ≤ 10⁴'
    solution: 'Two pointers at the ends. The area is limited by the shorter line, and moving the taller one inward can only shrink the width without raising that limit, so always move the shorter one.'
    complexity: 'O(n) time, O(1) space'
    code: dsa-container-water
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8512004/amazon-sde2-interview-experience-oa-phon-jhvj/
  - id: cheapest-flights
    section: dsa
    title: 'Cheapest Flights Within K Stops'
    difficulty: medium
    leetcode: cheapest-flights-within-k-stops
    listWindow: '3 months'
    topic: dsa/shortest-paths
    problem: 'There are `n` cities and a list of flights `[from, to, price]`. Find the cheapest price from `src` to `dst` using at most `k` stops in between, or `-1` if there is no such route.'
    examples:
      - input: 'n = 4, flights = [[0,1,50], [1,2,50], [2,0,50], [1,3,500], [2,3,150]], src = 0, dst = 3, k = 1'
        output: '550'
        explanation: '0 → 1 → 3. The cheaper route 0 → 1 → 2 → 3 needs two stops.'
    constraints:
      - '1 ≤ n ≤ 100'
      - '0 ≤ k < n'
      - 'No duplicate flights'
