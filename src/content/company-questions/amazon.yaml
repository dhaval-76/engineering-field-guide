  - id: lld-pubsub
    section: lld
    title: 'Publisher-Subscriber System'
    topic: low-level-design/pub-sub
    problem: |-
      "Design an in-process publish-subscribe system. A publisher sends events of a particular type, and every subscriber subscribed to that type receives them. Subscribers can subscribe and unsubscribe."

      **Requirements**
      - `subscribe(type, subscriber)`, `unsubscribe(type, subscriber)`, `publish(event)`.
      - Every current subscriber of the type gets each event.
      - Safe with many publishing and subscribing threads.

      **Expect follow-ups on:** a slow or failing subscriber, ordering, and delivery guarantees.
    solution: |-
      **Clarify first**
      - In one process or across services? (One process here; across services this becomes Kafka or SNS.)
      - Synchronous delivery or asynchronous? Must one subscriber's slowness affect others? (No.)
      - Ordering: per subscriber, in publish order? (Yes.) Guarantees if a subscriber throws? (Isolate it; optionally retry.)

      **Core classes**
      - `Event(type, payload)` and a `Subscriber` interface with `onEvent(event)`: the Observer pattern.
      - `EventBus` holds a `ConcurrentHashMap<type, Set<Subscriber>>` with copy-on-write sets, so publishing iterates safely while others subscribe or unsubscribe.

      **Delivery**
      - Calling subscribers on the publisher's thread is simplest, but one slow subscriber then stalls the publisher and everyone after it.
      - Better: each subscriber gets its **own single-thread mailbox**. Publishing just enqueues, a slow subscriber only delays itself, and each subscriber still sees events in publish order.
      - Wrap every call in try/catch: count failures, retry with a limit, or move the event to a dead-letter list. One subscriber throwing must not stop the others.

      **Follow-ups**
      - **Back-pressure:** bound each mailbox; when full, drop the oldest, block the publisher, or disconnect the subscriber, depending on the use.
      - **Wildcards** (`order.*`): match by prefix at publish time, or keep a trie of topics.
      - **Durability:** in memory, events are lost on restart; for "at least once", persist first, keep per-subscriber offsets and redeliver, which is what a log like Kafka does.

      **What a strong answer shows:** thread-safe registration, isolation between subscribers, a clear ordering guarantee and a stated delivery guarantee.
    code: cq-lld-pubsub
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8513742/amazon-sde-2-l5-spain-by-anonymous_user-vs2p/
  - id: lld-notification
    section: lld
    title: 'Notification System'
    topic: system-design/notification-system
    problem: |-
      "Design a notification system. It sends messages over several channels such as SMS and email, and each user has configured which channels they want."

      **Requirements**
      - Channels: SMS and email now, more later (push, WhatsApp).
      - Users choose their channels.
      - Handle failures: retry what can succeed, report what can't.

      The report expected the **Factory, Strategy and Singleton** patterns to come up, with attention to **error handling and extensibility**.

      **Expect follow-ups on:** adding a channel, retries and their limits, and sending to many users.
    solution: |-
      **Clarify first**
      - Transactional (order shipped) or bulk marketing? (Transactional: each must arrive, quickly.)
      - Per-user preferences, quiet hours, templates? (Preferences yes; templates as an extension.)
      - What does "sent" mean for each channel, and which failures are worth retrying?

      **Patterns the interviewer named, and where they fit**
      - **Strategy:** `NotificationSender` interface with `send(user, message)`; one class per channel.
      - **Factory:** `SenderFactory` returns the sender for a channel. Adding WhatsApp is a new class plus one registration, nothing else changes.
      - **Singleton:** the `NotificationService` exists once, but create it once at startup and inject it rather than using a static `getInstance()`, which makes testing hard. Say this trade-off out loud.

      **Error handling**
      - A `DeliveryException` carries whether it is **retryable**: a timeout is, an invalid number isn't.
      - Retry retryable failures with exponential backoff, up to a limit; give up at once on permanent ones.
      - Each channel is independent: email failing must not stop SMS.
      - Return a result per channel (delivered, attempts, error) so callers and logs can see what happened.

      **Follow-ups**
      - **Scale:** put notifications on a queue and let workers send them; retries become delayed re-queues, and exhausted ones go to a dead-letter queue.
      - **Idempotency:** give each notification an id so a retried send isn't delivered twice.
      - **Rate limits per provider and per user**, and quiet hours checked before sending.

      **What a strong answer shows:** each named pattern used for a reason, failures classified as retryable or not, and channels isolated from each other.
    code: cq-lld-notification
    reports:
      - year: 2026
        source: https://leetcode.com/discuss/post/8584198/amazon-l5-interview-experience-offer-by-thbff/
  - id: lld-elevator
    section: lld
    title: 'Elevator System'
    topic: low-level-design/elevator
    problem: |-
      "Design the control system for the elevators in a building."

      **Requirements**
      - Several elevators serve several floors.
      - People press **up** or **down** on a floor (hall call), and a floor number inside a car (car call).
      - A dispatcher chooses which elevator answers each hall call.
      - Elevators move, stop at requested floors and open doors.

      **Expect follow-ups on:** a different scheduling policy, the states of an elevator, and peak traffic.
    solution: |-
      **Clarify first**
      - How many floors and elevators? Capacity limits? Emergency or maintenance modes? (Mention them; design for normal operation first.)
      - Should a simulation tick, or should it react to events? (A tick-based model is easiest to explain and test.)

      **Core classes**
      - `Direction` (UP, DOWN, IDLE).
      - `Elevator`: current floor, direction, and a sorted set of stops. `step()` moves one floor; it keeps going in the same direction while stops remain ahead and reverses only when none are (the SCAN, or "elevator", algorithm), so it doesn't zig-zag.
      - `DispatchStrategy` interface: given all elevators and a hall call, choose one. `NearestSuitable` prefers an idle elevator, or one already moving towards the floor in the requested direction.
      - `ElevatorController`: takes hall calls (through the strategy) and car calls (straight to that car), and ticks all elevators.

      **Why these choices**
      - The scheduling policy changes most (peak mornings, energy saving), so it sits behind an interface.
      - Each elevator owns its state; the controller never edits it directly.
      - Stops in a `TreeSet` give the next stop in either direction in O(log n).

      **Follow-ups**
      - **State pattern:** moving, doors open, idle and maintenance as state objects, if behaviour per state grows.
      - **Peak traffic:** a zoning strategy (some cars serve only high floors in the morning), switched by time of day.
      - **Concurrency:** requests arrive from many buttons at once; serialise them through the controller (a queue or a lock) so two hall calls don't both pick a car using stale state.

      **What a strong answer shows:** a policy behind an interface, a sensible movement rule, and a model you can step through to prove it works.
    code: cq-lld-elevator
    reports:
      - year: 2026
