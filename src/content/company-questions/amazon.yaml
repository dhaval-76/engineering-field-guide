      - 'No leading zeros'
    solution: 'Walk both lists together, adding digits and a carry, appending `sum % 10` to the result and carrying `sum / 10`. Continue while either list or the carry remains. A dummy head node keeps the code short.'
    complexity: 'O(max(m, n)) time'
