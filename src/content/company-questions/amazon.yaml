  - id: two-sum
    section: dsa
    title: 'Two Sum'
    difficulty: easy
    leetcode: two-sum
    listWindow: '30 days'
    topic: dsa/arrays-and-hashing
    problem: 'Given an array of integers and a target, return the indices of the two numbers that add up to the target. Exactly one answer exists, and you may not use the same element twice.'
    examples:
      - input: 'nums = [8, 3, 11, 6], target = 9'
        output: '[1, 3]'
        explanation: '3 + 6 = 9.'
      - input: 'nums = [5, 5, 1], target = 10'
        output: '[0, 1]'
    constraints:
      - '2 ≤ nums.length ≤ 10⁴'
      - 'Exactly one valid answer'
    solution: 'One pass with a hash map from value to index: for each number, check whether `target - number` is already in the map, then add the number. O(n) instead of checking every pair.'
    complexity: 'O(n) time and space'
    code: dsa-two-sum
  - id: max-coins-bags
    section: dsa
    title: 'Maximum Coins from K Consecutive Bags'
    difficulty: medium
    leetcode: maximum-coins-from-k-consecutive-bags
    listWindow: '30 days'
    topic: dsa/sliding-window
    problem: 'Bags stand on a number line, one per integer position. You are given non-overlapping ranges `[left, right, c]`: every bag from `left` to `right` holds `c` coins; all other bags are empty. Return the most coins you can collect from `k` consecutive bags.'
    examples:
      - input: 'coins = [[1,3,2], [5,6,4], [8,10,1]], k = 4'
        output: '10'
        explanation: 'Bags 3 to 6: 2 + 0 + 4 + 4.'
      - input: 'coins = [[1,10,3]], k = 2'
        output: '6'
    constraints:
      - '1 ≤ coins.length ≤ 10⁵'
      - '1 ≤ left ≤ right ≤ 10⁹'
      - '1 ≤ k ≤ 10⁹'
    solution: 'Positions go up to 10⁹, so slide over ranges, not bags. An optimal window can always be shifted until it starts at some ranges left end or ends at some ranges right end. Check every window starting at a left end with two pointers (whole ranges inside, plus a partial one at the end), then mirror the line and repeat for windows ending at right ends.'
    complexity: 'O(n log n) time, O(n) space'
    code: cq-max-coins-bags
