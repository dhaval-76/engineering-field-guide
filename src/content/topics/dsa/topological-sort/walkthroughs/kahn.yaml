title: Kahn's algorithm on course prerequisites
frames:
  - caption: 'Courses 0–4. Edges point from prerequisite to course: 0→1, 0→2, 1→3, 2→3, 3→4. In-degree = number of unmet prerequisites.'
    panels:
      - kind: kv
        label: in-degree
        pairs: [['0', { v: '0', tone: ok }], ['1', '1'], ['2', '1'], ['3', '2'], ['4', '1']]
      - kind: queue
        label: ready
        items: [{ v: '0', tone: ok }]
  - caption: 'Take 0 (no prerequisites). Removing its edges lowers 1 and 2 to in-degree 0 — both become ready.'
    panels:
      - kind: array
        label: order
        items: [{ v: '0', tone: accent }]
      - kind: queue
        label: ready
        items: ['1', '2']
  - caption: 'Take 1, then 2. Each lowers course 3; after both, 3 has in-degree 0.'
    panels:
      - kind: array
        label: order
        items: ['0', { v: '1', tone: accent }, { v: '2', tone: accent }]
      - kind: queue
        label: ready
        items: ['3']
  - caption: 'Take 3, then 4. All 5 courses processed → no cycle; the order is valid. Had there been a cycle, its nodes would never reach in-degree 0 and the count would fall short.'
    panels:
      - kind: array
        label: order
        items: ['0', '1', '2', '3', { v: '4', tone: ok }]
