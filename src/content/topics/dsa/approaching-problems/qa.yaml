questions:
  - q: 'You are given a problem you have never seen. Walk me through how you would start.'
    think: The interviewer wants to hear a method, not a guess at the answer.
    answer: |
      Restate the input and output and ask about anything unstated (sorted? negatives? duplicates? empty input? any answer or all?). Work one normal example and one edge case by hand. Ask for the input size and turn it into a budget: n ≤ 20 allows 2ⁿ, n ≤ 5,000 allows n², n ≤ 10⁵ needs n log n or better. Name the patterns the wording suggests and test them against the example. State the brute force and its complexity, find the work it repeats, and remove it with the right data structure. Then code, run the examples through the code, check the edge cases and state the final complexity.
  - q: 'The constraints say n ≤ 15. What does that tell you?'
    think: How big is 2¹⁵?
    answer: |
      2¹⁵ = 32,768 and 15! ≈ 1.3 × 10¹², so trying every subset (O(2ⁿ · n)) is intended, while trying every ordering is not. Expect backtracking over subsets, a bitmask over the items, or a bitmask DP such as "dp[mask] = best result using this set of items". A greedy or O(n log n) idea may exist, but the setter chose a small n because the natural solution is exponential.
followUps:
  - q: 'The word "subarray" is in the problem. Is it always a sliding window?'
    intuition: What property does a window need?
    approach: |
      No. A variable window needs a monotone condition: once a window is invalid, every bigger window containing it must be invalid too. Sums of non-negative numbers are monotone; sums with negative numbers aren't, so "subarray sum equals k" with negatives needs prefix sums and a hash map. "Exactly k" conditions aren't monotone either; use atMost(k) − atMost(k − 1).
  - q: 'How do you tell greedy from dynamic programming?'
    intuition: Can you prove the local choice never needs to be undone?
    approach: |
      Try to find a counterexample to the greedy choice on a small input (coins 1, 3, 4 with amount 6: greedy takes 4 + 1 + 1, the best is 3 + 3). If you find one, the problem needs DP over the choices. If you can argue that swapping any optimal solution's first choice for the greedy one never makes it worse (an exchange argument), greedy is correct and usually faster.
practice:
  - task: 'For each of these, name the pattern before solving: (a) longest substring with at most two distinct characters; (b) minimum number of meeting rooms; (c) smallest divisor such that the sum of rounded-up quotients ≤ threshold; (d) the number of islands in a grid.'
    hint: Look for contiguous, overlapping ranges, "smallest value such that", and connected cells.
    solution: |
      (a) Contiguous + longest + "more than two distinct" gets worse as the window grows → variable sliding window. (b) Overlapping time ranges → sort by start and keep a min-heap of end times (or sweep start and end events). (c) "Smallest value such that", and a bigger divisor only makes the sum smaller (monotone) → binary search on the answer. (d) Connected cells in a grid → BFS or DFS from each unvisited land cell (or union-find).
quiz:
  - q: 'n ≤ 10⁵. Which complexity should you aim for?'
    options: ['O(2ⁿ)', 'O(n²)', 'O(n log n) or better', 'Any — inputs are small']
    correct: 2
    why: 'n² would be 10¹⁰ steps; n log n is about 1.7 × 10⁶.'
  - q: 'Find the k most frequent words in a list.'
    options: [Sliding window, Hash map counts + a heap of size k, Union-find, Backtracking]
    correct: 1
    why: 'Count with a map, then keep the k best in a min-heap (or bucket by count): O(n log k).'
  - q: 'Given flights with prices, find the cheapest route from A to B.'
    options: [BFS, Dijkstra, Topological sort, Two pointers]
    correct: 1
    why: 'Weighted edges and "cheapest" mean a weighted shortest path; BFS only counts edges.'
  - q: 'Return all ways to place n queens on an n × n board (n ≤ 9).'
    options: [Dynamic programming, Greedy, Backtracking, Binary search]
    correct: 2
    why: '"All ways" plus a tiny n means building candidates and undoing choices: backtracking with pruning.'
  - q: 'Can all courses be finished, given prerequisite pairs?'
    options: [Union-find, Topological sort (cycle check), Heap, Prefix sums]
    correct: 1
    why: 'Prerequisites form a directed graph; an order exists exactly when there is no cycle.'
  - q: 'For each day, how many days until a warmer temperature?'
    options: [Monotonic stack, Binary search, Sliding window, Union-find]
    correct: 0
    why: '"Next greater element" is the classic monotonic stack problem: O(n).'
  - q: 'An answer must be returned "modulo 10⁹ + 7". What does that usually mean?'
    options: [The input is huge, You are counting ways and the count is enormous, Use floating point, Sort first]
    correct: 1
    why: 'Large counts of ways point to DP or combinatorics, with the modulo applied at each step.'
