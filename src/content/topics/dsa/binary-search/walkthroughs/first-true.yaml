title: First index with value ≥ 7
frames:
  - caption: 'Predicate: `nums[i] >= 7`. It is false, false, …, then true — a single flip. The answer lies in [lo, hi] = [0, 8] (8 = "not found").'
    panels:
      - kind: array
        label: nums
        items: ['1', '3', '4', '6', '7', '7', '9', '12']
      - kind: kv
        label: Range
        pairs: [[lo, '0'], [hi, '8']]
  - caption: 'mid = 4: nums[4] = 7 ≥ 7 → true. The first true is at 4 or to its left: hi = 4.'
    panels:
      - kind: array
        label: nums
        items: ['1', '3', '4', '6', { v: '7', tone: accent }, { v: '7', tone: muted }, { v: '9', tone: muted }, { v: '12', tone: muted }]
      - kind: kv
        label: Range
        pairs: [[lo, '0'], [hi, { v: '4', tone: info }]]
  - caption: 'mid = 2: nums[2] = 4 → false. The answer is right of 2: lo = 3.'
    panels:
      - kind: array
        label: nums
        items: [{ v: '1', tone: muted }, { v: '3', tone: muted }, { v: '4', tone: accent }, '6', '7', { v: '7', tone: muted }, { v: '9', tone: muted }, { v: '12', tone: muted }]
      - kind: kv
        label: Range
        pairs: [[lo, { v: '3', tone: info }], [hi, '4']]
  - caption: 'mid = 3: nums[3] = 6 → false: lo = 4. Now lo == hi = 4 — the first 7. Three probes for eight elements; a million elements would need about 20.'
    panels:
      - kind: array
        label: nums
        items: [{ v: '1', tone: muted }, { v: '3', tone: muted }, { v: '4', tone: muted }, { v: '6', tone: muted }, { v: '7', tone: ok }, '7', '9', '12']
      - kind: kv
        label: Result
        pairs: [[index, { v: '4', tone: ok }]]
