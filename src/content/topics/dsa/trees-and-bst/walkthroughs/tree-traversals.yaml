title: Four ways to visit the same tree
frames:
  - caption: 'The tree: 4 at the root, 2 (with children 1 and 3) on the left, 6 (with 5 and 7) on the right. It is a BST.'
    panels:
      - kind: kv
        label: Tree (node → children)
        pairs: [['4', '2, 6'], ['2', '1, 3'], ['6', '5, 7']]
  - caption: '**Pre-order** (node, left, right): visit a node before its subtrees — good for copying a tree or passing state down.'
    panels:
      - kind: array
        label: pre-order
        items: [{ v: '4', tone: accent }, '2', '1', '3', '6', '5', '7']
  - caption: '**In-order** (left, node, right): on a BST this produces **sorted** order.'
    panels:
      - kind: array
        label: in-order
        items: ['1', '2', '3', { v: '4', tone: accent }, '5', '6', '7']
  - caption: '**Post-order** (left, right, node): children before parents — how heights, sizes and deletions are computed.'
    panels:
      - kind: array
        label: post-order
        items: ['1', '3', '2', '5', '7', '6', { v: '4', tone: accent }]
  - caption: '**Level order** (BFS with a queue): one level at a time — right side views, minimum depth, shortest paths in unweighted trees.'
    panels:
      - kind: rows
        label: levels
        items: ['[4]', '[2, 6]', '[1, 3, 5, 7]']
