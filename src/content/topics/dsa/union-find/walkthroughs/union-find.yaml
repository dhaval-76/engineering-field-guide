title: Unions, finds and path compression
frames:
  - caption: 'Six items, each its own set: parent[i] = i. Components: 6.'
    panels:
      - kind: array
        label: parent
        items: ['0', '1', '2', '3', '4', '5']
      - kind: kv
        label: State
        pairs: [[components, '6']]
  - caption: 'union(0, 1), union(2, 3): the smaller set''s root points to the larger''s. Components: 4.'
    panels:
      - kind: array
        label: parent
        items: ['0', { v: '0', tone: accent }, '2', { v: '2', tone: accent }, '4', '5']
      - kind: kv
        label: State
        pairs: [[components, '4']]
  - caption: 'union(1, 3): find(1) = 0, find(3) = 2 — different roots, so link 2 under 0. Now 3 → 2 → 0. Components: 3.'
    panels:
      - kind: array
        label: parent
        items: ['0', '0', { v: '0', tone: accent }, '2', '4', '5']
      - kind: kv
        label: State
        pairs: [[components, '3']]
  - caption: 'find(3) walks 3 → 2 → 0 and **compresses** the path: 3 now points straight at 0. Future finds on 3 take one step.'
    panels:
      - kind: array
        label: parent
        items: ['0', '0', '0', { v: '0', tone: ok }, '4', '5']
  - caption: 'union(0, 3): both already have root 0 → returns **false**. In an undirected graph, that edge would close a cycle.'
    panels:
      - kind: kv
        label: union(0, 3)
        pairs: [[find(0), '0'], [find(3), '0'], [result, { v: 'already connected → cycle', tone: warn }]]
