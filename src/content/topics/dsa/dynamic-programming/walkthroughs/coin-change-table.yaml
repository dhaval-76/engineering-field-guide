title: Fewest coins for amount 6 with coins {1, 3, 4}
frames:
  - caption: '`dp[a]` = fewest coins that make amount a. Base: dp[0] = 0; everything else starts at ∞.'
    panels:
      - kind: array
        label: dp (amount 0..6)
        items: [{ v: '0', tone: ok }, '∞', '∞', '∞', '∞', '∞', '∞']
  - caption: 'For each amount a, try every coin c ≤ a: dp[a] = min(dp[a − c] + 1). a = 1, 2: only coin 1 fits → 1, 2.'
    panels:
      - kind: array
        label: dp
        items: ['0', { v: '1', tone: info }, { v: '2', tone: info }, '∞', '∞', '∞', '∞']
  - caption: 'a = 3: coin 3 → dp[0] + 1 = 1. a = 4: coin 4 → dp[0] + 1 = 1. a = 5: coin 1 → dp[4] + 1 = 2 (coin 4 → dp[1] + 1 = 2 too).'
    panels:
      - kind: array
        label: dp
        items: ['0', '1', '2', { v: '1', tone: info }, { v: '1', tone: info }, { v: '2', tone: info }, '∞']
  - caption: 'a = 6: coin 1 → dp[5] + 1 = 3; coin 3 → dp[3] + 1 = **2**; coin 4 → dp[2] + 1 = 3. Answer 2 (3 + 3) — greedy "largest coin first" would pick 4 + 1 + 1 = 3 coins.'
    panels:
      - kind: array
        label: dp
        items: ['0', '1', '2', '1', '1', '2', { v: '2', tone: ok }]
