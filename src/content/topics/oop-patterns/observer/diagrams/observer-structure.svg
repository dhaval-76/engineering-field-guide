<svg viewBox="0 0 620 190" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="observer-pattern-d1-obs-arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="var(--d-plum)"></path></marker>
    <marker id="observer-pattern-d1-obs-inh" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><polygon points="0,0 0,10 10,5" fill="var(--d-bg)" stroke="var(--d-plum)" stroke-width="1.5"></polygon></marker>
  </defs>
  <!-- Subject box -->
  <rect x="8" y="40" width="188" height="110" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-width="1.5"></rect>
  <rect x="8" y="40" width="188" height="28" rx="8" fill="var(--d-info)"></rect>
  <rect x="8" y="60" width="188" height="8" fill="var(--d-info)"></rect>
  <text x="102" y="59" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--d-bg)" font-weight="600">StockTicker (subject)</text>
  <text x="18" y="84" font-family="var(--font-sans)" font-size="11" fill="var(--d-text)">- observers: List</text>
  <text x="18" y="102" font-family="var(--font-sans)" font-size="11" fill="var(--d-text)">+ subscribe(observer)</text>
  <text x="18" y="120" font-family="var(--font-sans)" font-size="11" fill="var(--d-text)">+ unsubscribe(observer)</text>
  <text x="18" y="138" font-family="var(--font-sans)" font-size="11" fill="var(--d-text)">+ update(symbol, price)</text>
  <!-- Observer interface -->
  <rect x="240" y="4" width="168" height="44" rx="8" fill="var(--d-plum-soft)" stroke="var(--d-plum)" stroke-width="1.5" stroke-dasharray="4,2"></rect>
  <text x="324" y="26" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--d-plum)">«interface» PriceListener</text>
  <text x="324" y="42" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--d-muted)">+ onPriceChange(…)</text>
  <!-- Concrete observers -->
  <rect x="204" y="100" width="118" height="48" rx="6" fill="var(--d-bg)" stroke="var(--d-plum)" stroke-width="1"></rect>
  <text x="263" y="122" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--d-text)">PriceAlert</text>
  <text x="263" y="140" font-family="var(--font-mono)" font-size="9" fill="var(--d-muted)">  sends SMS alert</text>
  <rect x="340" y="100" width="118" height="48" rx="6" fill="var(--d-bg)" stroke="var(--d-plum)" stroke-width="1"></rect>
  <text x="399" y="122" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--d-text)">GraphUpdater</text>
  <text x="399" y="140" font-family="var(--font-mono)" font-size="9" fill="var(--d-muted)">  redraws chart</text>
  <rect x="476" y="100" width="118" height="48" rx="6" fill="var(--d-bg)" stroke="var(--d-plum)" stroke-width="1"></rect>
  <text x="535" y="122" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--d-text)">AuditLogger</text>
  <text x="535" y="140" font-family="var(--font-mono)" font-size="9" fill="var(--d-muted)">  writes to log</text>
  <!-- Inheritance arrows from concretes to interface -->
  <line x1="263" y1="100" x2="296" y2="48" stroke="var(--d-plum)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#observer-pattern-d1-obs-inh)"></line>
  <line x1="399" y1="100" x2="352" y2="48" stroke="var(--d-plum)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#observer-pattern-d1-obs-inh)"></line>
  <line x1="500" y1="100" x2="380" y2="48" stroke="var(--d-plum)" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#observer-pattern-d1-obs-inh)"></line>
  <!-- notifyAll arrow from Subject to interface -->
  <path d="M196,80 C220,60 228,40 238,28" stroke="var(--d-info)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#observer-pattern-d1-obs-arr)" fill="none"></path>
  <text x="198" y="58" font-family="var(--font-mono)" font-size="9" fill="var(--d-info)">notify each</text>
</svg>