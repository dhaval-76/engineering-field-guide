<svg viewBox="0 0 340 470" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <g stroke-width="1.5">
    <rect x="6" y="6" width="328" height="128" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <rect x="6" y="142" width="328" height="100" rx="8" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
    <rect x="6" y="250" width="328" height="100" rx="8" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="6" y="358" width="328" height="106" rx="8" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  </g>
  <g font-weight="700" letter-spacing=".04em" font-size="11.5">
    <text x="18" y="28" fill="var(--d-info)">DECORATOR — same interface, added behaviour</text>
    <text x="18" y="164" fill="var(--d-plum)">ADAPTER — different interface, translated</text>
    <text x="18" y="272" fill="var(--d-ok)">FACADE — one simple entry to many parts</text>
    <text x="18" y="380" fill="var(--d-warn)">PROXY — same interface, controlled access</text>
  </g>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="18" y="52">Metered(Logging(Retrying(</text>
    <text x="34" y="70">CardGatewayProcessor)))</text>
    <text x="18" y="190">your code → pay(Payment)</text>
    <text x="34" y="208">Adapter → legacy.submit(Map)</text>
    <text x="18" y="298">checkout() → pricing · inventory</text>
    <text x="104" y="316">payments · orders · email</text>
    <text x="18" y="406">caller → Proxy → real service</text>
    <text x="34" y="424">(cache · auth check · lazy load)</text>
  </g>
  <g font-size="11" fill="var(--d-muted)">
    <text x="18" y="96">each layer is a PaymentProcessor wrapping one —</text>
    <text x="18" y="112">stack them in any order, add or remove freely</text>
    <text x="18" y="232">makes an old or third-party API fit yours</text>
    <text x="18" y="340">hides how many subsystems a task needs</text>
    <text x="18" y="452">callers can't tell; it decides whether to forward</text>
  </g>
</svg>
