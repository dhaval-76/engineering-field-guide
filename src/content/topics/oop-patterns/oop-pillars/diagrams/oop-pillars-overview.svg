<svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <g stroke-width="1.5">
    <rect x="6" y="6" width="160" height="140" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <rect x="174" y="6" width="160" height="140" rx="8" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
    <rect x="6" y="154" width="160" height="140" rx="8" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="174" y="154" width="160" height="140" rx="8" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  </g>
  <g font-weight="700" letter-spacing=".04em" font-size="11.5">
    <text x="18" y="28" fill="var(--d-info)">ENCAPSULATION</text>
    <text x="186" y="28" fill="var(--d-plum)">ABSTRACTION</text>
    <text x="18" y="176" fill="var(--d-ok)">INHERITANCE</text>
    <text x="186" y="176" fill="var(--d-warn)">POLYMORPHISM</text>
  </g>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="18" y="52">- balance (private)</text>
    <text x="18" y="70">+ deposit(amount)</text>
    <text x="18" y="88">+ withdraw(amount)</text>
    <text x="186" y="52">«interface» Payments</text>
    <text x="186" y="70">+ charge()</text>
    <text x="186" y="88">+ refund()</text>
    <text x="18" y="200">BankAccount</text>
    <text x="34" y="218">↑ extends</text>
    <text x="18" y="236">SavingsAccount</text>
    <text x="186" y="200">shape.draw()</text>
    <text x="196" y="218">→ Circle ○</text>
    <text x="196" y="236">→ Square □</text>
  </g>
  <g font-size="11" fill="var(--d-muted)">
    <text x="18" y="124">private data, a public API</text>
    <text x="18" y="138">that protects its rules</text>
    <text x="186" y="124">say WHAT, hide HOW</text>
    <text x="186" y="138">callers see the interface</text>
    <text x="18" y="272">"is-a": reuse and</text>
    <text x="18" y="286">specialise a parent</text>
    <text x="186" y="272">one call, the object</text>
    <text x="186" y="286">decides what happens</text>
  </g>
</svg>
