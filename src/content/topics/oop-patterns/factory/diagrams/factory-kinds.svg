<svg viewBox="0 0 340 430" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <g stroke-width="1.5">
    <rect x="6" y="6" width="328" height="118" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <rect x="6" y="132" width="328" height="128" rx="8" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
    <rect x="6" y="268" width="328" height="156" rx="8" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  </g>
  <g font-weight="700" letter-spacing=".04em" font-size="11.5">
    <text x="18" y="28" fill="var(--d-info)">SIMPLE FACTORY</text>
    <text x="18" y="154" fill="var(--d-plum)">FACTORY METHOD</text>
    <text x="18" y="290" fill="var(--d-warn)">ABSTRACT FACTORY</text>
  </g>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="18" y="52">Notifiers.forChannel(channel)</text>
    <text x="34" y="70">→ EmailNotifier | SmsNotifier | Push…</text>
    <text x="18" y="178">ReportExporter.export()</text>
    <text x="34" y="196">calls abstract createWriter()</text>
    <text x="34" y="214">CsvExporter → CsvWriter</text>
    <text x="34" y="232">PdfExporter → PdfWriter</text>
    <text x="18" y="314">StorageFactory: blobStore() queue() secrets()</text>
    <text x="34" y="334">AwsFactory   → S3 · SQS · Secrets Manager</text>
    <text x="34" y="352">LocalFactory → files · in-memory · env vars</text>
  </g>
  <g font-size="11" fill="var(--d-muted)">
    <text x="18" y="96">one function picks the class from a parameter —</text>
    <text x="18" y="112">not a GoF pattern, but the most common in real code</text>
    <text x="18" y="252">subclasses override one creation step in a fixed workflow</text>
    <text x="18" y="380">one factory builds a whole family of objects that</text>
    <text x="18" y="396">must match (never S3 with a local queue)</text>
  </g>
</svg>
