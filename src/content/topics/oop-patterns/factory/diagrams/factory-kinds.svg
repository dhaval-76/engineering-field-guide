<svg viewBox="0 0 720 262" xmlns="http://www.w3.org/2000/svg" font-size="12">
  <defs>
    <marker id="fk-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-stroke)"/></marker>
    <marker id="fk-inh" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="var(--d-bg)" stroke="var(--d-stroke)"/></marker>
  </defs>
  <g font-family="var(--font-sans)">
    <!-- Column 1: simple factory -->
    <text x="110" y="20" text-anchor="middle" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">SIMPLE FACTORY</text>
    <rect x="30" y="34" width="160" height="40" rx="6" fill="var(--d-accent-soft)" stroke="var(--d-accent)" stroke-width="1.5"/>
    <text x="110" y="52" text-anchor="middle" fill="var(--d-text)" font-family="var(--font-mono)">Notifiers</text>
    <text x="110" y="67" text-anchor="middle" fill="var(--d-muted)" font-size="11">forChannel(channel)</text>
    <path d="M70 74 L50 120" stroke="var(--d-stroke)" stroke-width="1.3" marker-end="url(#fk-arr)"/>
    <path d="M110 74 L110 120" stroke="var(--d-stroke)" stroke-width="1.3" marker-end="url(#fk-arr)"/>
    <path d="M150 74 L170 120" stroke="var(--d-stroke)" stroke-width="1.3" marker-end="url(#fk-arr)"/>
    <rect x="12" y="122" width="72" height="30" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <text x="48" y="141" text-anchor="middle" fill="var(--d-text)">Email</text>
    <rect x="86" y="122" width="48" height="30" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <text x="110" y="141" text-anchor="middle" fill="var(--d-text)">SMS</text>
    <rect x="140" y="122" width="68" height="30" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <text x="174" y="141" text-anchor="middle" fill="var(--d-text)">Push</text>
    <text x="110" y="186" text-anchor="middle" fill="var(--d-text)">One function picks the class</text>
    <text x="110" y="203" text-anchor="middle" fill="var(--d-muted)">from a parameter.</text>
    <text x="110" y="230" text-anchor="middle" fill="var(--d-muted)" font-size="11">Not a GoF pattern, but the most</text>
    <text x="110" y="245" text-anchor="middle" fill="var(--d-muted)" font-size="11">common in real code.</text>

    <line x1="240" y1="20" x2="240" y2="280" stroke="var(--d-line)" stroke-dasharray="3 4"/>

    <!-- Column 2: factory method -->
    <text x="360" y="20" text-anchor="middle" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">FACTORY METHOD</text>
    <rect x="270" y="34" width="180" height="52" rx="6" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-dasharray="4 3"/>
    <text x="360" y="52" text-anchor="middle" fill="var(--d-text)" font-family="var(--font-mono)">ReportExporter</text>
    <text x="360" y="68" text-anchor="middle" fill="var(--d-muted)" font-size="11">export() uses</text>
    <text x="360" y="81" text-anchor="middle" fill="var(--d-accent)" font-size="11" font-weight="600">createWriter() — abstract</text>
    <path d="M310 124 L330 88" stroke="var(--d-stroke)" stroke-width="1.2" marker-end="url(#fk-inh)"/>
    <path d="M410 124 L390 88" stroke="var(--d-stroke)" stroke-width="1.2" marker-end="url(#fk-inh)"/>
    <rect x="262" y="124" width="96" height="30" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <text x="310" y="143" text-anchor="middle" fill="var(--d-text)">CsvExporter</text>
    <rect x="362" y="124" width="96" height="30" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <text x="410" y="143" text-anchor="middle" fill="var(--d-text)">PdfExporter</text>
    <text x="360" y="186" text-anchor="middle" fill="var(--d-text)">Subclasses override one</text>
    <text x="360" y="203" text-anchor="middle" fill="var(--d-muted)">creation step in a fixed workflow.</text>

    <line x1="480" y1="20" x2="480" y2="280" stroke="var(--d-line)" stroke-dasharray="3 4"/>

    <!-- Column 3: abstract factory -->
    <text x="600" y="20" text-anchor="middle" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">ABSTRACT FACTORY</text>
    <rect x="510" y="34" width="180" height="52" rx="6" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-width="1.5"/>
    <text x="600" y="52" text-anchor="middle" fill="var(--d-text)" font-family="var(--font-mono)">StorageFactory</text>
    <text x="600" y="68" text-anchor="middle" fill="var(--d-muted)" font-size="11">blobStore() · queue()</text>
    <text x="600" y="81" text-anchor="middle" fill="var(--d-muted)" font-size="11">secrets()</text>
    <rect x="502" y="110" width="92" height="74" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <text x="548" y="128" text-anchor="middle" fill="var(--d-text)" font-weight="600">AwsFactory</text>
    <text x="548" y="146" text-anchor="middle" fill="var(--d-muted)" font-size="11">S3</text>
    <text x="548" y="161" text-anchor="middle" fill="var(--d-muted)" font-size="11">SQS</text>
    <text x="548" y="176" text-anchor="middle" fill="var(--d-muted)" font-size="11">Secrets Mgr</text>
    <rect x="606" y="110" width="92" height="74" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <text x="652" y="128" text-anchor="middle" fill="var(--d-text)" font-weight="600">LocalFactory</text>
    <text x="652" y="146" text-anchor="middle" fill="var(--d-muted)" font-size="11">files</text>
    <text x="652" y="161" text-anchor="middle" fill="var(--d-muted)" font-size="11">in-memory</text>
    <text x="652" y="176" text-anchor="middle" fill="var(--d-muted)" font-size="11">env vars</text>
    <text x="600" y="214" text-anchor="middle" fill="var(--d-text)">One factory builds a whole</text>
    <text x="600" y="231" text-anchor="middle" fill="var(--d-muted)">family that must match.</text>
  </g>
</svg>
