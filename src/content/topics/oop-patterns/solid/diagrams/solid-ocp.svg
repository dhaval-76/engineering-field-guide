<svg viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <rect x="6" y="6" width="328" height="140" rx="8" fill="var(--d-bad-soft)" stroke="var(--d-bad)" stroke-width="1.5"/>
  <text x="18" y="28" fill="var(--d-bad)" font-weight="700" letter-spacing=".04em">✗ VIOLATES OPEN/CLOSED</text>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="18" y="52">if (type == FLAT)     { … }</text>
    <text x="18" y="70">if (type == PERCENT)  { … }</text>
    <text x="18" y="88">if (type == SEASONAL) { … }</text>
  </g>
  <text x="18" y="114" fill="var(--d-muted)" font-size="11">adding LOYALTY means editing this method —</text>
  <text x="18" y="130" fill="var(--d-muted)" font-size="11">and re-testing every existing case</text>
  <text x="170" y="168" text-anchor="middle" fill="var(--d-muted)" font-size="18">↓</text>
  <rect x="6" y="180" width="328" height="144" rx="8" fill="var(--d-ok-soft)" stroke="var(--d-ok)" stroke-width="1.5"/>
  <text x="18" y="202" fill="var(--d-ok)" font-weight="700" letter-spacing=".04em">✓ FOLLOWS OPEN/CLOSED</text>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="18" y="226">interface Discount { apply(amount) }</text>
    <text x="18" y="244">class Flat     implements Discount</text>
    <text x="18" y="262">class Percent  implements Discount</text>
    <text x="18" y="280" fill="var(--d-ok)">class Loyalty  implements Discount  ← new</text>
  </g>
  <text x="18" y="308" fill="var(--d-muted)" font-size="11">new behaviour = a new class; existing ones untouched</text>
</svg>
