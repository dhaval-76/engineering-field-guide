<svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <g stroke-width="1.5">
    <rect x="6" y="6" width="328" height="52" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <rect x="6" y="64" width="328" height="52" rx="8" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="6" y="122" width="328" height="52" rx="8" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
    <rect x="6" y="180" width="328" height="52" rx="8" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
    <rect x="6" y="238" width="328" height="56" rx="8" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/>
  </g>
  <g font-family="var(--font-serif)" font-size="26" font-weight="600">
    <text x="20" y="42" fill="var(--d-info)">S</text>
    <text x="20" y="100" fill="var(--d-ok)">O</text>
    <text x="20" y="158" fill="var(--d-plum)">L</text>
    <text x="20" y="216" fill="var(--d-warn)">I</text>
    <text x="20" y="276" fill="var(--d-accent)">D</text>
  </g>
  <g fill="var(--d-text)" font-weight="600">
    <text x="54" y="27">Single responsibility</text>
    <text x="54" y="85">Open/closed</text>
    <text x="54" y="143">Liskov substitution</text>
    <text x="54" y="201">Interface segregation</text>
    <text x="54" y="259">Dependency inversion</text>
  </g>
  <g fill="var(--d-muted)" font-size="11.5">
    <text x="54" y="45">one class, one reason to change</text>
    <text x="54" y="103">extend with new code, don't edit working code</text>
    <text x="54" y="161">a subtype keeps every promise of its parent</text>
    <text x="54" y="219">small, focused interfaces for each client</text>
    <text x="54" y="278">depend on abstractions, not concrete classes</text>
  </g>
</svg>
