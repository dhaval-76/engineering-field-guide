<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="13">
  <rect x="40" y="16" width="560" height="40" rx="6" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/>
  <text x="54" y="41" fill="var(--d-text)" font-weight="600">Linearizable</text>
  <text x="588" y="41" fill="var(--d-muted)" font-size="11.5" text-anchor="end">one copy, real-time order</text>
  <rect x="40" y="66" width="490" height="40" rx="6" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  <text x="54" y="91" fill="var(--d-text)" font-weight="600">Sequential</text>
  <text x="518" y="91" fill="var(--d-muted)" font-size="11.5" text-anchor="end">same order everywhere</text>
  <rect x="40" y="116" width="420" height="40" rx="6" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
  <text x="54" y="141" fill="var(--d-text)" font-weight="600">Causal</text>
  <text x="448" y="141" fill="var(--d-muted)" font-size="11.5" text-anchor="end">effects after causes</text>
  <rect x="40" y="166" width="350" height="40" rx="6" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
  <text x="54" y="191" fill="var(--d-text)" font-weight="600">Session guarantees</text>
  <text x="378" y="191" fill="var(--d-muted)" font-size="11.5" text-anchor="end">read-your-writes, monotonic</text>
  <rect x="40" y="216" width="280" height="40" rx="6" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
  <text x="54" y="241" fill="var(--d-text)" font-weight="600">Eventual</text>
  <text x="308" y="241" fill="var(--d-muted)" font-size="11.5" text-anchor="end">converges when writes stop</text>
  <g stroke="var(--d-line)" stroke-width="1.5" fill="none"><path d="M20 260 L20 22"/><path d="M14 30 L20 20 L26 30"/></g>
  <text x="40" y="282" fill="var(--d-muted)" font-size="11.5">Up: easier to reason about · more coordination, latency, unavailability during partitions</text>
</svg>
