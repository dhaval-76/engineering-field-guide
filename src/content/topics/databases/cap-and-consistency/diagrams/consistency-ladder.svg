<svg viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <g stroke-width="1.5">
    <rect x="40" y="6" width="294" height="50" rx="7" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/>
    <rect x="40" y="62" width="294" height="50" rx="7" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
    <rect x="40" y="118" width="294" height="50" rx="7" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
    <rect x="40" y="174" width="294" height="50" rx="7" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <rect x="40" y="230" width="294" height="50" rx="7" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
  </g>
  <g fill="var(--d-text)" font-weight="600">
    <text x="52" y="27">Linearizable</text><text x="52" y="83">Sequential</text><text x="52" y="139">Causal</text>
    <text x="52" y="195">Session guarantees</text><text x="52" y="251">Eventual</text>
  </g>
  <g fill="var(--d-muted)" font-size="11">
    <text x="52" y="45">behaves like one copy, in real-time order</text>
    <text x="52" y="101">every node sees the same order of writes</text>
    <text x="52" y="157">effects are never seen before their causes</text>
    <text x="52" y="213">read-your-writes, monotonic reads</text>
    <text x="52" y="269">all copies converge once writes stop</text>
  </g>
  <path d="M20 270 L20 18" stroke="var(--d-line)" stroke-width="2" fill="none"/>
  <path d="M14 26 L20 12 L26 26 Z" fill="var(--d-line)"/>
  <text x="10" y="304" fill="var(--d-text)" font-size="11.5">Up: easier to reason about —</text>
  <text x="10" y="320" fill="var(--d-muted)" font-size="11">but more coordination, latency, and unavailability in a partition.</text>
</svg>
