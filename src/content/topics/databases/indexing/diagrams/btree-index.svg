  <text x="20" y="226" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">id=52 · Asha · PAID · 120.00</text>
  <text x="10" y="262" fill="var(--d-text)" font-size="11.5">WHERE id = 52: root → leaf → row — three page</text>
  <text x="10" y="278" fill="var(--d-text)" font-size="11.5">reads instead of scanning the whole table.</text>
  <text x="10" y="294" fill="var(--d-muted)" font-size="11">Range scans walk the linked leaves in order.</text>
