<svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <defs><marker id="bt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-info)"/></marker></defs>
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">ROOT PAGE</text>
  <g font-family="var(--font-mono)" fill="var(--d-text)">
