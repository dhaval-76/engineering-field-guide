  <path d="M166 130 L166 186" fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#bt-a)"/>
  <text x="176" y="160" fill="var(--d-muted)" font-size="11">row pointer (page 812, item 4)</text>
  <text x="10" y="198" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">TABLE (HEAP)</text>
