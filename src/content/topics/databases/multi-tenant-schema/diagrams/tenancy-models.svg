<svg viewBox="0 0 660 250" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <g font-weight="600" fill="var(--d-text)" text-anchor="middle" font-size="13">
    <text x="110" y="22">Shared tables (pool)</text><text x="330" y="22">Schema per tenant</text><text x="550" y="22">Database per tenant</text>
  </g>

  <rect x="20" y="36" width="180" height="150" rx="8" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <text x="34" y="56" fill="var(--d-muted)" font-size="11">database</text>
  <rect x="34" y="66" width="152" height="104" rx="4" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
  <text x="110" y="84" text-anchor="middle" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">orders</text>
  <g font-family="var(--font-mono)" font-size="10.5" fill="var(--d-text)">
    <text x="46" y="104">tenant A · #1</text><text x="46" y="120">tenant B · #2</text><text x="46" y="136">tenant A · #3</text><text x="46" y="152">tenant C · #4</text>
  </g>

  <rect x="240" y="36" width="180" height="150" rx="8" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <text x="254" y="56" fill="var(--d-muted)" font-size="11">database</text>
  <g font-family="var(--font-mono)" font-size="10.5" fill="var(--d-text)">
    <rect x="254" y="66" width="152" height="30" rx="4" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/><text x="266" y="85">tenant_a.orders</text>
    <rect x="254" y="102" width="152" height="30" rx="4" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/><text x="266" y="121">tenant_b.orders</text>
    <rect x="254" y="138" width="152" height="30" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/><text x="266" y="157">tenant_c.orders</text>
  </g>

  <g font-family="var(--font-mono)" font-size="10.5" fill="var(--d-text)">
    <rect x="460" y="36" width="180" height="44" rx="8" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/><text x="474" y="62">db-tenant-a</text>
    <rect x="460" y="89" width="180" height="44" rx="8" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/><text x="474" y="115">db-tenant-b</text>
    <rect x="460" y="142" width="180" height="44" rx="8" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/><text x="474" y="168">db-tenant-c</text>
  </g>

  <g stroke="var(--d-line)" stroke-width="1.5" fill="none"><path d="M20 214 L636 214"/><path d="M628 208 L640 214 L628 220"/></g>
  <text x="20" y="238" fill="var(--d-muted)" font-size="11.5">cheaper per tenant · easier to operate</text>
  <text x="640" y="238" fill="var(--d-muted)" font-size="11.5" text-anchor="end">stronger isolation · per-tenant control</text>
