<svg viewBox="0 0 340 380" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <g stroke-width="1.5">
    <rect x="6" y="6" width="328" height="112" rx="8" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="6" y="126" width="328" height="102" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <rect x="6" y="236" width="328" height="96" rx="8" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
  </g>
  <g font-weight="700" letter-spacing=".04em" font-size="11.5">
    <text x="18" y="28" fill="var(--d-ok)">SHARED TABLES (POOL)</text>
    <text x="18" y="148" fill="var(--d-info)">SCHEMA PER TENANT</text>
    <text x="18" y="258" fill="var(--d-plum)">DATABASE PER TENANT</text>
  </g>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="18" y="50">orders</text>
    <text x="34" y="68">tenant_id=A · #1     tenant_id=B · #2</text>
    <text x="34" y="86">tenant_id=A · #3     tenant_id=C · #4</text>
    <text x="18" y="170">tenant_a.orders · tenant_b.orders</text>
    <text x="18" y="188">tenant_c.orders</text>
    <text x="18" y="280">db-tenant-a · db-tenant-b · db-tenant-c</text>
  </g>
  <g fill="var(--d-muted)" font-size="11">
    <text x="18" y="106">every query filters by tenant_id (or row-level security)</text>
    <text x="18" y="214">one database, isolated namespaces</text>
    <text x="18" y="318">separate backups, regions, upgrades per tenant</text>
  </g>
  <path d="M20 346 L320 346" stroke="var(--d-line)" stroke-width="2"/>
  <path d="M312 340 L326 346 L312 352 Z" fill="var(--d-line)"/>
  <text x="10" y="368" fill="var(--d-muted)" font-size="11">down: stronger isolation, per-tenant control — and higher cost</text>
</svg>
