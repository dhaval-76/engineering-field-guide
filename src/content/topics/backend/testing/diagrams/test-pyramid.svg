<svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <!-- pyramid -->
  <path d="M170 20 L220 92 L120 92 Z" fill="var(--d-bad-soft)" stroke="var(--d-bad)" stroke-width="1.5"/>
  <text x="170" y="70" text-anchor="middle" fill="var(--d-text)" font-weight="600">E2E</text>
  <text x="170" y="86" text-anchor="middle" fill="var(--d-muted)" font-size="10.5">a handful</text>
  <path d="M116 98 L224 98 L272 168 L68 168 Z" fill="var(--d-warn-soft)" stroke="var(--d-warn)" stroke-width="1.5"/>
  <text x="170" y="124" text-anchor="middle" fill="var(--d-text)" font-weight="600">Integration / slices</text>
  <text x="170" y="141" text-anchor="middle" fill="var(--d-muted)" font-size="10.5">real DB · HTTP layer · JSON</text>
  <text x="170" y="156" text-anchor="middle" fill="var(--d-muted)" font-size="10.5">transactions · some dozens</text>
  <path d="M64 174 L276 174 L326 246 L14 246 Z" fill="var(--d-ok-soft)" stroke="var(--d-ok)" stroke-width="1.5"/>
  <text x="170" y="204" text-anchor="middle" fill="var(--d-text)" font-weight="600">Unit</text>
  <text x="170" y="221" text-anchor="middle" fill="var(--d-muted)" font-size="10.5">logic · edge cases · error paths</text>
  <text x="170" y="236" text-anchor="middle" fill="var(--d-muted)" font-size="10.5">the most tests, milliseconds each</text>
  <!-- scale -->
  <g font-size="11">
    <text x="14" y="270" fill="var(--d-muted)">↑ up: more realistic, slower, harder to debug</text>
    <text x="14" y="288" fill="var(--d-muted)">↓ down: faster, precise, less realistic</text>
  </g>
</svg>
