title: An order, byte by byte
legend:
  accent: 'field number and type'
  info: 'length of the text'
  ok: 'the value'
frames:
  - caption: 'Four fields: `id`, `customer_id`, `status` and `total_cents`, numbered 1 to 4 in the `.proto` file. As compact JSON this order is 74 bytes. Watch how Protobuf gets it to 20.'
    panels:
      - kind: kv
        label: The message
        pairs: [[1 id, '"A-1001"'], [2 customer_id, '"C-77"'], [3 status, 'SHIPPED (2)'], [4 total_cents, 129900]]
  - caption: 'Field 1 is a string. The first byte packs the field number and wire type: `(1 << 3) | 2` = `0a`. The next byte is the length, then the UTF-8 text. **The name `id` is never sent**; both sides know it from the `.proto` file.'
    panels:
      - kind: array
        label: id
        items: [{ v: '0a', tone: accent }, { v: '06', tone: info }, { v: '41', tone: ok }, { v: '2d', tone: ok }, { v: '31', tone: ok }, { v: '30', tone: ok }, { v: '30', tone: ok }, { v: '31', tone: ok }]
  - caption: 'Field 2 works the same way, with `(2 << 3) | 2` = `12`, length 4, then "C-77".'
    panels:
      - kind: array
        label: customer_id
        items: [{ v: '12', tone: accent }, { v: '04', tone: info }, { v: '43', tone: ok }, { v: '2d', tone: ok }, { v: '37', tone: ok }, { v: '37', tone: ok }]
  - caption: 'An enum is sent as its number, so "SHIPPED" takes one byte. Wire type 0 is a varint and needs no length: `(3 << 3) | 0` = `18`, then `02`.'
    panels:
      - kind: array
        label: status
        items: [{ v: '18', tone: accent }, { v: '02', tone: ok }]
  - caption: '129900 needs three bytes as a varint. Each byte carries 7 bits, low bits first, and the top bit says "more follows". The four fields add up to 8 + 6 + 2 + 4 = **20 bytes**.'
    panels:
      - kind: array
        label: total_cents
        items: [{ v: '20', tone: accent }, { v: 'ec', tone: ok }, { v: 'f6', tone: ok }, { v: '07', tone: ok }]
