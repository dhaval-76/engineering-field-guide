# Latency percentiles per endpoint + tracing, so you can see WHERE the time goes
management:
  endpoints.web.exposure.include: health,metrics,prometheus
  metrics.distribution:
    percentiles-histogram:
      # p50/p95/p99 per uri, method and status in Prometheus/Grafana
      http.server.requests: true
  # Micrometer Tracing → OpenTelemetry/Zipkin: spans for HTTP, JDBC*, clients
  tracing.sampling.probability: 0.1

logging.level:
  org.hibernate.SQL: DEBUG                # local only: see every statement (spot N+1)
# * JDBC spans need datasource-micrometer / an OpenTelemetry agent; the OTel Java agent
# instruments
#   JDBC, HTTP clients, Kafka, Redis and more without code changes.
