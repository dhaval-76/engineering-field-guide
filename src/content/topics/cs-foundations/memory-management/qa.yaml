questions:
  - q: 'What is virtual memory, and how does paging work?'
    think: Each process's view, the translation, and what happens on a miss.
    answer: |
      Each process gets its own virtual address space, as if it had the machine to itself. Memory is split into fixed-size pages, usually 4 KB, and the CPU's memory management unit translates each virtual page to a physical frame using per-process page tables. Recent translations are cached in the TLB.

      Pages are assigned lazily: the first touch causes a minor page fault, and the kernel maps a frame. If the page's data is on disk (a memory-mapped file, or swapped out), it is a major fault that waits for I/O. This isolates processes, lets programs use more address space than RAM, and lets the kernel share pages such as libraries and fork's copy-on-write pages. The cost is translation overhead, and thrashing if the working set doesn't fit in RAM.
