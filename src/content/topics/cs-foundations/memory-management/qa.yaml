  - q: 'What is the difference between a variable on the heap and one created inside a function? If several threads run the same function, is it safe?'
    think: Whose stack, and what is shared?
    answer: |
      A local variable lives in the calling thread's stack frame and disappears when the function returns. Every thread has its own stack, so several threads running the same function each get their own copy of its locals, which is safe without locks.

      Objects are allocated on the heap, which all threads share, and live as long as something references them. A local variable holding a reference is private, but the object it points to is not: if another thread can reach that object, through a field, a static, a shared collection or a captured lambda, access needs synchronisation. Objects created inside the function and never shared are safe.
    askedAt:
