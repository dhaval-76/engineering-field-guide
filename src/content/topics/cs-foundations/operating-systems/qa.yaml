  - q: 'Why doesn''t the whole of Chrome crash when one tab crashes?'
    think: Processes or threads?
    answer: |
      Chrome runs each site in its own renderer process. Processes don't share memory, so a crash, or an exploited bug, in one tab's process can't corrupt another's; the browser process notices the child died and shows the "aw, snap" page for that tab only. With threads in one process, a bad pointer in one tab could bring everything down. The cost is memory, since each process carries its own copy of the renderer's data.
    askedAt:
      - company: Intuit
        year: 2026
        round: Technical
        source: https://leetcode.com/discuss/post/8502025/intuit-swe-intern-2026-oncampus-intervie-keaj/
  - q: 'How many threads should a service run on an 8-core machine?'
    think: Does the work compute or wait?
    answer: |
      It depends on what the threads do. For CPU-bound work, about 8: more threads can't run at once and only add context switches. For work that mostly waits on I/O, more threads keep the cores busy while others wait; a rough starting point is cores × (1 + wait time ÷ compute time), so threads that wait 90% of the time suggest about 80.

      Then measure: raise the pool until throughput stops rising or latency starts climbing, and remember the downstream limits (database connections, rate limits) that a bigger pool will hit first. With Java 21 virtual threads, blocking I/O no longer needs a big platform-thread pool at all; the limit moves to the resources you call.
    askedAt:
      - company: LinkedIn
        year: 2026
        round: Technical
        source: https://leetcode.com/discuss/post/7571938/interview-experience-linkedin-swe-apps-2-pguc/
  - q: 'What is a context switch, and why is it expensive?'
    think: What gets saved, and what gets lost?
    answer: |
      The kernel stops one thread, saves its registers and state, and loads another's; between processes it also switches the address space. The direct cost is microseconds. The indirect cost is bigger: the new thread finds the CPU caches and TLB full of the previous thread's data and runs slowly until they warm up again.

      Switches happen when a thread blocks (voluntary) or its time slice ends (involuntary). Many runnable threads per core means much of the CPU goes on switching, which is why CPU-bound pools are sized near the core count.
    askedAt:
      - company: NVIDIA
        year: 2026
        round: Technical
        source: https://leetcode.com/discuss/post/8510550/nvidia-interview-experience-senior-syste-vr87/
followUps:
  - q: What happens when you run a command in the shell?
    intuition: Two system calls, then a wait.
    approach: |
      The shell calls fork, creating a copy of itself whose memory is shared copy-on-write. The child sets up redirection, then calls exec, which replaces its program with the command while keeping its PID and open files. The shell waits for the child and collects its exit code. Unwaited children become zombies.
  - q: What is the difference between SIGTERM and SIGKILL?
    intuition: Which one can the process see?
    approach: |
      SIGTERM asks the process to stop and can be caught, so it can finish requests and clean up. SIGKILL can't be caught or ignored: the kernel ends the process at once. Kubernetes sends SIGTERM, waits the grace period, then SIGKILL. Exit code 143 means terminated by SIGTERM and 137 by SIGKILL.
practice:
  - task: Make a worker process shut down cleanly on SIGTERM, finishing jobs already running.
    hint: Register a handler, stop taking new work, wait for in-flight work with a deadline, then exit.
    solution: |
      In Java, a shutdown hook calls `pool.shutdown()` and `awaitTermination` with a deadline shorter than the orchestrator's grace period, then `shutdownNow()` if it runs out. In Node, `process.on('SIGTERM')` stops accepting work (and calls `server.close()`), waits for in-flight promises, then exits. In Python, `signal.signal(SIGTERM, …)` sets a flag, and the main thread shuts the pool down with `wait=True`. Test it by sending a real SIGTERM while jobs are running.
    solutionCode: graceful-shutdown
  - task: Inspect a running service's threads, memory, file descriptors and limits from a shell.
    hint: /proc/<pid>/status, /proc/<pid>/fd, /proc/<pid>/limits, ps.
    solution: |
      Count threads in `/proc/PID/task` or read `Threads:` in `/proc/PID/status`; compare RSS with virtual size and page faults through `ps -o rss,vsz,maj_flt,min_flt`; count descriptors in `/proc/PID/fd` against the `open files` limit; read voluntary and involuntary context switches from `/proc/PID/status`; and inside a container, check `/sys/fs/cgroup/memory.max`, `cpu.max` and `cpu.stat`.
    solutionCode: os-inspect
quiz:
  - q: What do threads of the same process share?
    options: [Nothing, Only the stack, The address space and open files, Only the PID]
    correct: 2
    why: Threads share their process's memory and resources; each has its own stack and registers.
  - q: Which signal can a process not catch?
    options: [SIGTERM, SIGINT, SIGHUP, SIGKILL]
    correct: 3
    why: SIGKILL is handled by the kernel and ends the process at once.
  - q: What does fork's copy-on-write mean?
    options: [Memory is copied immediately, Parent and child share pages until one of them writes, The child can't write memory, Files are copied]
    correct: 1
    why: Pages are copied only when written, so fork is fast even for large processes.
  - q: A container exits with code 137. What usually happened?
    options: [It finished normally, It was killed with SIGKILL, often by the OOM killer, It received SIGTERM, It failed to start]
    correct: 1
    why: 137 is 128 + 9, the SIGKILL signal number.
