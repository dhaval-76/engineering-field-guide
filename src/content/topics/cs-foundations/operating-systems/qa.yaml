questions:
  - q: 'What is the difference between a process and a thread? Why do we need both?'
    think: What does each own, what do they share, and what happens when one fails?
    answer: |
      A process has its own address space, open files, PID and environment. Threads live inside a process and share all of that; each thread has only its own stack, registers and thread-local storage.

      That gives the trade-off. Processes are isolated: a crash or memory corruption stays inside one, which is why Chrome runs tabs as separate processes. But they are heavier to create and talk to each other through pipes, sockets or shared memory. Threads are cheap and communicate through shared memory, but they need locks or atomics, and one bad thread can bring down the whole process. A typical service is one process with many threads, and services are isolated from each other as separate processes or containers.
    askedAt:
      - company: Microsoft
        year: 2026
        round: Technical
        source: https://leetcode.com/discuss/post/7636712/selected-microsoft-sde2l61-interview-exp-qekl/
