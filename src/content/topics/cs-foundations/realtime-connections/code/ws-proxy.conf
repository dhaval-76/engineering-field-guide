# nginx in front of a WebSocket and an SSE endpoint
location /ws/ {
    proxy_pass http://chat_backend;
    proxy_http_version 1.1;                  # Upgrade needs HTTP/1.1 (default since nginx 1.29.7)
    proxy_set_header Upgrade $http_upgrade;  # hop-by-hop headers are not forwarded
    proxy_set_header Connection "upgrade";   # unless you pass them explicitly
    proxy_read_timeout 3600s;                # default 60 s of silence closes the connection
}

location /events/ {
    proxy_pass http://events_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";          # keep the upstream connection open
    proxy_buffering off;                     # or the app sends X-Accel-Buffering: no
    proxy_read_timeout 3600s;                # still send a comment line every ~20 s
}
