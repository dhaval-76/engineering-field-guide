questions:
  - q: 'What is CORS, and why does the browser send an OPTIONS request before some calls?'
    think: Whose protection is it, and which requests count as simple?
    answer: |
      Browsers apply the same-origin policy: a script from one origin can't read responses from another. CORS lets a server opt in by naming origins it trusts, through `Access-Control-Allow-Origin` and related headers.

      Simple requests (GET, HEAD or POST with only safelisted headers and a form or plain-text content type) go straight through, and the browser checks the response header before letting the script read it. Anything else, such as a JSON body, an `Authorization` header or a PUT or DELETE, first sends an OPTIONS **preflight** describing the method and headers it wants to use. Only if the server allows them does the browser send the real request. The result can be cached with `Access-Control-Max-Age`.

      CORS protects browser users. It is not access control for an API: curl and other servers ignore it. With cookies, the server must name the exact origin and send `Access-Control-Allow-Credentials: true`.
