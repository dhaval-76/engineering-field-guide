  - q: 'What changed from HTTP/1.1 to HTTP/2 to HTTP/3, and when does each matter?'
    think: Requests per connection, and what a single lost packet does.
    answer: |
      HTTP/1.1 allows one outstanding request per connection, so browsers open about six per host and headers are repeated as text. HTTP/2 multiplexes many requests as streams on one TCP connection with compressed headers, which removes the connection limit and extra handshakes. But TCP delivers in order, so one lost packet stalls every stream.

      HTTP/3 runs over QUIC on UDP: streams are independent, so a loss only stalls its own stream; the transport and TLS handshakes are combined into one round trip; and connections survive a network change. It matters most for mobile and lossy networks. Inside a data centre, HTTP/2 is usually enough, and HTTP/1.1 is still fine for simple service calls with a connection pool.
  - q: 'How would you make a frequently read API response cheap to serve while keeping it correct?'
    think: Freshness, revalidation, and who may store it.
    answer: |
      Decide how stale it may be, then set `Cache-Control` accordingly: `public, max-age=60` lets a CDN serve it for a minute; add `stale-while-revalidate` to hide refresh latency. Add an `ETag` so clients and CDNs revalidate with `If-None-Match` and get a 304 with no body when nothing changed.

      For per-user data use `private` so shared caches never store it, and `no-store` for anything sensitive. Version static assets by content hash and give them a year with `immutable`. Finally, plan invalidation: short TTLs, or a CDN purge when the data changes.
  - q: 'What is the difference between 401 and 403, and between 502, 503 and 504?'
    think: Who is answering, and would retrying or logging in help?
    answer: |
      401 means the request isn't authenticated: send valid credentials and it may work. 403 means the server knows who you are and still refuses; logging in again won't help.

      502 Bad Gateway comes from a proxy that got an invalid response or a dropped connection from its backend, often a crash. 503 Service Unavailable means the service is temporarily unable to handle the request, such as overload or maintenance, ideally with `Retry-After`. 504 Gateway Timeout comes from a proxy whose backend didn't answer in time: look at slow queries and timeouts, and check that the proxy's timeout is longer than the backend's.
    askedAt:
