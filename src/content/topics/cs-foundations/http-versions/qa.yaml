followUps:
  - q: What is the difference between no-cache and no-store?
    intuition: One of them still caches.
    approach: |
      `no-cache` lets caches store the response but requires them to revalidate with the server before every reuse, which is cheap with an ETag and a 304. `no-store` forbids storing it anywhere. Use `no-store` for sensitive data such as account pages.
  - q: How do cookies' SameSite values protect against CSRF?
    intuition: When does the browser attach the cookie to a request started by another site?
    approach: |
      `Strict` never sends the cookie on cross-site requests. `Lax` sends it on top-level navigation such as following a link, but not on cross-site POSTs or embedded requests, which stops most CSRF. `None` always sends it and requires `Secure`. Some browsers default to Lax when the attribute is missing, but set it explicitly, and keep CSRF tokens for sensitive forms.
  - q: Why is 0-RTT in HTTP/3 and TLS 1.3 only safe for some requests?
    intuition: What stops an attacker from sending the same first packet again?
    approach: |
      0-RTT data is sent before the handshake completes, using keys from an earlier session, and TLS gives no protection against it being replayed on a new connection. A replayed payment or "delete" would run twice. So servers accept early data only for requests that are safe to repeat, such as GETs, or reject it.
practice:
  - task: Implement conditional GET on the server, returning 304 when the client's ETag still matches.
    hint: Hash the body to get a tag. Compare it with every tag in If-None-Match, ignoring a W/ prefix, and treat "*" as a match.
    solution: |
      Compute a strong ETag from the content, for example the first bytes of its SHA-256, in quotes. Always send `ETag` and a `Cache-Control`. If `If-None-Match` is present, split it on commas, strip `W/` (If-None-Match uses weak comparison), and answer 304 with no body when any tag equals the current one or the value is `*`. Otherwise answer 200 with the body.
    solutionCode: http-conditional
  - task: Write a function that predicts whether a browser will send a CORS preflight for a fetch.
    hint: Check the method, then each header name, the Content-Type value and the Range value.
    solution: |
      Methods other than GET, HEAD and POST need a preflight. So does any header outside Accept, Accept-Language, Content-Language, Content-Type and Range, a Content-Type whose media type isn't form-encoded, multipart or plain text, and a Range that isn't one `bytes=start-[end]` range. Otherwise the request is simple. Testing it against a real browser on 15 cases, including a suffix range like `bytes=-100`, gave identical results.
    solutionCode: cors-preflight
quiz:
  - q: 'What does `Cache-Control: no-cache` mean?'
    options: [Never store the response, Store it but revalidate before each reuse, Cache it for one hour, Only browsers may cache it]
    correct: 1
    why: no-cache allows storing but requires revalidation; no-store forbids storing.
  - q: Which fetch sends a CORS preflight?
    options: ['GET with Accept-Language', 'POST with Content-Type text/plain', 'POST with Content-Type application/json', 'HEAD with no headers']
    correct: 2
    why: application/json is not one of the three simple content types.
  - q: Why can one lost packet slow every request on an HTTP/2 connection?
    options: [HTTP/2 resends all streams, TCP delivers bytes in order, so later data waits for the gap, Header compression breaks, The server closes the connection]
    correct: 1
    why: All streams share one TCP byte stream, and TCP won't deliver past a gap.
  - q: A proxy returns 504. Where should you look first?
    options: [The client's credentials, The backend's response time, The DNS records, The cookie attributes]
    correct: 1
    why: 504 means the proxy gave up waiting for the backend.
