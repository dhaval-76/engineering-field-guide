  - q: 'Users far from your region report slow API calls, but server-side latency looks fine. What might be happening?'
    think: What isn't counted in server-side timing?
    answer: |
      Server metrics start when the request arrives. The user also pays DNS, the TCP and TLS handshakes, and every round trip, which can be 150 ms or more across continents. Likely causes: a new connection per request, chatty APIs that need many sequential calls, large uncompressed payloads, or TLS without session resumption.

      Fixes: reuse connections, use HTTP/2 or HTTP/3, end TLS near users with a CDN or edge, batch or aggregate calls (a backend for frontend), compress, cache, and deploy closer to users. Confirm it with client-side timings such as `curl -w` or real-user monitoring, not server logs.
  - q: 'You send a message to a friend on a chat app. Walk through what happens on the network.'
    think: Same layers as a URL, but the connection is already open and long-lived.
    answer: |
      The app usually holds a long-lived encrypted connection to the chat servers (a WebSocket or a custom protocol over TCP or QUIC), opened when it started. Sending a message writes a small frame on that connection: no DNS or handshake is needed. The server stores the message, then pushes it down the friend's open connection, or sends a push notification if they are offline. Acknowledgements flow back the same way, which is how the app shows "delivered". Explain NAT and keep-alive pings: without them, idle mappings expire and the connection dies silently.
    askedAt:
      - company: Walmart
        year: 2024
        round: Technical
        source: https://leetcode.com/discuss/post/5751077/walmart-sde-ii-bengaluru-september-2024-hx68m/
followUps:
  - q: L4 or L7 load balancing?
    intuition: What can the balancer see?
    approach: |
      L4 balances TCP or UDP connections by address and port. It is very fast and protocol-agnostic, but it decides once per connection and can't route by URL. L7 ends HTTP (and usually TLS), so it can route each request by path, host or header, retry, and add headers, at a higher CPU cost. Long-lived gRPC and WebSocket connections need L7 or client-side balancing to spread load.
  - q: Why can't a client open more than about 28,000 connections to one server port?
    intuition: What identifies a TCP connection?
    approach: |
      A connection is identified by source IP, source port, destination IP and destination port. With the destination fixed, only the source port varies, and Linux's default ephemeral range is 32768 to 60999, about 28,000 ports. Closed connections also hold their port in TIME_WAIT for a while. Fixes: reuse connections, widen the port range, or add source or destination addresses.
practice:
  - task: Break down where the time goes in a single HTTPS request, and show how to inspect each layer from the command line.
    hint: dig for DNS, curl -w for timings, openssl s_client for TLS, ss for connection states.
    solution: |
      `dig` shows the resolved addresses and remaining TTL. `curl -w` with `time_namelookup`, `time_connect`, `time_appconnect`, `time_starttransfer` and `time_total` splits DNS, TCP, TLS, server time and transfer. `curl --http2` or `--http3` checks protocol support. `openssl s_client` shows the certificate chain and expiry. `ss` counts established and TIME_WAIT connections, which reveals connection churn. Compare a first request with a second one on a reused connection.
    solutionCode: net-debugging
  - task: Send an HTTP request over a raw TCP socket and print the status line.
    hint: HTTP/1.1 is text. Send the request line, a Host header and a blank line.
    solution: |
      Open a socket to the host and port, write `GET /path HTTP/1.1`, `Host: …` and `Connection: close`, each ending in `\r\n`, then an empty line. Read until the first `\r\n` to get the status line. Without `Host`, HTTP/1.1 servers reply 400; without `Connection: close`, the server keeps the connection open and you must parse `Content-Length` to know when the response ends.
    solutionCode: net-raw-http
quiz:
  - q: How many round trips does a new HTTPS connection over TCP with TLS 1.3 need before the request can be sent?
    options: ['0', '1', '2', '4']
    correct: 2
    why: One for the TCP handshake and one for TLS 1.3. DNS adds more if the name isn't cached.
  - q: Roughly how much round-trip time does each 100 km of fibre add?
    options: ['0.01 ms', '1 ms', '10 ms', '100 ms']
    correct: 1
    why: Light in fibre covers about 200 km per millisecond, and a round trip crosses the distance twice.
  - q: A user's bandwidth doubles. What happens to the time for 20 small sequential API calls?
    options: [It halves, It barely changes, It doubles, It drops to zero]
    correct: 1
    why: Small calls are limited by round trips, which bandwidth doesn't shorten.
  - q: Which device lets many private addresses share one public IP address?
    options: [A DNS resolver, NAT, An L7 load balancer, A switch]
    correct: 1
    why: NAT rewrites addresses and ports on the way out and remembers the mapping.
