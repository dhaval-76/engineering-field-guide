questions:
  - q: 'What happens when you type a URL into the browser and press Enter?'
    think: Go layer by layer, count the round trips, and say where caching cuts them.
    answer: |
      The browser parses the URL and checks its caches; HSTS may force HTTPS, and a cached response or service worker can answer without the network. The host name is resolved through DNS: browser, OS and resolver caches, or root, TLD and authoritative servers, cached for the record's TTL.

      It opens a TCP connection to port 443 (one round trip) and runs the TLS 1.3 handshake (one more): keys are agreed, the certificate chain and host name are checked, and ALPN picks HTTP/2 or HTTP/1.1. Then it sends the HTTP request. A CDN or load balancer often ends TLS and forwards to an application server, which reads cookies, caches and databases and responds.

      The browser parses the HTML, finds CSS, scripts and images, fetches them over the same connection where possible, and renders. Mention the cost: about three round trips before the first byte on a new connection, one on a reused one, and HTTP/3 merging the transport and TLS handshakes.
    askedAt:
