  - q: 'Explain the TCP three-way handshake, then continue into the TLS handshake.'
    think: What does each side need to learn, and how many round trips does it all cost?
    answer: |
      The client sends SYN with a random starting sequence number. The server replies SYN-ACK with its own number and an acknowledgement of the client's. The client sends ACK. Three messages are the minimum for both sides to announce their number and confirm the other's. That costs one round trip, and the client may send data with the final ACK.

      TLS 1.3 then takes one more round trip: the ClientHello carries supported ciphers and a key share; the server answers with its key share, certificate, a signature proving it owns the certificate's key, and Finished. Both sides derive the same keys and the client checks the certificate chain and host name. So a new HTTPS request waits about two round trips before the request goes out, which is why connections are reused.
    askedAt:
      - company: Zscaler
        year: 2024
