questions:
  - q: 'What is the difference between TCP and UDP, and when would you use each?'
    think: Reliability and order versus timeliness. Then give real uses for each.
    answer: |
      TCP sets up a connection with a handshake and gives a reliable, ordered byte stream: lost data is resent, duplicates are dropped, and flow and congestion control stop it overwhelming the receiver or the network. The cost is a round trip to start, head-of-line blocking after a loss, and no message boundaries.

      UDP sends independent datagrams with no handshake, no retransmission and no ordering, and keeps message boundaries. It suits cases where late data is useless or the application handles reliability itself: voice and video calls, games, DNS lookups, metrics, and QUIC, which builds reliable streams on UDP for HTTP/3.

      Most APIs and databases use TCP. I would choose UDP only when timeliness matters more than completeness, or when I need a custom transport.
