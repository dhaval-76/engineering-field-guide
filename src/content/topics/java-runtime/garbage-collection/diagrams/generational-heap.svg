<svg viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <defs><marker id="gh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-info)"/></marker></defs>
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">YOUNG GENERATION — COLLECTED OFTEN</text>
  <rect x="10" y="24" width="320" height="104" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
  <rect x="22" y="36" width="160" height="80" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="34" y="58" fill="var(--d-text)" font-weight="600">Eden</text>
  <text x="34" y="76" fill="var(--d-muted)" font-size="11">every new object</text>
  <text x="34" y="92" fill="var(--d-muted)" font-size="11">starts here; most die</text>
  <text x="34" y="108" fill="var(--d-muted)" font-size="11">here, young</text>
  <rect x="192" y="36" width="60" height="80" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="222" y="80" text-anchor="middle" fill="var(--d-text)" font-weight="600">S0</text>
  <rect x="260" y="36" width="60" height="80" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="290" y="80" text-anchor="middle" fill="var(--d-text)" font-weight="600">S1</text>
  <path d="M170 128 C 170 150, 170 156, 170 172" fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#gh-a)"/>
  <text x="180" y="150" fill="var(--d-muted)" font-size="11">survived several</text><text x="180" y="164" fill="var(--d-muted)" font-size="11">minor GCs → promoted</text>
  <text x="10" y="192" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">OLD GENERATION — COLLECTED RARELY</text>
  <rect x="10" y="200" width="320" height="56" rx="8" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  <text x="22" y="222" fill="var(--d-text)" font-weight="600">Long-lived objects</text>
  <text x="22" y="242" fill="var(--d-muted)" font-size="11">caches · pools · singletons · large session data</text>
  <text x="10" y="282" fill="var(--d-text)" font-size="11.5">Minor GC: young only — short, frequent pauses.</text>
  <text x="10" y="300" fill="var(--d-text)" font-size="11.5">Old-generation work: rarer, larger (or concurrent).</text>
  <text x="10" y="320" fill="var(--d-muted)" font-size="11">G1 applies the same idea to many equal-sized regions.</text>
</svg>
