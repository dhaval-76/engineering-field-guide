<svg viewBox="0 0 340 380" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <defs><marker id="hm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-info)"/></marker></defs>
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">1. FROM KEY TO BUCKET</text>
  <g font-family="var(--font-mono)" font-size="11.5">
    <rect x="10" y="26" width="150" height="28" rx="5" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <text x="85" y="44" text-anchor="middle" fill="var(--d-text)">"apple".hashCode()</text>
    <rect x="180" y="26" width="150" height="28" rx="5" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
    <text x="255" y="44" text-anchor="middle" fill="var(--d-text)">-860654854</text>
    <rect x="10" y="78" width="150" height="28" rx="5" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
    <text x="85" y="96" text-anchor="middle" fill="var(--d-text)">h ^ (h &gt;&gt;&gt; 16)</text>
    <rect x="180" y="78" width="150" height="28" rx="5" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/>
    <text x="255" y="96" text-anchor="middle" fill="var(--d-text)">&amp; (16 − 1) → 3</text>
  </g>
  <g fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#hm-a)">
    <path d="M160 40 L178 40"/><path d="M255 54 C 255 66, 85 62, 85 76"/><path d="M160 92 L178 92"/>
  </g>
  <text x="10" y="124" fill="var(--d-muted)" font-size="11">spread the high bits, then keep the low bits as the index</text>
  <text x="10" y="156" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">2. BUCKET ARRAY (CAPACITY 16)</text>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <rect x="10" y="166" width="62" height="28" rx="4" fill="var(--d-bg)" stroke="var(--d-line)"/><text x="41" y="184" text-anchor="middle">[0] –</text>
    <rect x="76" y="166" width="62" height="28" rx="4" fill="var(--d-bg)" stroke="var(--d-line)"/><text x="107" y="184" text-anchor="middle">[1] –</text>
    <rect x="142" y="166" width="62" height="28" rx="4" fill="var(--d-bg)" stroke="var(--d-line)"/><text x="173" y="184" text-anchor="middle">[2] –</text>
    <rect x="208" y="166" width="62" height="28" rx="4" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/><text x="239" y="184" text-anchor="middle">[3] ●</text>
    <rect x="274" y="166" width="56" height="28" rx="4" fill="var(--d-bg)" stroke="var(--d-line)"/><text x="302" y="184" text-anchor="middle">… [15]</text>
  </g>
  <path d="M239 194 L239 222" fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#hm-a)"/>
  <rect x="120" y="224" width="210" height="58" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="132" y="242">Node key="apple" value=10</text>
    <text x="132" y="258">hash=-860654854</text>
    <text x="132" y="274">next → (next node or null)</text>
  </g>
  <text x="10" y="310" fill="var(--d-text)" font-size="11.5">get: same steps, then walk the bucket comparing</text>
  <text x="10" y="326" fill="var(--d-text)" font-size="11.5">hash first, equals() second.</text>
  <text x="10" y="352" fill="var(--d-muted)" font-size="11">Java 8+: a chain longer than 8 (table ≥ 64 buckets)</text>
  <text x="10" y="368" fill="var(--d-muted)" font-size="11">becomes a red-black tree → O(log n) worst case.</text>
</svg>
