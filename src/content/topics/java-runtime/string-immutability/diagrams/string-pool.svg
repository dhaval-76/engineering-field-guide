<svg viewBox="0 0 340 300" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <defs><marker id="sp-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-info)"/></marker></defs>
  <g font-family="var(--font-mono)" fill="var(--d-text)">
    <text x="10" y="20">String a = "hello";</text>
    <text x="10" y="40">String b = "hello";</text>
    <text x="10" y="60">String c = new String("hello");</text>
  </g>
  <text x="10" y="94" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">HEAP</text>
  <rect x="10" y="102" width="320" height="150" rx="8" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <rect x="22" y="114" width="180" height="70" rx="6" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-dasharray="4 3"/>
  <text x="32" y="132" fill="var(--d-info)" font-size="11" font-weight="600">string pool (interned)</text>
  <rect x="42" y="142" width="110" height="30" rx="5" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="97" y="162" text-anchor="middle" fill="var(--d-text)" font-family="var(--font-mono)">"hello"</text>
  <rect x="216" y="196" width="104" height="44" rx="5" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="268" y="215" text-anchor="middle" fill="var(--d-text)" font-family="var(--font-mono)">"hello"</text>
  <text x="268" y="231" text-anchor="middle" fill="var(--d-muted)" font-size="10.5">separate object</text>
  <g fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#sp-a)">
    <path d="M150 15 C 210 40, 140 110, 110 140"/>
    <path d="M150 36 C 190 60, 120 110, 92 140"/>
    <path d="M250 56 C 300 100, 290 160, 276 194"/>
  </g>
  <text x="10" y="272" fill="var(--d-ok)">a == b → true (same pooled object)</text>
  <text x="10" y="290" fill="var(--d-bad)">c == a → false · c.equals(a) → true</text>
</svg>
