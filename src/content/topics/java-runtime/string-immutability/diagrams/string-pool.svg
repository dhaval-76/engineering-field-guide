<svg viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="string-immutability-in-java-d1-sp-a" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="var(--d-info)"></path></marker></defs>
  <rect x="8" y="8" width="580" height="80" rx="10" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-width="1.5"></rect>
  <text x="298" y="28" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--d-info)" font-weight="600">String pool (in the heap since Java 7)</text>
  <rect x="220" y="38" width="160" height="34" rx="6" fill="var(--d-bg)" stroke="var(--d-info)" stroke-width="1.5"></rect>
  <text x="300" y="60" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--d-info)">"hello"</text>
  <text x="20" y="110" font-family="var(--font-mono)" font-size="10" fill="var(--d-text)">String a = "hello";</text>
  <path d="M120,115 L265,70" stroke="var(--d-ok)" stroke-width="1.5" marker-end="url(#string-immutability-in-java-d1-sp-a)"></path>
  <text x="20" y="135" font-family="var(--font-mono)" font-size="10" fill="var(--d-text)">String b = "hello";</text>
  <path d="M120,138 L278,72" stroke="var(--d-ok)" stroke-width="1.5" marker-end="url(#string-immutability-in-java-d1-sp-a)"></path>
  <text x="20" y="170" font-family="var(--font-sans)" font-size="10" fill="var(--d-ok)">a == b is TRUE — same pool object. Safe because String is immutable — no mutation risk from sharing.</text>
  <rect x="400" y="102" width="180" height="34" rx="6" fill="var(--d-warn-soft)" stroke="var(--d-warn)" stroke-width="1.5"></rect>
  <text x="490" y="123" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--d-warn)">new heap obj "hello"</text>
  <text x="400" y="155" font-family="var(--font-mono)" font-size="10" fill="var(--d-text)">String c = new String("hello");</text>
  <text x="400" y="172" font-family="var(--font-sans)" font-size="9" fill="var(--d-bad)">c == a is FALSE (diff object) · c.equals(a) is TRUE (same content)</text>
</svg>