<svg viewBox="0 0 340 470" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <defs><marker id="sh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-info)"/></marker></defs>
  <!-- stack -->
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">THREAD A'S STACK</text>
  <rect x="10" y="24" width="320" height="170" rx="8" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <rect x="22" y="36" width="296" height="78" rx="6" fill="var(--d-bg)" stroke="var(--d-line)"/>
  <text x="34" y="54" fill="var(--d-muted)" font-size="11">frame: placeOrder()   ← top</text>
  <text x="34" y="74" fill="var(--d-text)" font-family="var(--font-mono)">int qty = 3</text>
  <text x="34" y="92" fill="var(--d-text)" font-family="var(--font-mono)">Order o = ●</text>
  <text x="180" y="92" fill="var(--d-text)" font-family="var(--font-mono)">String sku = ●</text>
  <text x="34" y="108" fill="var(--d-muted)" font-size="10.5">primitives: the value itself · references: an address</text>
  <rect x="22" y="122" width="296" height="60" rx="6" fill="var(--d-bg)" stroke="var(--d-line)"/>
  <text x="34" y="140" fill="var(--d-muted)" font-size="11">frame: main()</text>
  <text x="34" y="162" fill="var(--d-text)" font-family="var(--font-mono)">long start = …</text>
  <text x="180" y="162" fill="var(--d-text)" font-family="var(--font-mono)">Cart cart = ●</text>
  <text x="170" y="212" text-anchor="middle" fill="var(--d-muted)" font-size="11">private to the thread · freed when methods return</text>
  <!-- heap -->
  <text x="10" y="246" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">HEAP (SHARED, MANAGED BY THE GC)</text>
  <rect x="10" y="254" width="320" height="184" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-dasharray="4 3"/>
  <rect x="24" y="300" width="140" height="62" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="34" y="318" fill="var(--d-text)" font-weight="600">Order</text>
  <text x="34" y="336" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">int quantity = 3</text>
  <text x="34" y="353" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">List items = ●</text>
  <rect x="182" y="300" width="136" height="34" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="192" y="321" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">"SKU-42" (String)</text>
  <rect x="24" y="386" width="140" height="36" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="34" y="408" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">ArrayList [ … ]</text>
  <rect x="182" y="386" width="136" height="36" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="192" y="408" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">Cart { … }</text>
  <!-- references -->
  <g fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#sh-a)">
    <path d="M128 88 C 120 200, 90 250, 90 298"/>
    <path d="M300 88 C 320 200, 270 250, 260 298"/>
    <path d="M300 158 C 336 260, 336 340, 280 384"/>
    <path d="M150 349 C 160 365, 120 372, 100 384"/>
  </g>
  <text x="170" y="456" text-anchor="middle" fill="var(--d-muted)" font-size="11">objects — and the primitive fields inside them — live here</text>
</svg>
