<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <defs><marker id="sh-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-info)"/></marker></defs>
  <text x="20" y="20" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">THREAD A STACK</text>
  <rect x="20" y="30" width="220" height="196" rx="8" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <rect x="32" y="42" width="196" height="84" rx="6" fill="var(--d-bg)" stroke="var(--d-line)"/>
  <text x="44" y="60" fill="var(--d-muted)" font-size="11">frame: placeOrder()</text>
  <text x="44" y="80" fill="var(--d-text)" font-family="var(--font-mono)">int qty = 3</text>
  <text x="44" y="98" fill="var(--d-text)" font-family="var(--font-mono)">Order o = ●</text>
  <text x="44" y="116" fill="var(--d-text)" font-family="var(--font-mono)">String sku = ●</text>
  <rect x="32" y="136" width="196" height="78" rx="6" fill="var(--d-bg)" stroke="var(--d-line)"/>
  <text x="44" y="154" fill="var(--d-muted)" font-size="11">frame: main()</text>
  <text x="44" y="174" fill="var(--d-text)" font-family="var(--font-mono)">long start = …</text>
  <text x="44" y="192" fill="var(--d-text)" font-family="var(--font-mono)">Cart cart = ●</text>
  <text x="130" y="246" text-anchor="middle" fill="var(--d-muted)" font-size="11">private to the thread; freed when methods return</text>

  <text x="300" y="20" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">HEAP (SHARED BY ALL THREADS, MANAGED BY GC)</text>
  <rect x="300" y="30" width="400" height="196" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-dasharray="4 3"/>
