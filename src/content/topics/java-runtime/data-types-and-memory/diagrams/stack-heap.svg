  <text x="342" y="110" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">List items = ●</text>
  <rect x="530" y="56" width="150" height="40" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="542" y="80" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">"SKU-42" (String)</text>
  <rect x="530" y="150" width="150" height="44" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="542" y="176" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">ArrayList [ … ]</text>
  <rect x="330" y="150" width="160" height="44" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="342" y="176" fill="var(--d-text)" font-family="var(--font-mono)" font-size="11">Cart { … }</text>
  <path d="M150 94 C 250 94, 280 80, 328 82" fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#sh-a)"/>
  <path d="M168 112 C 300 130, 470 30, 528 70" fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#sh-a)"/>
  <path d="M150 188 C 240 200, 280 176, 328 172" fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#sh-a)"/>
  <path d="M450 110 C 500 130, 510 160, 528 168" fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#sh-a)"/>
  <text x="500" y="246" text-anchor="middle" fill="var(--d-muted)" font-size="11">objects — including their primitive fields like quantity — live here</text>
