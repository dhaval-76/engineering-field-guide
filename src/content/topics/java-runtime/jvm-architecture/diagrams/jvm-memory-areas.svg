<svg viewBox="0 0 340 430" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">SHARED BY ALL THREADS</text>
  <rect x="10" y="24" width="320" height="178" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
  <text x="22" y="44" fill="var(--d-text)" font-weight="600">Heap — garbage-collected (-Xmx)</text>
  <rect x="22" y="54" width="296" height="54" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="34" y="72" fill="var(--d-text)" font-weight="600">Young generation</text>
  <text x="34" y="92" fill="var(--d-muted)" font-size="11">Eden + two survivor spaces · minor GCs</text>
  <rect x="22" y="116" width="296" height="40" rx="6" fill="var(--d-bg)" stroke="var(--d-stroke)"/>
  <text x="34" y="134" fill="var(--d-text)" font-weight="600">Old generation</text>
  <text x="34" y="149" fill="var(--d-muted)" font-size="11">long-lived objects · major / mixed GCs</text>
  <text x="22" y="176" fill="var(--d-muted)" font-size="11">also on the heap: the string pool and static fields</text>
  <text x="22" y="192" fill="var(--d-muted)" font-size="11">(held by each class's Class object)</text>
  <rect x="10" y="210" width="320" height="70" rx="8" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-dasharray="4 3"/>
  <text x="22" y="230" fill="var(--d-text)" font-weight="600">Metaspace — native memory, not heap</text>
  <text x="22" y="249" fill="var(--d-muted)" font-size="11">class metadata, method bytecode, runtime constant pools</text>
  <text x="22" y="266" fill="var(--d-muted)" font-size="11">the "method area" · next to it: the JIT code cache</text>
  <text x="10" y="306" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">ONE PER THREAD</text>
  <rect x="10" y="314" width="320" height="106" rx="8" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <rect x="22" y="326" width="140" height="82" rx="6" fill="var(--d-bg)" stroke="var(--d-line)"/>
  <text x="32" y="344" fill="var(--d-text)" font-weight="600">JVM stack</text>
  <text x="32" y="362" fill="var(--d-muted)" font-size="11">one frame per call:</text>
  <text x="32" y="378" fill="var(--d-muted)" font-size="11">locals, operands,</text>
  <text x="32" y="394" fill="var(--d-muted)" font-size="11">return address (-Xss)</text>
  <rect x="172" y="326" width="146" height="36" rx="6" fill="var(--d-bg)" stroke="var(--d-line)"/>
  <text x="182" y="348" fill="var(--d-text)" font-weight="600">PC register</text>
  <rect x="172" y="372" width="146" height="36" rx="6" fill="var(--d-bg)" stroke="var(--d-line)"/>
  <text x="182" y="394" fill="var(--d-text)" font-weight="600">Native method stack</text>
</svg>
