title: Three requests and one small date string
legend:
  warn: 'written to the cache (costs a bit extra)'
  ok: 'read from the cache (cheap)'
  bad: 'cache missed because the prefix changed'
  info: 'new text, normal price'
frames:
  - caption: 'The first request has nothing to reuse. The provider processes the whole prompt and **stores the state up to the breakpoint**. Those tokens cost a little more than normal.'
    panels:
      - kind: rows
        label: Request 1
        items: [{ v: 'Tools and instructions (10,000 tokens)', tone: warn }, { v: 'Question: "Can I return this?"', tone: info }]
  - caption: 'A second user arrives a minute later. Every byte up to the breakpoint matches, so those 10,000 tokens are **read from the cache** at about a tenth of the price, and the model starts sooner.'
    panels:
      - kind: rows
        label: Request 2
        items: [{ v: 'Tools and instructions (10,000 tokens)', tone: ok }, { v: 'Question: "Where is my order?"', tone: info }]
  - caption: 'Someone adds `Today is 3 March` to the **top** of the system prompt. On each new day that byte differs, and it comes first, so everything after it no longer matches.'
    panels:
      - kind: rows
        label: Request 3, the next day
        items: [{ v: 'Today is 4 March', tone: bad }, { v: 'Tools and instructions (10,000 tokens)', tone: bad }, { v: 'Question', tone: info }]
  - caption: 'Move the date **after the cached part**. The prefix is identical again and caching works every day. Same information, very different bill.'
    panels:
      - kind: rows
        label: Fixed layout
        items: [{ v: 'Tools and instructions (10,000 tokens)', tone: ok }, { v: 'Today is 4 March. Question', tone: info }]
