<line x1="30" y1="64" x2="215" y2="64" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="6" y="116" width="338" height="80" rx="6" fill="var(--d-fill)" stroke="var(--d-line)"/>
<text x="16" y="135" font-size="13" fill="var(--d-muted)">Layer 1: more nodes, shorter jumps</text>
