<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 322" font-family="var(--font-sans)" role="img" aria-label="Three stacked graph layers. Layer 2 has nodes A and F, layer 1 has A, C, F and H, and layer 0 has every node. A search takes a long jump from A to F on layer 2, drops to F on layer 1, moves to H, drops to H on layer 0, and then moves to J.">
<defs><marker id="hnsw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--d-accent)"/></marker></defs>
<rect x="6" y="12" width="338" height="80" rx="6" fill="var(--d-fill)" stroke="var(--d-line)"/>
