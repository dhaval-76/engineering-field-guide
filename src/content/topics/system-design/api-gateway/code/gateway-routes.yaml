# Spring Cloud Gateway (application.yml)
spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestSize
              args: { maxSize: 2MB }
            # forward the verified access token downstream
            - TokenRelay=
          routes:
            - id: orders
              # resolved via discovery / Kubernetes service
              uri: lb://orders
              predicates: [ "Path=/api/v1/orders/**" ]
              filters:
                # /api/v1/orders/42 → /orders/42
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50   # tokens per second per key
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@apiKeyResolver}"
                - name: CircuitBreaker
                  args: { name: orders, fallbackUri: "forward:/fallback/orders" }
                - name: Retry                              # only safe methods
                  args: { retries: 2, methods: GET, statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE }
              metadata: { response-timeout: 2000 }
            # 5% of traffic to the new version
            - id: catalogue-canary
              uri: lb://catalogue-v2
              predicates: [ "Path=/api/v1/products/**", "Weight=catalogue, 5" ]
            - id: catalogue
              uri: lb://catalogue
              predicates: [ "Path=/api/v1/products/**", "Weight=catalogue, 95" ]
  security:
    oauth2:
      resourceserver:
        jwt:
          # keys fetched from its JWKS and cached
          issuer-uri: https://login.example.com/
