<svg viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <rect x="20" y="40" width="24" height="44" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <rect x="44" y="40" width="400" height="44" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
  <rect x="444" y="40" width="98" height="44" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
  <rect x="542" y="40" width="118" height="44" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
  <g fill="var(--d-text)" text-anchor="middle" font-weight="600">
    <text x="32" y="67">0</text>
    <text x="244" y="67">timestamp — 41 bits</text>
    <text x="493" y="67">worker — 10</text>
    <text x="601" y="67">sequence — 12</text>
  </g>
  <g fill="var(--d-muted)" text-anchor="middle" font-size="11">
    <text x="32" y="30">sign</text>
    <text x="244" y="30">milliseconds since a custom epoch</text>
    <text x="493" y="30">which generator</text>
    <text x="601" y="30">count within the ms</text>
    <text x="244" y="104">≈ 69 years of range</text>
    <text x="493" y="104">1,024 workers</text>
    <text x="601" y="104">4,096 ids / ms</text>
  </g>
  <text x="20" y="146" fill="var(--d-muted)" font-family="var(--font-mono)" font-size="11.5">id = (now − epoch) &lt;&lt; 22  |  worker &lt;&lt; 12  |  sequence</text>
</svg>
