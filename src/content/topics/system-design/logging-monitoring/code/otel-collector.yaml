# OpenTelemetry Collector (gateway tier)
receivers:
  otlp:
    protocols: { grpc: {}, http: {} }

processors:
  memory_limiter: { check_interval: 1s, limit_percentage: 80 }   # shed load instead of crashing
  batch: {}
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: user.email, action: hash }
  tail_sampling:                       # decide per trace after it completes
    decision_wait: 10s
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow,   type: latency,     latency: { threshold_ms: 500 } }
      - { name: sample, type: probabilistic, probabilistic: { sampling_percentage: 5 } }

exporters:
  kafka/logs:   { brokers: ["kafka:9092"], topic: otel-logs, encoding: otlp_proto }
  otlp/traces:  { endpoint: tempo:4317, tls: { insecure: true } }
  prometheusremotewrite: { endpoint: http://mimir/api/v1/push }

service:
  pipelines:
    logs:    { receivers: [otlp], processors: [memory_limiter, attributes/redact, batch], exporters: [kafka/logs] }
    traces:  { receivers: [otlp], processors: [memory_limiter, attributes/redact, tail_sampling, batch], exporters: [otlp/traces] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheusremotewrite] }
