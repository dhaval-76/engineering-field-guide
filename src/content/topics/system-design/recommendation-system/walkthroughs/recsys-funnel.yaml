title: From ten million items to twenty on screen
frames:
  - caption: 'Asha opens the app. The catalogue has 10 million items; scoring all of them with a heavy model would take seconds. Recommendation is a **funnel**: cheap stages narrow the field, expensive stages order it.'
    panels:
      - kind: kv
        label: budget
        pairs: [[catalogue, '10,000,000 items'], [latency target, '< 200 ms']]
  - caption: '**Candidate generation** (≈ 1,000 items) merges several cheap sources: item-item neighbours of what she bought recently, nearest neighbours of her embedding in a vector index, trending in her city, new items from brands she follows.'
    panels:
      - kind: kv
        label: candidates
        pairs: [['similar to recent purchases (CF)', '400'], ['embedding ANN', '400'], [trending nearby, '150'], [followed brands, '50']]
  - caption: '**Ranking** scores each candidate with a learned model using features from the feature store — her recent clicks, price affinity, item popularity, time of day — predicting the chance she clicks or buys.'
    panels:
      - kind: kv
        label: top scores
        pairs: [['trail shoes', '0.31'], ['camping stove', '0.27'], ['rain jacket', '0.22']]
  - caption: '**Re-ranking** applies rules the model doesn''t: remove items she already bought, cap one brand to three slots, mix in a few new items (exploration), respect stock and sponsored placements.'
    panels:
      - kind: rows
        label: adjustments
        items: ['− already purchased', 'diversity: max 3 per brand', { v: '+2 exploration slots', tone: info }]
  - caption: 'Twenty items are shown and **every impression is logged** with what was clicked or ignored. Those logs train tomorrow''s models — including the negatives, which are as important as the clicks.'
    panels:
      - kind: rows
        label: logged
        items: ['20 impressions', { v: '2 clicks, 1 add-to-cart', tone: ok }, '17 shown-not-clicked (negatives)']
