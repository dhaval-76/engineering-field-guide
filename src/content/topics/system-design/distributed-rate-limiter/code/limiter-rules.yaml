# Rules: the most specific match wins. Loaded from config (or a rules service) and cached
# in each gateway.
rules:
  - match: { plan: free }
    limit: 60
    window: 1m
  - match: { plan: pro }
    limit: 1000
    window: 1m
  # expensive endpoint: its own budget
  - match: { plan: pro, route: "POST /api/exports" }
    limit: 10
    window: 1h
  - match: { anonymous: true }
    key: ip
    limit: 30
    window: 1m
failure_mode: open          # or closed for protected partner quotas
