<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" role="img" aria-label="A two-minute overview at the top branches into six angles: architecture, request flow, data, security, operations and a hard problem." style="font-family:var(--font-sans)">
<rect x="90" y="6" width="160" height="34" rx="6" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-width="1.5"/>
<text x="170" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-text)">Two-minute overview</text>
<line x1="170" y1="40" x2="170" y2="56" stroke="var(--d-line)" stroke-width="1.5"/>
<line x1="86" y1="56" x2="254" y2="56" stroke="var(--d-line)" stroke-width="1.5"/>
<line x1="88" y1="56" x2="88" y2="70" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="8" y="70" width="160" height="46" rx="6" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-width="1.5"/>
<text x="88" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-text)">Architecture</text>
<text x="88" y="107" text-anchor="middle" font-size="11" fill="var(--d-muted)">why each component</text>
<line x1="260" y1="56" x2="260" y2="70" stroke="var(--d-line)" stroke-width="1.5"/>
<rect x="180" y="70" width="160" height="46" rx="6" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-width="1.5"/>
<text x="260" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-text)">Request flow</text>
<text x="260" y="107" text-anchor="middle" font-size="11" fill="var(--d-muted)">one request, numbers</text>
<rect x="8" y="130" width="160" height="46" rx="6" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-width="1.5"/>
<text x="88" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-text)">Data</text>
<text x="88" y="167" text-anchor="middle" font-size="11" fill="var(--d-muted)">tables · indexes · size</text>
<rect x="180" y="130" width="160" height="46" rx="6" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-width="1.5"/>
<text x="260" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-text)">Security</text>
<text x="260" y="167" text-anchor="middle" font-size="11" fill="var(--d-muted)">auth · tenants · secrets</text>
<rect x="8" y="190" width="160" height="46" rx="6" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-width="1.5"/>
<text x="88" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-text)">Operations</text>
<text x="88" y="227" text-anchor="middle" font-size="11" fill="var(--d-muted)">deploys · monitoring</text>
<rect x="180" y="190" width="160" height="46" rx="6" fill="var(--d-accent-soft)" stroke="var(--d-accent)" stroke-width="1.5"/>
<text x="260" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="var(--d-text)">A hard problem</text>
<text x="260" y="227" text-anchor="middle" font-size="11" fill="var(--d-muted)">the story you lead</text>
