<line x1="88" y1="176" x2="88" y2="190" stroke="var(--d-line)" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="260" y1="116" x2="260" y2="130" stroke="var(--d-line)" stroke-width="1.5" stroke-dasharray="3 3"/>
