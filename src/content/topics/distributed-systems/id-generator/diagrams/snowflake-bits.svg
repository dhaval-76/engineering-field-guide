<svg viewBox="0 0 340 250" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">A 64-BIT SNOWFLAKE ID</text>
  <!-- widths proportional: 1 + 41 + 10 + 12 bits over 320 px = 5 px per bit -->
  <g stroke-width="1.5">
    <rect x="10" y="26" width="5" height="40" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
    <rect x="15" y="26" width="205" height="40" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <rect x="220" y="26" width="50" height="40" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
    <rect x="270" y="26" width="60" height="40" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
  </g>
  <g fill="var(--d-text)" font-weight="600" text-anchor="middle" font-size="11.5">
    <text x="117" y="50">timestamp · 41 bits</text><text x="245" y="44">worker</text><text x="245" y="58">10</text>
    <text x="300" y="44">seq</text><text x="300" y="58">12</text>
  </g>
  <text x="10" y="84" fill="var(--d-muted)" font-size="10.5">↑ sign bit (0)</text>
  <g font-size="11.5">
    <rect x="10" y="98" width="10" height="10" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <text x="28" y="107" fill="var(--d-text)">ms since a custom epoch — about 69 years</text>
    <rect x="10" y="118" width="10" height="10" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/>
    <text x="28" y="127" fill="var(--d-text)">which generator — up to 1,024 workers</text>
    <rect x="10" y="138" width="10" height="10" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <text x="28" y="147" fill="var(--d-text)">counter within the ms — 4,096 ids per ms</text>
  </g>
  <rect x="10" y="166" width="320" height="50" rx="6" fill="var(--d-fill)" stroke="var(--d-stroke)"/>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <text x="20" y="186">id = (now − epoch) &lt;&lt; 22</text>
    <text x="44" y="204">| worker &lt;&lt; 12 | sequence</text>
  </g>
  <text x="10" y="238" fill="var(--d-muted)" font-size="11">Sorted by time, unique without coordination.</text>
</svg>
