<svg viewBox="0 0 340 380" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <rect x="6" y="6" width="328" height="170" rx="8" fill="var(--d-info-soft)" stroke="var(--d-info)" stroke-width="1.5"/>
  <text x="18" y="28" fill="var(--d-info)" font-weight="700" letter-spacing=".04em" font-size="11.5">QUEUE — one worker per message</text>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <rect x="18" y="40" width="34" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="35" y="57" text-anchor="middle">m5</text>
    <rect x="56" y="40" width="34" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="73" y="57" text-anchor="middle">m4</text>
    <rect x="94" y="40" width="34" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="111" y="57" text-anchor="middle">m3</text>
    <text x="150" y="58">worker 1 ← m1</text>
    <text x="150" y="78">worker 2 ← m2</text>
    <text x="150" y="98" fill="var(--d-muted)">worker 3 (idle)</text>
  </g>
  <g fill="var(--d-muted)" font-size="11">
    <text x="18" y="128">acknowledged messages are deleted</text>
    <text x="18" y="146">work is spread across competing workers;</text>
    <text x="18" y="162">order holds only with a single worker</text>
  </g>
  <rect x="6" y="186" width="328" height="188" rx="8" fill="var(--d-ok-soft)" stroke="var(--d-ok)" stroke-width="1.5"/>
  <text x="18" y="208" fill="var(--d-ok)" font-weight="700" letter-spacing=".04em" font-size="11.5">LOG — kept; each group has an offset</text>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)">
    <rect x="18" y="220" width="40" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="38" y="237" text-anchor="middle">0</text>
    <rect x="62" y="220" width="40" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="82" y="237" text-anchor="middle">1</text>
    <rect x="106" y="220" width="40" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="126" y="237" text-anchor="middle">2</text>
    <rect x="150" y="220" width="40" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="170" y="237" text-anchor="middle">3</text>
    <rect x="194" y="220" width="40" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="214" y="237" text-anchor="middle">4</text>
    <rect x="238" y="220" width="40" height="26" rx="4" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="258" y="237" text-anchor="middle">5</text>
    <text x="284" y="237" fill="var(--d-muted)">← new</text>
  </g>
  <g fill="var(--d-text)" font-size="11.5">
    <text x="82" y="268" text-anchor="middle">▲</text><text x="82" y="282" text-anchor="middle" font-size="10.5">analytics</text>
    <text x="214" y="268" text-anchor="middle">▲</text><text x="214" y="282" text-anchor="middle" font-size="10.5">email</text>
    <text x="258" y="268" text-anchor="middle">▲</text><text x="258" y="296" text-anchor="middle" font-size="10.5">inventory</text>
  </g>
  <g fill="var(--d-muted)" font-size="11">
    <text x="18" y="324">a new group can start from offset 0 (replay);</text>
    <text x="18" y="342">retention removes data, not reading it;</text>
    <text x="18" y="360">order holds within each partition</text>
  </g>
</svg>
