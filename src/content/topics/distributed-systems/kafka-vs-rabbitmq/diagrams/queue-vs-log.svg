<svg viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <text x="20" y="22" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em" font-size="11">QUEUE — each message to one worker, deleted on ack</text>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)" text-anchor="middle">
    <rect x="20" y="40" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="42" y="59">m5</text>
    <rect x="68" y="40" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="90" y="59">m4</text>
    <rect x="116" y="40" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="138" y="59">m3</text>
  </g>
  <g stroke="var(--d-line)" stroke-width="1.4" fill="none">
    <path d="M160 55 C200 55 210 40 250 40"/><path d="M160 55 C200 55 210 70 250 70"/><path d="M160 55 L250 100"/>
  </g>
  <g font-size="11.5">
    <rect x="252" y="28" width="120" height="24" rx="4" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="262" y="44" fill="var(--d-text)">worker 1 ← m1</text>
    <rect x="252" y="58" width="120" height="24" rx="4" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="262" y="74" fill="var(--d-text)">worker 2 ← m2</text>
    <rect x="252" y="88" width="120" height="24" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="262" y="104" fill="var(--d-muted)">worker 3 (idle)</text>
  </g>
  <text x="392" y="60" fill="var(--d-muted)" font-size="11.5">m1, m2 acknowledged → removed</text>
  <text x="392" y="78" fill="var(--d-muted)" font-size="11.5">ordering holds only with one worker</text>

  <line x1="20" y1="134" x2="660" y2="134" stroke="var(--d-line)" stroke-dasharray="3 4"/>

  <text x="20" y="158" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em" font-size="11">LOG — messages kept; each consumer group has its own offset</text>
  <g font-family="var(--font-mono)" font-size="11" fill="var(--d-text)" text-anchor="middle">
    <rect x="20" y="172" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="42" y="191">0</text>
    <rect x="68" y="172" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="90" y="191">1</text>
    <rect x="116" y="172" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="138" y="191">2</text>
    <rect x="164" y="172" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="186" y="191">3</text>
    <rect x="212" y="172" width="44" height="30" rx="4" fill="var(--d-fill)" stroke="var(--d-stroke)"/><text x="234" y="191">4</text>
    <rect x="260" y="172" width="44" height="30" rx="4" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/><text x="282" y="191">5</text>
  </g>
  <text x="314" y="191" fill="var(--d-muted)" font-size="11.5">← producers append</text>
  <g font-size="11.5">
    <path d="M90 226 L90 206" stroke="var(--d-plum)" stroke-width="1.5"/><text x="60" y="242" fill="var(--d-plum)">analytics @1</text>
    <path d="M234 226 L234 206" stroke="var(--d-ok)" stroke-width="1.5"/><text x="200" y="242" fill="var(--d-ok)">email @4</text>
    <path d="M282 226 L282 206" stroke="var(--d-info)" stroke-width="1.5"/><text x="262" y="262" fill="var(--d-info)">inventory @5</text>
  </g>
  <text x="440" y="220" fill="var(--d-muted)" font-size="11.5">a new group can start at offset 0</text>
  <text x="440" y="238" fill="var(--d-muted)" font-size="11.5">retention, not reading, removes data</text>
</svg>
