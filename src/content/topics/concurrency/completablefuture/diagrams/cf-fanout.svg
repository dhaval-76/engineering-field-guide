<svg viewBox="0 0 340 236" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <!-- time axis: 0–900 ms over 300 px (1 px = 3 ms) -->
  <g stroke="var(--d-line)" stroke-dasharray="2 3" opacity="0.6">
    <line x1="30" y1="20" x2="30" y2="206"/><line x1="130" y1="20" x2="130" y2="206"/>
    <line x1="230" y1="20" x2="230" y2="206"/><line x1="330" y1="20" x2="330" y2="206"/>
  </g>
  <g fill="var(--d-muted)" font-size="11" text-anchor="middle">
    <text x="30" y="222">0</text><text x="130" y="222">300 ms</text>
    <text x="230" y="222">600 ms</text><text x="322" y="222">900</text>
  </g>
  <text x="30" y="14" fill="var(--d-text)" font-weight="600">One after another ≈ 900 ms</text>
  <g stroke-width="1.5">
    <rect x="30" y="22" width="100" height="22" rx="4" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
    <rect x="130" y="48" width="100" height="22" rx="4" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
    <rect x="230" y="74" width="100" height="22" rx="4" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  </g>
  <g fill="var(--d-text)" text-anchor="middle">
    <text x="80" y="37">product</text><text x="180" y="63">inventory</text><text x="280" y="89">price</text>
  </g>
  <text x="30" y="122" fill="var(--d-text)" font-weight="600">In parallel ≈ 300 ms</text>
  <g stroke-width="1.5">
    <rect x="30" y="130" width="100" height="22" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="30" y="156" width="100" height="22" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="30" y="182" width="100" height="22" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="132" y="156" width="8" height="22" rx="2" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/>
  </g>
  <g fill="var(--d-text)" text-anchor="middle">
    <text x="80" y="145">product</text><text x="80" y="171">inventory</text><text x="80" y="197">price</text>
  </g>
  <text x="146" y="171" fill="var(--d-accent)" font-size="11">combine</text>
</svg>
