title: A database password that exists for one hour
legend:
  accent: 'acted on in this step'
  ok: 'valid'
  muted: 'expired and deleted'
frames:
  - caption: 'The orders service starts in a pod. It has no password. It presents its **Kubernetes service account token** to the secret manager, which checks it with the cluster: this really is the orders service.'
    panels:
      - kind: flow
        label: Startup
        items: [{ v: 'orders pod → secret manager: service account token', tone: accent }, 'secret manager → cluster: is this token valid?', 'cluster: yes, orders/orders-sa']
  - caption: 'The policy says the orders service may get read-write access to the orders database. The secret manager **creates a new database user** for this request, with a one-hour lease.'
    panels:
      - kind: kv
        label: Issued
        pairs: [[user, { v: 'v-orders-7f3a', tone: ok }], [password, '(random, shown once)'], [lease, '1 hour, renewable'], [grants, 'orders database only']]
  - caption: 'The service connects with it and renews the lease while it runs. Every query in the database''s audit log is tied to this one pod''s user.'
    panels:
      - kind: kv
        label: In use
        pairs: [[user, { v: 'v-orders-7f3a', tone: ok }], [lease renewed, 'every 30 minutes']]
  - caption: 'The pod is replaced in a deploy and stops renewing. When the lease ends, the secret manager **drops the database user**. A copy of that password found later, in a log or a dump, opens nothing.'
    panels:
      - kind: kv
        label: After the lease
        pairs: [[user, { v: 'v-orders-7f3a: dropped', tone: muted }], [new pod, { v: 'v-orders-91c2: issued', tone: ok }]]
