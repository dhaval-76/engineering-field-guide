title: Token bucket — capacity 4, refill 1 token per second
legend:
  ok: 'token available / allowed'
  muted: 'token used'
  bad: 'rejected'
frames:
  - caption: The bucket starts **full** with 4 tokens. Each request takes one token; refills add one per second up to the capacity.
    panels:
      - kind: array
        label: Tokens
        items: [{ v: ●, tone: ok }, { v: ●, tone: ok }, { v: ●, tone: ok }, { v: ●, tone: ok }]
      - kind: note
        text: t = 0.0 s
  - caption: A burst of **3 requests** arrives at once. All are allowed — bursts up to the capacity are fine.
    panels:
      - kind: array
        label: Tokens
        items: [{ v: ●, tone: ok }, { v: ○, tone: muted }, { v: ○, tone: muted }, { v: ○, tone: muted }]
      - kind: rows
        label: Requests
        items: [{ v: '✓', tone: ok }, { v: '✓', tone: ok }, { v: '✓', tone: ok }]
  - caption: Two more requests 0.2 s later. One token left → the first passes, the second is **rejected (429)**.
    panels:
      - kind: array
        label: Tokens
        items: [{ v: ○, tone: muted }, { v: ○, tone: muted }, { v: ○, tone: muted }, { v: ○, tone: muted }]
      - kind: rows
        label: Requests
        items: [{ v: '✓', tone: ok }, { v: '✗ 429', tone: bad }]
  - caption: At t = 1.2 s, about one token has refilled. Refill is computed **lazily** on the next request from the elapsed time — no timer thread needed.
    panels:
      - kind: array
        label: Tokens
        items: [{ v: ●, tone: ok }, { v: ○, tone: muted }, { v: ○, tone: muted }, { v: ○, tone: muted }]
      - kind: note
        text: 'tokens = min(capacity, tokens + elapsed × rate) = min(4, 0 + 1.0 × 1) = 1'
  - caption: Over a long period, throughput settles at the **refill rate** (1/s) no matter how hard the client pushes; the capacity only controls how big a burst can be.
    panels:
      - kind: note
        text: 'Two knobs: capacity (burst size) and rate (sustained throughput). Fixed windows have one knob and a boundary problem; the token bucket separates the two concerns.'
