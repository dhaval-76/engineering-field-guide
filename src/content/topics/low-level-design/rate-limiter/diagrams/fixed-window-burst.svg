<svg viewBox="0 0 720 190" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <text x="20" y="18" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">FIXED WINDOW, LIMIT 100 PER MINUTE</text>
  <line x1="40" y1="130" x2="700" y2="130" stroke="var(--d-stroke)" stroke-width="1.4"/>
  <g fill="var(--d-muted)" font-size="11" text-anchor="middle">
    <text x="40" y="150">12:00:00</text><text x="370" y="150">12:01:00</text><text x="700" y="150">12:02:00</text>
  </g>
  <line x1="370" y1="40" x2="370" y2="134" stroke="var(--d-line)" stroke-dasharray="4 3"/>
  <rect x="40" y="40" width="330" height="20" fill="var(--d-fill)" stroke="var(--d-line)"/>
  <text x="205" y="54" text-anchor="middle" fill="var(--d-muted)">window 1 — counter resets at 12:01:00</text>
  <rect x="370" y="40" width="330" height="20" fill="var(--d-fill)" stroke="var(--d-line)"/>
  <text x="535" y="54" text-anchor="middle" fill="var(--d-muted)">window 2</text>
  <!-- bursts -->
  <rect x="340" y="76" width="28" height="54" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  <text x="354" y="72" text-anchor="middle" fill="var(--d-warn)" font-weight="600">100</text>
  <rect x="372" y="76" width="28" height="54" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/>
  <text x="386" y="72" text-anchor="middle" fill="var(--d-warn)" font-weight="600">100</text>
  <path d="M336 96 C 300 96, 270 100, 250 104" fill="none" stroke="var(--d-bad)" stroke-width="1.2"/>
  <text x="246" y="100" text-anchor="end" fill="var(--d-bad)" font-weight="600">200 requests in 2 s —</text>
  <text x="246" y="115" text-anchor="end" fill="var(--d-bad)">double the limit, all allowed</text>
  <text x="20" y="176" fill="var(--d-text)">Each window's counter only sees its own requests. Sliding-window counters and token buckets don't have this blind spot.</text>
</svg>
