<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <text x="20" y="18" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">EXISTING BOOKING 10:00–11:00 VS A NEW REQUEST</text>
  <g fill="var(--d-muted)" font-size="11" text-anchor="middle">
    <text x="160" y="40">9:00</text><text x="300" y="40">10:00</text><text x="440" y="40">11:00</text><text x="580" y="40">12:00</text>
  </g>
  <g stroke="var(--d-line)" stroke-dasharray="3 4"><line x1="300" y1="46" x2="300" y2="214"/><line x1="440" y1="46" x2="440" y2="214"/></g>
  <rect x="300" y="52" width="140" height="22" rx="4" fill="var(--d-accent-soft)" stroke="var(--d-accent)"/>
  <text x="370" y="67" text-anchor="middle" fill="var(--d-text)" font-weight="600">existing</text>

  <rect x="230" y="88" width="140" height="18" rx="4" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/><text x="600" y="101" fill="var(--d-bad)">9:30–10:30 · overlaps</text>
  <rect x="330" y="114" width="70" height="18" rx="4" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/><text x="600" y="127" fill="var(--d-bad)">10:15–10:45 · inside</text>
  <rect x="260" y="140" width="220" height="18" rx="4" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/><text x="600" y="153" fill="var(--d-bad)">9:45–11:15 · covers</text>
  <rect x="160" y="166" width="140" height="18" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/><text x="600" y="179" fill="var(--d-ok)">9:00–10:00 · touches, OK</text>
  <rect x="440" y="192" width="140" height="18" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/><text x="600" y="205" fill="var(--d-ok)" text-anchor="start">11:00–12:00 · touches, OK</text>
  <text x="20" y="226" fill="var(--d-text)">Overlap ⇔ newStart &lt; existingEnd AND existingStart &lt; newEnd — one condition covers every red case.</text>
</svg>
