<svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="11.5">
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em" font-size="12">EXISTING 10:00–11:00 VS NEW REQUESTS</text>
  <!-- scale: 9:00 at x=30, 12:00 at x=330 → 100 px per hour -->
  <g stroke="var(--d-line)" stroke-dasharray="2 3"><line x1="30" y1="28" x2="30" y2="206"/><line x1="130" y1="28" x2="130" y2="206"/><line x1="230" y1="28" x2="230" y2="206"/><line x1="330" y1="28" x2="330" y2="206"/></g>
  <g fill="var(--d-muted)" text-anchor="middle" font-size="11"><text x="30" y="222">9:00</text><text x="130" y="222">10:00</text><text x="230" y="222">11:00</text><text x="320" y="222">12:00</text></g>
  <rect x="130" y="34" width="100" height="22" rx="4" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
  <text x="180" y="49" text-anchor="middle" fill="var(--d-text)">existing</text>
  <g stroke-width="1.4">
    <rect x="80" y="64" width="100" height="22" rx="4" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/>
    <rect x="155" y="92" width="50" height="22" rx="4" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/>
    <rect x="105" y="120" width="150" height="22" rx="4" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/>
    <rect x="30" y="148" width="100" height="22" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <rect x="230" y="176" width="100" height="22" rx="4" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
  </g>
  <g fill="var(--d-text)">
    <text x="186" y="79">overlaps</text><text x="211" y="107">inside</text><text x="261" y="135">covers</text>
    <text x="136" y="163">touches — OK</text><text x="224" y="191" text-anchor="end">touches — OK</text>
  </g>
  <text x="10" y="244" fill="var(--d-text)">Overlap ⇔ newStart &lt; existingEnd AND existingStart &lt; newEnd</text>
</svg>
