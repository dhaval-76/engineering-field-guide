<svg viewBox="0 0 340 330" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">INSERT "brown " INTO "the quick fox"</text>
  <text x="10" y="44" fill="var(--d-text)" font-weight="600">original buffer <tspan fill="var(--d-muted)" font-weight="400">(read-only)</tspan></text>
  <rect x="10" y="52" width="200" height="28" rx="5" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
  <text x="20" y="71" fill="var(--d-text)" font-family="var(--font-mono)">the quick fox</text>
  <text x="10" y="106" fill="var(--d-text)" font-weight="600">add buffer <tspan fill="var(--d-muted)" font-weight="400">(append-only)</tspan></text>
  <rect x="10" y="114" width="120" height="28" rx="5" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
  <text x="20" y="133" fill="var(--d-text)" font-family="var(--font-mono)">brown </text>
  <text x="10" y="170" fill="var(--d-text)" font-weight="600">pieces, in order</text>
  <g font-family="var(--font-mono)" font-size="11">
    <rect x="10" y="178" width="108" height="44" rx="5" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <text x="18" y="196" fill="var(--d-muted)">orig 0..10</text><text x="18" y="213" fill="var(--d-text)">"the quick "</text>
    <rect x="124" y="178" width="96" height="44" rx="5" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/>
    <text x="132" y="196" fill="var(--d-muted)">add 0..6</text><text x="132" y="213" fill="var(--d-text)">"brown "</text>
    <rect x="226" y="178" width="104" height="44" rx="5" fill="var(--d-info-soft)" stroke="var(--d-info)"/>
    <text x="234" y="196" fill="var(--d-muted)">orig 10..13</text><text x="234" y="213" fill="var(--d-text)">"fox"</text>
  </g>
  <g font-size="11.5">
    <text x="10" y="250" fill="var(--d-text)">Read the pieces left to right: "the quick brown fox".</text>
    <text x="10" y="272" fill="var(--d-muted)" font-size="11">No character of the original moved: the insert appended</text>
    <text x="10" y="288" fill="var(--d-muted)" font-size="11">to the add buffer and split one piece into three.</text>
    <text x="10" y="310" fill="var(--d-muted)" font-size="11">Undo restores the previous piece list.</text>
  </g>
</svg>
