<svg viewBox="0 0 340 400" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">A 45-MINUTE LLD ROUND</text>
  <line x1="30" y1="34" x2="30" y2="338" stroke="var(--d-line)" stroke-width="2"/>
  <g font-size="11" fill="var(--d-muted)" text-anchor="end">
    <text x="334" y="48">0–5 min</text><text x="334" y="98">5–10</text><text x="334" y="148">10–14</text>
    <text x="334" y="198">14–21</text><text x="334" y="252">21–37</text><text x="334" y="312">37–45</text>
  </g>
  <g>
    <circle cx="30" cy="44" r="11" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="30" y="48" text-anchor="middle" fill="var(--d-info)" font-weight="700">1</text>
    <circle cx="30" cy="94" r="11" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="30" y="98" text-anchor="middle" fill="var(--d-info)" font-weight="700">2</text>
    <circle cx="30" cy="144" r="11" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="30" y="148" text-anchor="middle" fill="var(--d-info)" font-weight="700">3</text>
    <circle cx="30" cy="194" r="11" fill="var(--d-plum-soft)" stroke="var(--d-plum)"/><text x="30" y="198" text-anchor="middle" fill="var(--d-plum)" font-weight="700">4</text>
    <circle cx="30" cy="248" r="11" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/><text x="30" y="252" text-anchor="middle" fill="var(--d-ok)" font-weight="700">5</text>
    <circle cx="30" cy="308" r="11" fill="var(--d-warn-soft)" stroke="var(--d-warn)"/><text x="30" y="312" text-anchor="middle" fill="var(--d-warn)" font-weight="700">6</text>
  </g>
  <g fill="var(--d-text)" font-weight="600">
    <text x="52" y="48">Clarify</text><text x="52" y="98">Entities</text><text x="52" y="148">APIs</text>
    <text x="52" y="198">Classes and patterns</text><text x="52" y="252">Code the core flows</text><text x="52" y="312">Harden</text>
  </g>
  <g fill="var(--d-muted)" font-size="11">
    <text x="52" y="64">actors, features in scope, scale, what's out</text>
    <text x="52" y="114">nouns → classes, verbs → methods</text>
    <text x="52" y="164">the operations callers will use</text>
    <text x="52" y="214">relationships, interfaces, named patterns</text>
    <text x="52" y="268">happy path of the 2–3 most important</text>
    <text x="52" y="282">operations, runnable</text>
    <text x="52" y="328">concurrency, edge cases, extensions</text>
  </g>
  <text x="10" y="366" fill="var(--d-text)" font-size="11.5">≈ 40% understanding and design · 40% code · 20% hardening.</text>
  <text x="10" y="384" fill="var(--d-muted)" font-size="11">In a 90-minute machine-coding round, step 5 takes most of the time.</text>
</svg>
