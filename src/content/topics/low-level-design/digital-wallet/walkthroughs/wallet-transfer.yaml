title: A wallet transfer, safely
legend:
  ok: 'key claimed / credit'
  warn: 'debit'
frames:
  - caption: 'Ana sends Bo ₹50 (5,000 paise). The request carries an **idempotency key** generated by the client, so a retried request after a timeout can''t send the money twice.'
    panels:
      - kind: kv
        label: request
        pairs: [[from, ana], [to, bo], [amount, '5000 paise'], [key, req-123]]
  - caption: 'Claim the key first. If it already exists, return the earlier result — no new transaction. In SQL, a UNIQUE constraint on the key does this atomically.'
    panels:
      - kind: rows
        label: idempotency table
        items: [{ v: 'req-123 → txn 6f1c… (new)', tone: ok }]
  - caption: 'Lock both accounts **in a fixed order** (by id). If Bo sends to Ana at the same moment, both requests lock `ana` first, so they queue instead of deadlocking.'
    panels:
      - kind: rows
        label: lock order
        items: ['1. ana', '2. bo']
  - caption: 'Check **available** = balance − held. Then write a balanced pair of **ledger entries** — −5,000 on Ana, +5,000 on Bo — and update the cached balances, all in one transaction.'
    panels:
      - kind: kv
        label: ledger (txn 6f1c…)
        pairs: [[ana, { v: '−5000', tone: warn }], [bo, { v: '+5000', tone: ok }], [sum, '0 ✓']]
  - caption: 'The invariant holds forever: every transaction sums to zero, and each balance equals the sum of its entries. Money is never created or destroyed — only moved — which is what auditors and reconciliation jobs check.'
    panels:
      - kind: kv
        label: balances
        pairs: [[ana, '95,000 → 90,000'], [bo, '5,000 → 10,000']]
