<svg viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg" font-family="var(--font-sans)" font-size="12">
  <defs><marker id="lru-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--d-info)"/></marker></defs>
  <text x="10" y="16" fill="var(--d-muted)" font-weight="600" letter-spacing=".05em">HASH MAP · KEY → NODE</text>
  <g font-family="var(--font-mono)" fill="var(--d-text)">
    <rect x="76" y="26" width="52" height="28" rx="5" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="102" y="45" text-anchor="middle">"D"</text>
    <rect x="144" y="26" width="52" height="28" rx="5" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="170" y="45" text-anchor="middle">"A"</text>
    <rect x="212" y="26" width="52" height="28" rx="5" fill="var(--d-info-soft)" stroke="var(--d-info)"/><text x="238" y="45" text-anchor="middle">"C"</text>
  </g>
  <g fill="none" stroke="var(--d-info)" stroke-width="1.4" marker-end="url(#lru-a)">
    <path d="M102 54 L102 104"/><path d="M170 54 L170 104"/><path d="M238 54 L238 104"/>
  </g>
  <text x="250" y="82" fill="var(--d-muted)" font-size="11">O(1) jump</text>
  <g font-family="var(--font-mono)" font-size="11.5" fill="var(--d-text)">
    <rect x="8" y="106" width="56" height="34" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-dasharray="3 3"/><text x="36" y="127" text-anchor="middle" fill="var(--d-muted)">HEAD</text>
    <rect x="76" y="106" width="52" height="34" rx="5" fill="var(--d-ok-soft)" stroke="var(--d-ok)"/><text x="102" y="127" text-anchor="middle">D:4</text>
    <rect x="144" y="106" width="52" height="34" rx="5" fill="var(--d-bg)" stroke="var(--d-stroke)"/><text x="170" y="127" text-anchor="middle">A:1</text>
    <rect x="212" y="106" width="52" height="34" rx="5" fill="var(--d-bad-soft)" stroke="var(--d-bad)"/><text x="238" y="127" text-anchor="middle">C:3</text>
    <rect x="276" y="106" width="56" height="34" rx="5" fill="var(--d-fill)" stroke="var(--d-stroke)" stroke-dasharray="3 3"/><text x="304" y="127" text-anchor="middle" fill="var(--d-muted)">TAIL</text>
  </g>
  <g stroke="var(--d-line)" stroke-width="1.3">
    <line x1="64" y1="118" x2="76" y2="118"/><line x1="128" y1="118" x2="144" y2="118"/>
    <line x1="196" y1="118" x2="212" y2="118"/><line x1="264" y1="118" x2="276" y2="118"/>
    <line x1="64" y1="130" x2="76" y2="130"/><line x1="128" y1="130" x2="144" y2="130"/>
    <line x1="196" y1="130" x2="212" y2="130"/><line x1="264" y1="130" x2="276" y2="130"/>
  </g>
  <text x="102" y="160" text-anchor="middle" fill="var(--d-ok)" font-size="11">most recent</text>
  <text x="238" y="160" text-anchor="middle" fill="var(--d-bad)" font-size="11">least recent</text>
  <g font-size="11.5">
    <text x="10" y="194" fill="var(--d-text)">Below: a doubly linked list. get / put find the node</text>
    <text x="10" y="210" fill="var(--d-text)">in the map and move it to the front — O(1).</text>
    <text x="10" y="234" fill="var(--d-text)">Full on put: remove tail.prev (C) from the list</text>
    <text x="10" y="250" fill="var(--d-text)">and from the map.</text>
  </g>
</svg>
